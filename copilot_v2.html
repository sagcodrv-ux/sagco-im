<style>
*{box-sizing:border-box;margin:0;padding:0}
#ims-copilot{position:fixed;bottom:24px;right:24px;z-index:9999;font-family:Arial,sans-serif;font-size:13px}
.cop-toggle{width:52px;height:52px;border-radius:50%;background:#1B2A4A;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.cop-toggle svg{width:24px;height:24px;fill:#C9A84C}
.cop-badge{position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;
  background:#E24B4A;color:white;font-size:10px;font-weight:700;display:flex;align-items:center;
  justify-content:center;border:2px solid white}
.cop-panel{width:400px;height:580px;background:white;border-radius:12px;
  box-shadow:0 8px 32px rgba(0,0,0,.18);display:flex;flex-direction:column;
  margin-bottom:10px;overflow:hidden;border:0.5px solid #e0e0e0}
.cop-header{background:#1B2A4A;padding:12px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.cop-header-icon{width:30px;height:30px;border-radius:8px;background:rgba(201,168,76,.2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
.cop-header-title{font-size:13px;font-weight:600;color:white}
.cop-header-sub{font-size:9px;color:rgba(255,255,255,.5);margin-top:1px}
.cop-close{margin-left:auto;background:transparent;border:none;color:rgba(255,255,255,.6);
  cursor:pointer;font-size:18px;line-height:1;padding:2px}
.cop-alerts{flex-shrink:0;border-bottom:1px solid #f0f0f0;max-height:120px;overflow-y:auto}
.alert-item{display:flex;align-items:flex-start;gap:8px;padding:6px 12px;border-bottom:0.5px solid #f5f5f5;font-size:11px}
.alert-item:last-child{border-bottom:none}
.alert-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:3px}
.alert-crit .alert-dot{background:#E24B4A}
.alert-high .alert-dot{background:#EF9F27}
.alert-med .alert-dot{background:#378ADD}
.alert-text{flex:1;color:#333;line-height:1.4}
.alert-link{color:#185FA5;text-decoration:none;font-weight:500}
.alert-dismiss{background:transparent;border:none;color:#aaa;cursor:pointer;font-size:12px;padding:0 2px;flex-shrink:0}
.cop-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.cop-msg{display:flex;gap:6px;max-width:100%}
.cop-msg.user{flex-direction:row-reverse}
.cop-avatar{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;font-size:10px;font-weight:600;margin-top:2px}
.cop-avatar.ai{background:#1B2A4A;color:#C9A84C;font-size:12px}
.cop-avatar.user{background:#E6F1FB;color:#0C447C}
.cop-bubble{padding:8px 10px;border-radius:10px;font-size:11.5px;line-height:1.6;max-width:85%}
.cop-msg.ai .cop-bubble{background:#f5f5f5;border-radius:4px 10px 10px 10px;color:#1a1a1a}
.cop-msg.user .cop-bubble{background:#1B2A4A;color:white;border-radius:10px 4px 10px 10px}
.cop-bubble a{color:#185FA5;text-decoration:none;font-weight:500}
.cop-msg.user .cop-bubble a{color:#90CAF9}
.cop-time{font-size:9px;color:#aaa;margin-top:2px;padding:0 2px}
.cop-msg.user .cop-time{text-align:right}
.card-block{background:white;border:0.5px solid #e0e0e0;border-radius:8px;padding:8px 10px;margin-top:4px;font-size:11px}
.card-title{font-size:11px;font-weight:600;margin-bottom:5px;color:#1B2A4A}
.stat-row{display:grid;gap:4px;margin-bottom:6px}
.stat-box{border-radius:5px;padding:5px 8px;text-align:center;border:0.5px solid #e0e0e0}
.stat-num{font-size:16px;font-weight:600}
.stat-lbl{font-size:9px;color:#666;margin-top:1px}
.data-table{width:100%;border-collapse:collapse;font-size:10px}
.data-table th{background:#f5f5f5;padding:4px 6px;text-align:left;font-weight:600;
  color:#555;border-bottom:1px solid #e0e0e0;font-size:9.5px}
.data-table td{padding:4px 6px;border-bottom:0.5px solid #f0f0f0;color:#333}
.data-table tr:last-child td{border-bottom:none}
.tag-s{display:inline-block;font-size:8px;font-weight:700;border-radius:2px;padding:1px 4px;white-space:nowrap}
.tag-ok{background:#EAF3DE;color:#27500A}.tag-warn{background:#FAEEDA;color:#633806}
.tag-err{background:#FCEBEB;color:#791F1F}.tag-info{background:#E6F1FB;color:#0C447C}
.map-row{display:grid;grid-template-columns:1fr 14px 1fr 40px;gap:3px;align-items:center;
  padding:3px 0;border-bottom:0.5px solid #f0f0f0;font-size:10.5px}
.map-row:last-child{border-bottom:none}
.conf{font-size:8.5px;font-weight:700;border-radius:8px;padding:1px 5px}
.conf-h{background:#EAF3DE;color:#27500A}.conf-m{background:#FAEEDA;color:#633806}.conf-l{background:#FCEBEB;color:#791F1F}
.preview-stat{display:grid;gap:4px;margin-bottom:6px}
.pstat{border-radius:5px;padding:5px;text-align:center;border:0.5px solid #e0e0e0}
.pstat-n{font-size:15px;font-weight:600}.pstat-l{font-size:9px;color:#666;margin-top:1px}
.confirm-btns{display:flex;gap:6px;margin-top:6px}
.btn-yes{flex:1;background:#1B2A4A;color:white;border:none;border-radius:5px;
  padding:6px;font-size:11px;font-weight:600;cursor:pointer}
.btn-no{background:white;color:#666;border:0.5px solid #ccc;border-radius:5px;
  padding:6px 10px;font-size:11px;cursor:pointer}
.typing{display:flex;align-items:center;gap:3px;padding:8px 10px;background:#f5f5f5;border-radius:4px 10px 10px 10px}
.tdot{width:5px;height:5px;border-radius:50%;background:#999;animation:td 1.2s ease-in-out infinite}
.tdot:nth-child(2){animation-delay:.2s}.tdot:nth-child(3){animation-delay:.4s}
@keyframes td{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:.9;transform:scale(1)}}
.cop-input-area{border-top:1px solid #f0f0f0;padding:8px 10px;display:flex;gap:6px;
  align-items:flex-end;flex-shrink:0;background:white}
.file-chip{background:#E6F1FB;border:0.5px solid #B5D4F4;border-radius:5px;padding:3px 7px;
  font-size:10px;color:#0C447C;display:flex;align-items:center;gap:4px;margin-bottom:5px}
.cop-textarea{flex:1;border:0.5px solid #ddd;border-radius:7px;padding:7px 10px;
  font-size:11.5px;resize:none;min-height:32px;max-height:72px;font-family:Arial,sans-serif;
  background:white;color:#1a1a1a;outline:none;line-height:1.4}
.cop-textarea:focus{border-color:#888}
.cop-attach{width:30px;height:30px;border-radius:6px;background:#f5f5f5;border:0.5px solid #ddd;
  cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.cop-attach:hover{background:#ebebeb}
.cop-send{width:30px;height:30px;border-radius:6px;background:#1B2A4A;border:none;
  cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cop-send svg{width:14px;height:14px;fill:#C9A84C}
.cop-hidden{display:none!important}
.chart-wrap{margin-top:6px;position:relative;height:140px}

<div id="ims-copilot">
  <div class="cop-panel cop-hidden" id="copPanel">
    <div class="cop-header">
      <div class="massi-av" data-size="34" style="flex-shrink:0;width:34px;height:44px"></div>
      <div>
        <div class="cop-header-title">MASSI</div>
        <div class="cop-header-sub">ISO 9001 · 14001 · 45001 · 50001 · 37001 · EcoVadis</div>
      </div>
      <button class="cop-close" onclick="togglePanel()" aria-label="Close">&#215;</button>
    </div>
    <div class="cop-alerts" id="copAlerts" style="display:none"></div>
    <div class="cop-msgs" id="copMsgs"></div>
    <div class="cop-input-area">
      <div style="flex:1">
        <div class="file-chip cop-hidden" id="fileChip">
          <span>&#128206;</span>
          <span id="fileChipName"></span>
          <span id="fileChipInfo" style="color:#185FA5;margin-left:2px"></span>
        </div>
        <textarea class="cop-textarea" id="copInput" rows="1"
          placeholder="Ask MASSI anything about your IMS..."
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"
          oninput="this.style.height='32px';this.style.height=this.scrollHeight+'px'"></textarea>
      </div>
      <button class="cop-attach" onclick="document.getElementById('copFile').click()" title="Upload Excel file">&#128206;</button>
      <button class="cop-send" onclick="sendMsg()" aria-label="Send">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
      <input type="file" id="copFile" accept=".xlsx,.xls,.csv" style="display:none">
    </div>
  </div>
  <button class="cop-toggle" onclick="togglePanel()" aria-label="Open MASSI">
    <div class="massi-av" data-size="36" style="width:36px;height:47px"></div>
    <span class="cop-badge" id="alertBadge" style="display:none">0</span>
  </button>
</div>

// ── MASTER GAP 2: fetchSheet — inject live data into Claude context ───────────
async function fetchSheet(tabKey, limit = 100) {
  try {
    const url = SHEETS_URL + '?tab=' + tabKey + (limit ? '&limit=' + limit : '');
    const r = await fetch(url);
    const data = await r.json();
    return data;
  } catch(e) { return null; }
}

// ── analyzeRows — client-side pre-processor ───────────────────────────────────
function analyzeRows(rows, headers) {
  if (!rows || !rows.length) return {count: 0, byStatus: {}, overdue: []};
  const today = new Date();
  const statusIdx = headers.findIndex(h => /status|state/i.test(h));
  const dateIdx   = headers.findIndex(h => /due|expiry|next/i.test(h));
  const byStatus = {};
  const overdue = [];
  rows.forEach(row => {
    const status = statusIdx >= 0 ? String(row[statusIdx] || '') : '';
    if (status) byStatus[status] = (byStatus[status] || 0) + 1;
    if (dateIdx >= 0 && row[dateIdx]) {
      const d = new Date(row[dateIdx]);
      if (!isNaN(d) && d < today) {
        const days = Math.floor((today - d) / 86400000);
        overdue.push({row, days, dateVal: row[dateIdx]});
      }
    }
  });
  return {count: rows.length, byStatus, overdue};
}

// ── MASTER GAP 3: initAlerts — runs before welcome message ────────────────────
async function initAlerts() {
  const cached = localStorage.getItem('cop_alerts_cache');
  const cacheTime = localStorage.getItem('cop_alerts_time');
  if (cached && cacheTime && (Date.now() - parseInt(cacheTime)) < 300000) {
    state.alerts = JSON.parse(cached);
    renderAlertBanner();
    return;
  }

  const today = new Date();
  const alerts = [];
  const daysUntilS1 = Math.floor((new Date('2026-08-25') - today) / 86400000);
  const daysUntilS2 = Math.floor((new Date('2026-09-22') - today) / 86400000);

  if (daysUntilS1 > 0 && daysUntilS1 <= 60) {
    alerts.push({sev:'crit', text: 'Stage 1 audit in ' + daysUntilS1 + ' days — 25-26 Aug 2026', page:'audit-programme.html', id:'audit-s1', undismissable: true});
  }
  if (daysUntilS2 > 0 && daysUntilS2 <= 90) {
    alerts.push({sev:'high', text: 'Stage 2 audit in ' + daysUntilS2 + ' days — 22-26 Sep 2026', page:'audit-programme.html', id:'audit-s2', undismissable: true});
  }

  alerts.push({sev:'crit', text:'CAPA-2026-001 PTW discrepancy — OPEN — HSSE Manager', page:'capa-register.html', id:'capa-001', undismissable:true});
  alerts.push({sev:'crit', text:'CAPA-2026-002 Emergency drill overdue — OPEN — HSSE Manager', page:'capa-register.html', id:'capa-002', undismissable:true});
  alerts.push({sev:'high', text:'CAPA-2026-003 Group A OH programmes pending approval', page:'capa-register.html', id:'capa-003'});
  alerts.push({sev:'high', text:'CAPA-2026-004 Fire extinguisher inspection records missing', page:'fire-extinguisher-log.html', id:'capa-004'});
  alerts.push({sev:'high', text:'CEO signatures pending on 7 of 9 L1 policies', page:'policies-hub.html', id:'ceo-sigs', undismissable:true});
  alerts.push({sev:'high', text:'EnMS Champion appointment — CEO signature pending', page:'enms-champion.html', id:'enms-champ'});
  alerts.push({sev:'crit', text:'HIRA documentation E-03 BEHIND — overdue since Jun 2026', page:'hira.html', id:'hira-e03', undismissable:true});
  alerts.push({sev:'high', text:'F4 SHC +119 kcal/kg above age-adjusted target — URGENT', page:'furnace-monitoring.html', id:'f4-shc'});

  const sheets = Object.entries(THRESHOLDS);
  for (const [tabKey, rule] of sheets) {
    const data = await fetchSheet(tabKey, 200);
    if (!data || !data.rows || !data.rows.length) {
      alerts.push({sev:'med', text: rule.label + ' register — no data in Google Sheets', page: Object.keys(REGISTERS).find(k => REGISTERS[k].tab === tabKey) || '#', id:'empty-'+tabKey});
      continue;
    }
    const hdrs = data.headers || [];
    const dateIdx = hdrs.findIndex(h => h && h.toLowerCase().includes(rule.dateField.toLowerCase().split(' ')[0]));
    if (dateIdx < 0) continue;
    const today2 = new Date();
    let overdueCount = 0; let warnCount = 0;
    data.rows.forEach(row => {
      const d = new Date(row[dateIdx]);
      if (isNaN(d)) return;
      const daysLeft = Math.floor((d - today2) / 86400000);
      if (daysLeft < rule.critDays) overdueCount++;
      else if (daysLeft < rule.warnDays) warnCount++;
    });
    const page = Object.keys(REGISTERS).find(k => REGISTERS[k].tab === tabKey) || '#';
    if (overdueCount > 0) alerts.push({sev:'crit', text: rule.label + ': ' + overdueCount + ' overdue', page, id:'overdue-'+tabKey});
    else if (warnCount > 0) alerts.push({sev:'high', text: rule.label + ': ' + warnCount + ' due within ' + rule.warnDays + ' days', page, id:'warn-'+tabKey});
  }

  state.alerts = alerts.filter(a => !state.dismissedAlerts.has(a.id));
  localStorage.setItem('cop_alerts_cache', JSON.stringify(alerts));
  localStorage.setItem('cop_alerts_time', Date.now().toString());
  renderAlertBanner();
}

function renderAlertBanner() {
  const visible = state.alerts.filter(a => !state.dismissedAlerts.has(a.id));
  const el = document.getElementById('copAlerts');
  const badge = document.getElementById('alertBadge');
  const critCount = visible.filter(a => a.sev === 'crit').length;
  badge.textContent = visible.length;
  badge.style.display = visible.length > 0 ? 'flex' : 'none';
  if (!visible.length) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.innerHTML = visible.slice(0, 6).map(a => {
    const sev = a.sev === 'crit' ? 'alert-crit' : a.sev === 'high' ? 'alert-high' : 'alert-med';
    const dismiss = a.undismissable ? '' : '<button class="alert-dismiss" onclick="dismissAlert(\''+a.id+'\')">&#215;</button>';
    return '<div class="alert-item '+sev+'"><div class="alert-dot"></div><div class="alert-text">'+a.text+' — <a class="alert-link" href="'+a.page+'">View</a></div>'+dismiss+'</div>';
  }).join('');
  if (visible.length > 6) {
    el.innerHTML += '<div style="text-align:center;padding:5px;font-size:10px;color:#888">+'+(visible.length-6)+' more alerts</div>';
  }

function processExcel(hint) {

function detectRegister(headers, hint) {
  const hl = headers.map(h => h.toLowerCase());
  const hintL = (hint || '').toLowerCase();
  let best = null; let bestScore = 0;
  Object.entries(REGISTERS).forEach(([file, r]) => {
    if (!r.tab) return;
    let score = 0;
    if (hintL.includes(r.name.toLowerCase().split(' ')[0])) score += 50;
    headers.forEach(h => {
      if (r.name.toLowerCase().includes(h.toLowerCase().split(' ')[0]) && h.length > 3) score += 10;
    });
    if (score > bestScore) { bestScore = score; best = {file, ...r}; }
  });
  return bestScore >= 10 ? best : null;
}

function buildMapping(headers, reg) {
  const fields = ['ID','Name','Date','Status','Owner','Location','Type','Description','Due Date','Next Due'];
  const mapping = {};
  fields.forEach(field => {
    const fl = field.toLowerCase();
    let bestIdx = null; let bestScore = 0;
    headers.forEach((h, i) => {
      const hl2 = h.toLowerCase();
      let score = hl2 === fl ? 100 : (hl2.includes(fl) || fl.includes(hl2) ? 70 : 0);
      if (score > bestScore) { bestScore = score; bestIdx = i; }
    });
    mapping[field] = {col: bestScore >= 50 ? bestIdx : null, header: bestScore >= 50 ? headers[bestIdx] : null, score: bestScore};
  });
  return mapping;
}

function buildMappingCard(reg, mapping) {
  const mapped = Object.entries(mapping).filter(([,m]) => m.col !== null);
  let html = '<div class="card-block"><div class="card-title">&#128203; Detected: ' + reg.name + ' · ' + reg.iso + '</div>';
  html += '<div style="font-size:10px;color:#666;margin-bottom:6px">' + mapped.length + ' columns mapped · ' + reg.tab + ' → ' + (reg.file || '') + '</div>';
  mapped.slice(0,6).forEach(([field, m]) => {
    const cls = m.score >= 75 ? 'conf-h' : m.score >= 50 ? 'conf-m' : 'conf-l';
    html += '<div class="map-row"><span style="color:#666">' + m.header + '</span><span style="color:#aaa;text-align:center">→</span><span style="font-weight:600">' + field + '</span><span class="conf ' + cls + '">' + (m.score >= 75 ? 'High' : 'Med') + '</span></div>';
  });
  html += '</div>';
  return html;
}

function runValidation(reg, parsed, mapping) {
  const existing = new Set(['CAL-001','CAL-002','CAL-003','CAPA-2026-001','CAPA-2026-002','RISK-001']);
  const keyCol = mapping['ID'] && mapping['ID'].col !== null ? mapping['ID'].col : 0;

// Q8-gap-1: TIME-AWARE DATA LAYER
// Month format confirmed: short names Jan/Feb/Mar, dash = no data
// ═══════════════════════════════════════════════════════════════════════════════
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function parseMonthCols(headers) {
  const cols = [];
  headers.forEach((h, i) => {
    if (MONTHS.includes(h)) cols.push({idx: i, month: h, monthNum: MONTHS.indexOf(h)});
  });
  return cols;
}

function parseTarget(targetStr) {
  if (!targetStr || targetStr === '—') return {value: null, dir: null};
  const s = String(targetStr).trim();
  if (s.startsWith('≤')) return {value: parseFloat(s.slice(1).replace('%','')), dir: 'lte'};
  if (s.startsWith('≥')) return {value: parseFloat(s.slice(1).replace('%','')), dir: 'gte'};
  return {value: parseFloat(s.replace('%','')), dir: 'eq'};
}

function getMonthData(rows, headers, monthName) {
  const mCols = parseMonthCols(headers);
  const mCol  = mCols.find(m => m.month === monthName);
  if (!mCol) return null;
  const nameIdx   = headers.indexOf('KPI Name');
  const targetIdx = headers.indexOf('Target');
  const unitIdx   = headers.indexOf('Unit');
  const ownerIdx  = headers.indexOf('Owner');
  return rows.map(row => ({
    name:   row[nameIdx]   || '',
    value:  row[mCol.idx] !== '—' ? parseFloat(String(row[mCol.idx]).replace('%','')) : null,
    target: row[targetIdx] || '',
    unit:   row[unitIdx]   || '',
    owner:  row[ownerIdx]  || '',
  })).filter(r => r.value !== null);
}

function comparePeriods(rows, headers, month1, month2) {
  const d1 = getMonthData(rows, headers, month1);
  const d2 = getMonthData(rows, headers, month2);
  if (!d1 || !d2) return null;
  return d1.map((item, i) => {
    const prev = d1[i].value;
    const curr = d2[i] ? d2[i].value : null;
    const delta = (prev !== null && curr !== null) ? +(curr - prev).toFixed(2) : null;
    return {...item, prevValue: prev, currValue: curr, delta,
      direction: delta === null ? '—' : delta > 0.5 ? '▲' : delta < -0.5 ? '▼' : '→'};
  });
}

function getCurrentMonth() {
  return MONTHS[new Date().getMonth()];
}

function getPrevMonth() {
  const m = new Date().getMonth();
  return MONTHS[m === 0 ? 11 : m - 1];
}

// Q8-gap-3: FILTERED ROW QUERY ENGINE
// ═══════════════════════════════════════════════════════════════════════════════
function filterRows(rows, headers, field, value) {
  const idx = headers.findIndex(h => h.toLowerCase() === field.toLowerCase());
  if (idx < 0) return rows;
  const val = value.toLowerCase();
  return rows.filter(row => String(row[idx] || '').toLowerCase().includes(val));
}

function sortRows(rows, headers, field, direction = 'desc') {
  const idx = headers.findIndex(h => h.toLowerCase() === field.toLowerCase());
  if (idx < 0) return rows;
  return [...rows].sort((a, b) => {
    const av = parseFloat(String(a[idx]).replace(/[^0-9.-]/g,'')) || 0;
    const bv = parseFloat(String(b[idx]).replace(/[^0-9.-]/g,'')) || 0;
    return direction === 'desc' ? bv - av : av - bv;
  });
}

function topN(rows, n) { return rows.slice(0, n); }

// ═══════════════════════════════════════════════════════════════════════════════
function analyzeRowsFull(rows, headers) {
  if (!rows || !rows.length) return {count:0, byStatus:{}, overdue:[], trends:[], belowTarget:[]};
  const today    = new Date();
  const statusIdx= headers.findIndex(h => /^status$/i.test(h));
  const dateIdx  = headers.findIndex(h => /due|expiry|next/i.test(h));
  const ownerIdx = headers.findIndex(h => /owner|responsible/i.test(h));
  const byStatus = {}, overdue = [], byOwner = {};

  rows.forEach(row => {
    const status = statusIdx >= 0 ? String(row[statusIdx]||'') : '';
    if (status) byStatus[status] = (byStatus[status]||0) + 1;
    const owner  = ownerIdx  >= 0 ? String(row[ownerIdx] ||'') : '';
    if (owner) byOwner[owner] = (byOwner[owner]||0) + 1;
    if (dateIdx >= 0 && row[dateIdx]) {
      const d = new Date(row[dateIdx]);
      if (!isNaN(d) && d < today) {
        overdue.push({data: row, days: Math.floor((today-d)/86400000)});
      }
    }
  });

  // KPI trend analysis (if this is the KPI sheet)
  const mCols = parseMonthCols(headers);
  const targetIdx = headers.indexOf('Target');
  const trends = [], belowTarget = [];
  if (mCols.length >= 2 && targetIdx >= 0) {
    rows.forEach(row => {
      const nameIdx = headers.indexOf('KPI Name');
      const name    = nameIdx >= 0 ? row[nameIdx] : '';
      const actuals = mCols.map(m => row[m.idx]).filter(v => v && v !== '—')
                           .map(v => parseFloat(String(v).replace(/[^0-9.-]/g,'')))
                           .filter(v => !isNaN(v));
      if (actuals.length >= 2) {
        const first = actuals[0], last = actuals[actuals.length-1];
        const delta = +(last - first).toFixed(2);
        const tgt   = parseTarget(row[targetIdx]);
        let atRisk  = false;
        if (tgt.value !== null) {
          if (tgt.dir === 'lte' && last > tgt.value)  { atRisk = true; belowTarget.push({name, last, target: row[targetIdx]}); }
          if (tgt.dir === 'gte' && last < tgt.value)  { atRisk = true; belowTarget.push({name, last, target: row[targetIdx]}); }
          if (tgt.dir === 'eq'  && Math.abs(last - tgt.value) > tgt.value * 0.1) { atRisk = true; }
        }
        trends.push({name, actuals, delta, direction: delta > 0.5 ? '▲' : delta < -0.5 ? '▼' : '→', atRisk});
      }
    });
  }

  return {count: rows.length, byStatus, byOwner, overdue, trends, belowTarget};
}

// Q7-gap-2: fetchInsightContext — 7 sheets in parallel
// ═══════════════════════════════════════════════════════════════════════════════
async function fetchInsightContext() {
  const tabs = ['risks','sea','capa','incidents','nonconforming','kpi_dashboard','audit_programme'];
  const results = await Promise.allSettled(tabs.map(t => fetchSheet(t, 100)));
  const ctx = {};
  tabs.forEach((t, i) => {
    if (results[i].status === 'fulfilled' && results[i].value) {
      const d = results[i].value;
      const analysis = analyzeRowsFull(d.rows || [], d.headers || []);
      ctx[t] = {count: analysis.count, byStatus: analysis.byStatus, overdue: analysis.overdue.length,
                belowTarget: analysis.belowTarget, trends: analysis.trends,
                sample: (d.rows || []).slice(0,3)};
    }
  });
  return ctx;
}

// Q7-gap-1 (complete): WG scoring — aggregate by department
// ═══════════════════════════════════════════════════════════════════════════════
function scoreWorkingGroups(insightCtx) {
  const wgScore = {WG1:{open:0,overdue:0,label:'Plant & Quality',kpis:[]},
                   WG2:{open:0,overdue:0,label:'SHEE Energy & ENV',kpis:[]},
                   WG3:{open:0,overdue:0,label:'People Ethics & Procurement',kpis:[]},
                   ALL:{open:0,overdue:0,label:'IMS Steering',kpis:[]}};

  ['capa','incidents','nonconforming'].forEach(tab => {
    const d = insightCtx[tab];
    if (!d) return;
    (d.byStatus ? Object.entries(d.byStatus) : []).forEach(([status, count]) => {
      if (/open|overdue|pending/i.test(status)) wgScore.WG2.open += count;
    });
    wgScore.WG2.overdue += d.overdue || 0;
  });

  if (insightCtx.kpi_dashboard && insightCtx.kpi_dashboard.belowTarget) {
    insightCtx.kpi_dashboard.belowTarget.forEach(kpi => {
      const owner = kpi.owner || '';
      const wg    = DEPARTMENT_MAP[owner] || 'WG2';
      if (wgScore[wg]) wgScore[wg].kpis.push(kpi.name);
    });
  }

  return Object.entries(wgScore).map(([wg, data]) => {
    const score = data.open * 2 + data.overdue * 3 + data.kpis.length;
    const rag   = score >= 8 ? 'RED' : score >= 4 ? 'AMBER' : 'GREEN';
    return {wg, ...data, score, rag};
  }).sort((a,b) => b.score - a.score);
}

// Q7-gap-3: PRIORITY SCORING MODEL
// ═══════════════════════════════════════════════════════════════════════════════
function scorePriority(items) {
  const today        = new Date();
  const s2Date       = new Date('2026-09-22');
  const daysToS2     = Math.max(1, Math.floor((s2Date - today) / 86400000));
  const S2_BLOCKERS  = new Set(['capa-2026-001','capa-2026-002','capa-2026-003','capa-2026-004','hira-e03']);

  return items.map(item => {
    let score = 0;
    const idL = (item.id || '').toLowerCase();
    if (S2_BLOCKERS.has(idL))                    score += 100;
    if (/critical|blocker/i.test(item.severity)) score += 50;
    if (/high/i.test(item.severity))             score += 25;
    if (item.dueDate) {
      const daysLeft = Math.floor((new Date(item.dueDate) - today) / 86400000);
      if (daysLeft < 0)   score += 60;
      else if (daysLeft < 14) score += 30;
      else if (daysLeft < 30) score += 15;
    }
    const urgency = Math.max(1, Math.floor(100 / daysToS2));
    score += urgency;
    return {...item, priorityScore: score};
  }).sort((a,b) => b.priorityScore - a.priorityScore).slice(0, 5);
}

// Q4-gap-2: CLIENT-SIDE DOCUMENT SEARCH
// ═══════════════════════════════════════════════════════════════════════════════
function searchDocs(query) {
  const q = query.toLowerCase();
  const results = [];
  Object.entries(REGISTERS).forEach(([file, r]) => {
    let score = 0;
    if (r.name.toLowerCase().includes(q))        score += 30;
    if (file.replace(/-/g,' ').includes(q))      score += 20;
    if ((r.iso  ||'').toLowerCase().includes(q)) score += 25;
    if ((r.proc ||'').toLowerCase().includes(q)) score += 15;
    if ((r.wg   ||'').toLowerCase().includes(q)) score += 10;
    if (score > 0) results.push({file, ...r, score});
  });
  return results.sort((a,b) => b.score - a.score).slice(0,5);
}

// Q10-gap-2: CAPA AUTO-PROPOSAL from incident grouping
// ═══════════════════════════════════════════════════════════════════════════════
async function generateCapaProposal() {
  const data = await fetchSheet('incidents', 200);
  if (!data || !data.rows || !data.rows.length) return null;
  const headers = data.headers || [];
  const rootIdx = headers.findIndex(h => /root.?cause/i.test(h));
  const typeIdx = headers.findIndex(h => /^type$|^category$/i.test(h));
  const descIdx = headers.findIndex(h => /description|details/i.test(h));
  if (rootIdx < 0) return null;
  const grouped = {};
  data.rows.forEach(row => {
    const rc = String(row[rootIdx]||'').trim();
    if (!rc || rc === '—') return;
    if (!grouped[rc]) grouped[rc] = [];
    grouped[rc].push(row);
  });
  const recurring = Object.entries(grouped).filter(([,rows]) => rows.length >= 2)
                      .sort((a,b) => b[1].length - a[1].length);
  if (!recurring.length) return null;
  const [topRc, topRows] = recurring[0];
  const incidentIds = topRows.map(r => r[0] || '').filter(Boolean).join(', ');
  return {
    rootCause: topRc, count: topRows.length, incidentIds,
    draftCapa: {
      id:          'CAPA-' + new Date().getFullYear() + '-' + String(Math.floor(Math.random()*900)+100),
      date:         new Date().toLocaleDateString('en-GB'),
      source:       'Incident trend analysis — ' + topRows.length + ' recurring incidents',
      description:  'Recurring incidents with root cause: ' + topRc,
      rootCause:    topRc,
      action:       'Conduct root cause workshop, update HIRA, revise relevant procedure, verify effectiveness within 30 days',
      owner:        'HSSE Manager',
      dueDate:      new Date(Date.now() + 30*86400000).toLocaleDateString('en-GB'),
      status:       'OPEN',
    }
  };
}

// Q10-gap-5: ECOVADIS SCORE CALCULATOR
// ═══════════════════════════════════════════════════════════════════════════════
async function ecovadisScoreCalculator() {
  const themes = {
    Environment: {weight:0.25, tabs:['ghg_inventory','water_waste','waste_mgmt'], score:0},
    Labour:      {weight:0.25, tabs:['training','diversity','induction'], score:0},
    Ethics:      {weight:0.25, tabs:['coi','tpdd','speak_up'], score:0},
    Procurement: {weight:0.25, tabs:['supplier_esg','supplier_scoc'], score:0},
  };
  for (const [theme, cfg] of Object.entries(themes)) {
    let completeness = 0; let checked = 0;
    for (const tab of cfg.tabs) {
      const d = await fetchSheet(tab, 50);
      if (d && d.rows) {
        const rowCount = d.rows.filter(r => r.some(c => c && String(c).trim())).length;
        completeness += rowCount > 0 ? Math.min(100, rowCount * 10) : 0;
        checked++;
      }
    }
    cfg.score = checked > 0 ? Math.round(completeness / checked) : 0;
  }
  const totalScore = Math.round(Object.values(themes).reduce((s, t) => s + t.score * t.weight, 0));
  const silverGap  = Math.max(0, 65 - totalScore);
  const actions = [
    {action:'Complete supplier ESG assessments (10 strategic suppliers)', impact:4, owner:'Procurement Manager', deadline:'31 Jul 2026', tab:'supplier_esg'},
    {action:'Publish GRI-aligned Annual ESG Report', impact:5, owner:'IMS Coordinator', deadline:'31 Jul 2026', tab:'ghg_inventory'},
    {action:'Water consumption data disclosure', impact:3, owner:'Deputy Plant Manager', deadline:'31 Jul 2026', tab:'water_waste'},
    {action:'Gender diversity ratio baseline 2026', impact:3, owner:'HR Manager', deadline:'31 Dec 2026', tab:'diversity'},
  ].sort((a,b) => b.impact - a.impact);
  return {themes, totalScore, silverGap, silverTarget:65, actions};
}

// Q10-gap-3: PREVENTIVE ACTION FROM HIRA RESIDUAL RISK
// ═══════════════════════════════════════════════════════════════════════════════
async function preventiveActionsFromHIRA() {
  const [hiraData, incidentData] = await Promise.all([fetchSheet('hira',200), fetchSheet('incidents',200)]);
  if (!hiraData || !hiraData.rows) return [];
  const hHeaders = hiraData.headers || [];
  const residIdx = hHeaders.findIndex(h => /residual/i.test(h));
  const actIdx   = hHeaders.findIndex(h => /^activity$|^task$/i.test(h));
  const hazIdx   = hHeaders.findIndex(h => /hazard/i.test(h));
  const ctrlIdx  = hHeaders.findIndex(h => /control/i.test(h));
  if (residIdx < 0) return [];
  const incidentHazards = new Set();
  if (incidentData && incidentData.rows) {
    const iHeaders = incidentData.headers || [];
    const descIdx  = iHeaders.findIndex(h => /description|details/i.test(h));
    incidentData.rows.forEach(r => {
      if (descIdx >= 0) incidentHazards.add(String(r[descIdx]||'').toLowerCase().slice(0,20));
    });
  }
  const highRisk = hiraData.rows.filter(row => {
    const residual = String(row[residIdx]||'').toUpperCase();
    return residual === 'HIGH' || residual === 'CRITICAL';
  });
  return highRisk.slice(0,5).map(row => ({
    activity:      actIdx  >= 0 ? row[actIdx]  : 'Unknown activity',
    hazard:        hazIdx  >= 0 ? row[hazIdx]  : 'Unknown hazard',
    residualRisk:  row[residIdx],
    existingControls: ctrlIdx >= 0 ? row[ctrlIdx] : '',
    hasIncident:   false,
    proposedPA:    'Verify effectiveness of existing controls. Schedule field inspection. Consider additional engineering control if administrative controls alone are insufficient.',
    owner:         'HSSE Manager',
    dueDate:       new Date(Date.now() + 45*86400000).toLocaleDateString('en-GB'),
  }));
}

let chartCounter = 0;
function buildChartCard(title, chartConfig) {
  const id = 'cop-chart-' + (++chartCounter);
  setTimeout(() => {
    const canvas = document.getElementById(id);
    if (canvas) renderChart(id, chartConfig.type, chartConfig.labels, chartConfig.datasets, title);

  return '<div class="card-block"><div class="card-title">' + title + '</div><div class="chart-wrap"><canvas id="' + id + '"></canvas></div></div>';
}

function buildKPITrendChart(rows, headers) {
  const mCols   = parseMonthCols(headers);
  const nameIdx = headers.indexOf('KPI Name');
  const actuals = rows.slice(0,4).map(row => ({
    name:   (row[nameIdx]||'').split(' ').slice(0,2).join(' '),
    data:   mCols.map(m => row[m.idx] !== '—' ? parseFloat(String(row[m.idx]).replace(/[^0-9.-]/g,'')) || null : null),
  }));
  const colors = ['#1B2A4A','#378ADD','#EF9F27','#E24B4A'];
  return buildChartCard('KPI trend — Jan to ' + (mCols[mCols.length-1]||{month:''}).month, {
    type: 'line',
    labels: mCols.map(m => m.month),
    datasets: actuals.map((a,i) => ({label:a.name, data:a.data, borderColor:colors[i%4], tension:0.3, fill:false, spanGaps:true})),
  });
}

function buildKPISummaryTable(rows, headers) {
  const nameIdx  = headers.indexOf('KPI Name');
  const statusIdx= headers.indexOf('Status');
  const targetIdx= headers.indexOf('Target');
  const ownerIdx = headers.indexOf('Owner');
  const mCols    = parseMonthCols(headers);
  const lastMCol = mCols.filter(m => rows.some(r => r[m.idx] && r[m.idx] !== '—')).pop();
  let html = '<div class="card-block"><div class="card-title">KPI summary</div><table class="data-table"><thead><tr><th>KPI</th><th>Latest</th><th>Target</th><th>Status</th></tr></thead><tbody>';
  rows.forEach(row => {
    const status = row[statusIdx]||'';
    const cls    = /at.risk|behind/i.test(status) ? 'tag-err' : /track|complete/i.test(status) ? 'tag-ok' : 'tag-warn';
    const latest = lastMCol ? row[lastMCol.idx] : '—';
    html += '<tr><td>' + (row[nameIdx]||'') + '</td><td><b>' + latest + '</b></td><td>' + (row[targetIdx]||'') + '</td><td><span class="tag-s ' + cls + '">' + status + '</span></td></tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

  }

  // EcoVadis analysis
  if (lower.includes('ecovadis') || lower.includes('silver') || lower.includes('esg score')) {
    appendAI('Calculating EcoVadis score estimate from live register data…');
    const calc = await ecovadisScoreCalculator();
    let html = '<div class="card-block"><div class="card-title">&#127941; EcoVadis score estimate</div>';
    html += '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:4px;margin-bottom:8px">';
    Object.entries(calc.themes).forEach(([theme, cfg]) => {
      html += '<div class="pstat" style="background:#f5f5f5"><div class="pstat-n" style="font-size:16px;color:#1B2A4A">' + cfg.score + '</div><div class="pstat-l">' + theme + ' (25%)</div></div>';
    });
    html += '</div>';
    const gapCls = calc.silverGap === 0 ? 'tag-ok' : 'tag-err';
    html += '<div style="text-align:center;padding:8px;background:' + (calc.silverGap > 0 ? '#FCEBEB' : '#EAF3DE') + ';border-radius:6px;margin-bottom:6px">' +
      '<div style="font-size:18px;font-weight:700;color:' + (calc.silverGap > 0 ? '#791F1F' : '#27500A') + '">' + calc.totalScore + '/100</div>' +
      '<div style="font-size:10px;color:#666">Estimated score · Silver threshold: 65 · Gap: ' + calc.silverGap + ' points</div></div>';
    html += '<div style="font-size:10px;font-weight:600;margin-bottom:4px">Priority actions to close the gap:</div>';
    calc.actions.forEach(a => {
      html += '<div style="font-size:10px;padding:3px 0;border-bottom:0.5px solid #f0f0f0">+' + a.impact + ' pts · ' + a.action + ' — <span style="color:#888">' + a.owner + ' · ' + a.deadline + '</span></div>';
    });
    html += '</div>';
    appendAI(null, html);
    return true;
  }

  // CAPA proposal
  if (lower.includes('capa proposal') || lower.includes('suggest capa') || lower.includes('draft capa') || lower.includes('recurring incident')) {
    appendAI('Analysing incident patterns for recurring root causes…');
    const proposal = await generateCapaProposal();
    if (proposal) {
      let html = '<div class="card-block"><div class="card-title">&#128203; CAPA proposal — auto-generated</div>';
      html += '<div style="font-size:10px;margin-bottom:6px;color:#666">Based on <b>' + proposal.count + ' incidents</b> with root cause: "' + proposal.rootCause + '" (' + proposal.incidentIds + ')</div>';
      const c = proposal.draftCapa;
      html += '<table class="data-table"><tbody>';
      Object.entries(c).forEach(([k,v]) => {
        html += '<tr><td style="color:#888;white-space:nowrap">' + k + '</td><td><b>' + v + '</b></td></tr>';
      });
      html += '</tbody></table>';
      html += '<div class="confirm-btns"><button class="btn-yes" onclick="confirmCapa()">Write to CAPA register</button><button class="btn-no" onclick="this.parentElement.remove()">Dismiss</button></div>';
      html += '</div>';
      state.pendingCapa = proposal.draftCapa;
      appendAI(null, html);
    } else {
      appendAI('No recurring root causes found in the incident register — fewer than 2 incidents share the same root cause at this time.');
    }
    return true;
  }

  // Preventive actions from HIRA
  if (lower.includes('preventive') || lower.includes('pa from') || lower.includes('hira risk')) {
    appendAI('Fetching high residual risk items from HIRA register…');
    const pas = await preventiveActionsFromHIRA();
    if (pas.length) {
      let html = '<div class="card-block"><div class="card-title">&#128737; Proposed preventive actions — from HIRA residual risk</div>';
      pas.forEach(pa => {
        html += '<div style="padding:5px 0;border-bottom:0.5px solid #f0f0f0;font-size:10.5px"><b>' + pa.activity + '</b> — ' + pa.hazard + '<br><span style="color:#888">Residual risk: <b style="color:#791F1F">' + pa.residualRisk + '</b> · ' + pa.proposedPA + '</span><br><span style="color:#aaa">Owner: ' + pa.owner + ' · Due: ' + pa.dueDate + '</span></div>';
      });
      html += '</div>';
      appendAI(null, html);
    } else {
      appendAI('No HIGH or CRITICAL residual risk items found in the HIRA register, or the register needs data entry first.');
    }
    return true;
  }

  return false; // not handled — fall through to callClaude
}

async function confirmCapa() {
  if (!state.pendingCapa) return;
  const row = Object.values(state.pendingCapa);
  try {
    await fetch(SHEETS_URL + '?action=write&tab=capa', {method:'POST', body:JSON.stringify([state.pendingCapa])});
    localStorage.setItem('forceRefresh_capa', Date.now().toString());
    appendAI('CAPA <b>' + state.pendingCapa.id + '</b> written to the CAPA Register. <a href="capa-register.html" style="color:#185FA5">View CAPA Register →</a>');
  } catch(e) {
    appendAI('CAPA drafted — upload to Google Sheets manually or check the Apps Script connection.');
  }
  state.pendingCapa = null;
}


const MASSI_NAVY='#1B2A4A',MASSI_GOLD='#C9A84C',MASSI_FACE='#2A4A7A',MASSI_LIGHT='#E8F0FB';
function buildMassi(size,state){
  const s=size,cx=s/2,cy=s/2,r=s*0.46;
  const eyeY=cy-s*0.06,eyeOff=s*0.13,eyeR=s*0.065,pupilR=eyeR*0.55,mouthY=cy+s*0.15;
  const antY=cy-r-s*0.04;
  let ring='',arm='',bodyA='',eyeA='',pupilA='',mouth='';
  if(state==='idle'){
    eyeA='style="transform-origin:'+cx+'px '+eyeY+'px;animation:massi-blink 4s ease-in-out infinite"';
    mouth='<path d="M'+(cx-s*.1)+' '+mouthY+' Q'+cx+' '+(mouthY+s*.06)+' '+(cx+s*.1)+' '+mouthY+'" stroke="'+MASSI_GOLD+'" stroke-width="'+(s*.025)+'" stroke-linecap="round" fill="none"/>';
    bodyA='style="animation:massi-float 3s ease-in-out infinite"';
  } else if(state==='greeting'){
    mouth='<path d="M'+(cx-s*.12)+' '+mouthY+' Q'+cx+' '+(mouthY+s*.1)+' '+(cx+s*.12)+' '+mouthY+'" stroke="'+MASSI_GOLD+'" stroke-width="'+(s*.025)+'" stroke-linecap="round" fill="none"/>';
    arm='<g style="transform-origin:'+(cx+r*.8)+'px '+(cy-r*.1)+'px;animation:massi-wave 1.5s ease-in-out infinite"><rect x="'+(cx+r*.75)+'" y="'+(cy-r*.3)+'" width="'+(s*.09)+'" height="'+(s*.26)+'" rx="'+(s*.04)+'" fill="'+MASSI_LIGHT+'" stroke="'+MASSI_NAVY+'" stroke-width="'+(s*.018)+'"/><circle cx="'+(cx+r*.8)+'" cy="'+(cy-r*.28)+'" r="'+(s*.05)+'" fill="'+MASSI_GOLD+'"/></g>';
    bodyA='style="animation:massi-nod .6s ease-in-out 2"';
  } else if(state==='thinking'){
    pupilA='style="animation:massi-scan 1s ease-in-out infinite"';
    mouth='<path d="M'+(cx-s*.08)+' '+(mouthY+s*.01)+' Q'+cx+' '+(mouthY-s*.03)+' '+(cx+s*.08)+' '+(mouthY+s*.01)+'" stroke="'+MASSI_GOLD+'" stroke-width="'+(s*.022)+'" stroke-linecap="round" fill="none"/>';
    ring='<circle cx="'+cx+'" cy="'+(cy+r*1.4)+'" r="3" fill="'+MASSI_GOLD+'" style="animation:massi-t1 1.2s ease-in-out infinite"/><circle cx="'+(cx+s*.14)+'" cy="'+(cy+r*1.4)+'" r="3" fill="'+MASSI_GOLD+'" style="animation:massi-t2 1.2s ease-in-out infinite"/><circle cx="'+(cx-s*.14)+'" cy="'+(cy+r*1.4)+'" r="3" fill="'+MASSI_GOLD+'" style="animation:massi-t3 1.2s ease-in-out infinite"/>';
  } else if(state==='success'){
    mouth='<path d="M'+(cx-s*.14)+' '+(mouthY-s*.02)+' Q'+cx+' '+(mouthY+s*.12)+' '+(cx+s*.14)+' '+(mouthY-s*.02)+'" stroke="'+MASSI_GOLD+'" stroke-width="'+(s*.028)+'" stroke-linecap="round" fill="none"/>';
    bodyA='style="animation:massi-celebrate .8s ease-in-out 2"';
    ring='<circle cx="'+cx+'" cy="'+cy+'" r="'+(r+s*.08)+'" fill="none" stroke="'+MASSI_GOLD+'" stroke-width="'+(s*.04)+'" opacity=".3" style="animation:massi-ring 1s ease-out 2"/>';
  } else if(state==='alert'){
    mouth='<path d="M'+(cx-s*.1)+' '+(mouthY+s*.02)+' Q'+cx+' '+(mouthY-s*.04)+' '+(cx+s*.1)+' '+(mouthY+s*.02)+'" stroke="'+MASSI_GOLD+'" stroke-width="'+(s*.022)+'" stroke-linecap="round" fill="none"/>';
    ring='<path d="M'+cx+' '+(cy-r-s*.08)+' L'+(cx-s*.06)+' '+(cy-r-s*.18)+' L'+(cx+s*.06)+' '+(cy-r-s*.18)+' Z" fill="#E24B4A" opacity=".9"/><text x="'+cx+'" y="'+(cy-r-s*.1)+'" text-anchor="middle" font-size="'+(s*.09)+'" fill="white" font-weight="700">!</text>';
  } else if(state==='happy'){
    mouth='<path d="M'+(cx-s*.14)+' '+(mouthY-s*.02)+' Q'+cx+' '+(mouthY+s*.12)+' '+(cx+s*.14)+' '+(mouthY-s*.02)+'" stroke="'+MASSI_GOLD+'" stroke-width="'+(s*.028)+'" stroke-linecap="round" fill="none"/>';
    ring='<text x="'+(cx-r*1.1)+'" y="'+(cy-r*.6)+'" font-size="'+(s*.14)+'" fill="'+MASSI_GOLD+'" opacity=".7">&#10022;</text><text x="'+(cx+r*.8)+'" y="'+(cy-r*.9)+'" font-size="'+(s*.1)+'" fill="'+MASSI_GOLD+'" opacity=".5">&#10022;</text>';
    bodyA='style="animation:massi-float 1.5s ease-in-out infinite"';
  } else if(state==='nod'){
    mouth='<path d="M'+(cx-s*.1)+' '+mouthY+' Q'+cx+' '+(mouthY+s*.07)+' '+(cx+s*.1)+' '+mouthY+'" stroke="'+MASSI_GOLD+'" stroke-width="'+(s*.025)+'" stroke-linecap="round" fill="none"/>';
    bodyA='style="animation:massi-nod .5s ease-in-out 3"';
    ring='<path d="M'+(cx+r*.6)+' '+(cy+r*.3)+' L'+(cx+r*.85)+' '+(cy+r*.6)+' L'+(cx+r*1.3)+' '+(cy-r*.1)+'" stroke="#27500A" stroke-width="'+(s*.05)+'" stroke-linecap="round" stroke-linejoin="round" fill="none"/>';
  }
  const defMouth=mouth||'<path d="M'+(cx-s*.08)+' '+mouthY+' Q'+cx+' '+(mouthY+s*.05)+' '+(cx+s*.08)+' '+mouthY+'" stroke="'+MASSI_GOLD+'" stroke-width="'+(s*.022)+'" stroke-linecap="round" fill="none"/>';
  const h=s*1.3;
  return '<svg width="'+s+'" height="'+h+'" viewBox="0 0 '+s+' '+h+'" xmlns="http://www.w3.org/2000/svg">'+ring+'<g '+bodyA+'><line x1="'+cx+'" y1="'+(antY+s*.04)+'" x2="'+cx+'" y2="'+(cy-r)+'" stroke="'+MASSI_NAVY+'" stroke-width="'+(s*.025)+'"/><circle cx="'+cx+'" cy="'+antY+'" r="'+(s*.055)+'" fill="'+MASSI_GOLD+'"/><rect x="'+(cx-r*.25)+'" y="'+(cy+r*.85)+'" width="'+(r*.2)+'" height="'+(r*.45)+'" rx="'+(r*.08)+'" fill="'+MASSI_LIGHT+'" stroke="'+MASSI_NAVY+'" stroke-width="'+(s*.018)+'"/><rect x="'+(cx+r*.05)+'" y="'+(cy+r*.85)+'" width="'+(r*.2)+'" height="'+(r*.45)+'" rx="'+(r*.08)+'" fill="'+MASSI_LIGHT+'" stroke="'+MASSI_NAVY+'" stroke-width="'+(s*.018)+'"/><rect x="'+(cx-r*.95)+'" y="'+(cy-r*.1)+'" width="'+(r*.28)+'" height="'+(r*.55)+'" rx="'+(r*.1)+'" fill="'+MASSI_LIGHT+'" stroke="'+MASSI_NAVY+'" stroke-width="'+(s*.018)+'"/><rect x="'+(cx+r*.67)+'" y="'+(cy-r*.1)+'" width="'+(r*.28)+'" height="'+(r*.55)+'" rx="'+(r*.1)+'" fill="'+MASSI_LIGHT+'" stroke="'+MASSI_NAVY+'" stroke-width="'+(s*.018)+'"/><ellipse cx="'+cx+'" cy="'+(cy+r*.45)+'" rx="'+(r*.72)+'" ry="'+(r*.52)+'" fill="'+MASSI_LIGHT+'" stroke="'+MASSI_NAVY+'" stroke-width="'+(s*.02)+'"/><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+MASSI_FACE+'" stroke="'+MASSI_NAVY+'" stroke-width="'+(s*.025)+'"/><g '+eyeA+'><rect x="'+(cx-eyeOff-eyeR)+'" y="'+(eyeY-eyeR)+'" width="'+(eyeR*2)+'" height="'+(eyeR*2)+'" rx="'+(eyeR*.5)+'" fill="'+MASSI_LIGHT+'" stroke="'+MASSI_NAVY+'" stroke-width="'+(s*.02)+'"/><rect x="'+(cx+eyeOff-eyeR)+'" y="'+(eyeY-eyeR)+'" width="'+(eyeR*2)+'" height="'+(eyeR*2)+'" rx="'+(eyeR*.5)+'" fill="'+MASSI_LIGHT+'" stroke="'+MASSI_NAVY+'" stroke-width="'+(s*.02)+'"/><g '+pupilA+'><circle cx="'+(cx-eyeOff)+'" cy="'+eyeY+'" r="'+pupilR+'" fill="'+MASSI_NAVY+'"/><circle cx="'+(cx+eyeOff)+'" cy="'+eyeY+'" r="'+pupilR+'" fill="'+MASSI_NAVY+'"/><circle cx="'+(cx-eyeOff+pupilR*.3)+'" cy="'+(eyeY-pupilR*.3)+'" r="'+(pupilR*.3)+'" fill="white"/><circle cx="'+(cx+eyeOff+pupilR*.3)+'" cy="'+(eyeY-pupilR*.3)+'" r="'+(pupilR*.3)+'" fill="white"/></g></g>'+defMouth+'<rect x="'+(cx-r*.5)+'" y="'+(cy+r*.28)+'" width="'+r+'" height="'+(r*.18)+'" rx="'+(r*.06)+'" fill="'+MASSI_NAVY+'" opacity=".35"/><rect x="'+(cx-r*.3)+'" y="'+(cy+r*.31)+'" width="'+(r*.22)+'" height="'+(r*.12)+'" rx="'+(r*.04)+'" fill="'+MASSI_GOLD+'" opacity=".7"/></g>'+arm+'</svg>';
}
function setMassiState(state){
  document.querySelectorAll('.massi-av').forEach(function(el){
    const sz=parseInt(el.dataset.size)||26;
    el.innerHTML=buildMassi(sz,state);
  });
}


setTimeout(function(){
  document.querySelectorAll('.massi-av').forEach(function(el){
    const sz=parseInt(el.dataset.size)||26;
    el.innerHTML=buildMassi(sz,'idle');
  });
},150);
</script>
