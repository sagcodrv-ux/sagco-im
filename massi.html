<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iMASSI &mdash; AI Digital IMS Manager | SAGCO</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;margin:0;padding:0}
/* ── LAYOUT ── */
.massi-page{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:row;overflow:hidden;z-index:9998}
#chatCol{display:flex;flex-direction:column;flex:1;min-width:0}
/* ── HEADER ── */
.chat-header{background:linear-gradient(135deg,#1B2A4A 0%,#243a5e 100%);padding:14px 24px;display:flex;align-items:center;gap:16px;flex-shrink:0;position:relative;overflow:hidden}
.chat-header::before{content:'';position:absolute;top:-50px;right:-30px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.1) 0%,transparent 70%);animation:hpulse 3s ease-in-out infinite;pointer-events:none}
@keyframes hpulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.2);opacity:1}}
.chat-header-av-wrap{position:relative;flex-shrink:0;width:80px;height:104px;display:flex;align-items:center;justify-content:center}
.av-ring{position:absolute;border-radius:50%;border:1.5px solid rgba(201,168,76,.3);animation:avring 2.5s ease-in-out infinite;pointer-events:none}
.av-ring1{width:88px;height:88px}.av-ring2{width:108px;height:108px;animation-delay:.5s}
@keyframes avring{0%,100%{transform:scale(.9);opacity:.6}50%{transform:scale(1.05);opacity:.15}}
.chat-header-info{flex:1;z-index:1}
.chat-header-title{font-size:20px;font-weight:700;color:#C9A84C;letter-spacing:1px}
.chat-header-sub{font-size:11px;color:rgba(255,255,255,.5);margin-top:2px}
.chat-header-live{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:10.5px;color:rgba(255,255,255,.5)}
.ch-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;animation:status-pulse 2s ease-in-out infinite}
.hdr-badge{display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:10px;background:rgba(255,255,255,.1);border:0.5px solid rgba(255,255,255,.15);font-size:10px;font-weight:600;white-space:nowrap}
.hdr-badge-dot{width:6px;height:6px;border-radius:50%}
.hdr-badge-dot.connecting,.hdr-badge-dot.loading,.hdr-badge-dot.syncing{background:#EF9F27;animation:status-pulse 1s ease-in-out infinite}
.hdr-badge-dot.ready{background:#4ade80}.hdr-badge-dot.error{background:#E24B4A}.hdr-badge-dot.offline{background:#aaa}
.hdr-badge-txt{color:rgba(255,255,255,.8)}
/* ── DB STRIP ── */
.db-strip{flex-shrink:0;padding:5px 24px;display:flex;align-items:center;gap:8px;font-size:11px;background:#f8f9fb;border-bottom:0.5px solid #e8e8e8;transition:background .3s}
.db-strip.loading,.db-strip.connecting,.db-strip.syncing{background:#EEF5FF}
.db-strip.ready{background:#F0FAF0}.db-strip.error{background:#FFF0F0}
.db-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.db-dot.loading,.db-dot.connecting,.db-dot.syncing{background:#378ADD;animation:status-pulse 1s ease-in-out infinite}
.db-dot.ready{background:#4ade80}.db-dot.error{background:#E24B4A;animation:status-pulse .5s ease-in-out infinite}.db-dot.offline{background:#aaa}
.db-label{font-weight:600;color:#333;min-width:80px}
.db-detail{color:#666;flex:1;font-size:10.5px}
.db-sync{font-size:10px;color:#aaa;margin-left:auto;white-space:nowrap}
.db-retry{margin-left:8px;background:#E24B4A;color:white;border:none;border-radius:4px;padding:2px 8px;font-size:10px;font-weight:600;cursor:pointer;display:none}
.db-progress{height:2px;width:100px;background:#ddd;border-radius:1px;overflow:hidden;flex-shrink:0}
.db-prog-fill{height:100%;background:#378ADD;width:0%;transition:width .3s ease;border-radius:1px}
.db-prog-fill.done{background:#4ade80}
/* ── CHIPS ── */
.suggested-chips{padding:7px 24px;display:flex;flex-wrap:wrap;gap:5px;flex-shrink:0;background:#fafafa;border-bottom:0.5px solid #f0f0f0}
.sug-chip{background:#f5f5f5;border:0.5px solid #e0e0e0;border-radius:14px;padding:4px 11px;font-size:11px;cursor:pointer;color:#444;transition:all .12s;white-space:nowrap}
.sug-chip:hover{background:#E6F1FB;border-color:#B5D4F4;color:#0C447C}
/* ── CHAT ── */
.chat-msgs{flex:1;overflow-y:auto;padding:16px 24px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;max-width:100%}
.msg.user{flex-direction:row-reverse}
.msg-av{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px}
.msg-av.user{background:#1B2A4A;color:#C9A84C}
.massi-msg-av{flex-shrink:0;width:28px;height:36px;margin-top:1px}
.bubble{padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.7;max-width:72%}
.msg.ai .bubble{background:#f5f5f5;border-radius:3px 12px 12px 12px;color:#1a1a1a}
.msg.user .bubble{background:#1B2A4A;color:white;border-radius:12px 3px 12px 12px}
.msg.ai .bubble a{color:#185FA5}
.msg-time{font-size:9.5px;color:#aaa;margin-top:3px;padding:0 3px}
.msg.user .msg-time{text-align:right}
.typing-b{display:flex;align-items:center;gap:3px;padding:9px 12px;background:#f5f5f5;border-radius:3px 10px 10px 10px}
.tdot{width:5px;height:5px;border-radius:50%;background:#999;animation:td 1.2s ease-in-out infinite}
.tdot:nth-child(2){animation-delay:.2s}.tdot:nth-child(3){animation-delay:.4s}
@keyframes td{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:.9;transform:scale(1)}}
.hist-item{padding:5px 0;border-bottom:0.5px solid #f5f5f5;cursor:pointer}
.hist-item:hover .hist-q{color:#185FA5}
.hist-q{font-size:11px;color:#333;line-height:1.4}
.hist-t{font-size:9.5px;color:#aaa}
.file-chip{background:#E6F1FB;border:0.5px solid #B5D4F4;border-radius:6px;padding:4px 8px;font-size:10px;color:#0C447C;display:flex;align-items:center;gap:4px;margin-bottom:5px}
/* ── INPUT ── */
.chat-input-area{border-top:1px solid #f0f0f0;padding:12px 24px;display:flex;gap:7px;align-items:flex-end;flex-shrink:0;background:white;box-shadow:0 -4px 16px rgba(0,0,0,.04)}
.chat-textarea{width:100%;border:0.5px solid #ddd;border-radius:8px;padding:10px 14px;font-size:13px;resize:none;min-height:44px;max-height:160px;font-family:Arial,sans-serif;outline:none;color:#1a1a1a;line-height:1.5;overflow-y:auto}
.chat-textarea:focus{border-color:#888}
.attach-btn{width:32px;height:32px;border-radius:7px;background:#f5f5f5;border:0.5px solid #ddd;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.attach-btn:hover{background:#ebebeb}
.send-btn{height:36px;border-radius:8px;background:#1B2A4A;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0 18px;font-size:13px;font-weight:600;color:#C9A84C;white-space:nowrap;flex-shrink:0}
.send-btn:hover{background:#243a5e}
/* ── ANIMATIONS ── */
@keyframes status-pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes massi-blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(0.05)}}
@keyframes massi-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes massi-nod{0%,100%{transform:translateY(0)}30%,70%{transform:translateY(-4px)}50%{transform:translateY(-7px)}}
@keyframes massi-wave{0%,100%{transform:rotate(0deg)}20%{transform:rotate(-18deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-10deg)}80%{transform:rotate(6deg)}}
@keyframes massi-celebrate{0%,100%{transform:scale(1) rotate(0deg)}25%{transform:scale(1.08) rotate(-3deg)}50%{transform:scale(1.12) rotate(3deg)}75%{transform:scale(1.06) rotate(-2deg)}}
@keyframes massi-ring{0%{r:19;opacity:.6}100%{r:24;opacity:0}}
@keyframes massi-scan{0%,100%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
@keyframes massi-t1{0%,100%{opacity:.3;transform:scale(.7)}33%{opacity:1;transform:scale(1)}}
@keyframes massi-t2{0%,100%{opacity:.3;transform:scale(.7)}66%{opacity:1;transform:scale(1)}}
@keyframes massi-t3{0%,100%{opacity:.3;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}

</style>
</head>
<body>
<div id="topbar-mount" style="display:none"></div>
<div class="massi-page">

  <!-- ── CHAT COLUMN ── -->
  <div id="chatCol">

    <!-- Header -->
    <div class="chat-header">
      <div class="chat-header-av-wrap">
        <div class="av-ring av-ring1"></div>
        <div class="av-ring av-ring2"></div>
        <div id="massiAv" style="width:70px;height:91px;position:relative;z-index:1"></div>

      <div class="chat-header-info">

      </div>

        <div class="hdr-badge-dot offline" id="hdrDot"></div>

      </div>
    </div>

    <!-- DB Status Strip -->
    <div class="db-strip offline" id="dbStrip">

    </div>

    <!-- Suggested chips -->
    <div class="suggested-chips" id="sugChips">
      <div class="sug-chip" onclick="massISend_with('Show all open CAPAs and Stage 2 blockers')">Open CAPAs</div>
      <div class="sug-chip" onclick="massISend_with('Am I ready for Stage 1 audit?')">Audit readiness</div>
      <div class="sug-chip" onclick="massISend_with('Show KPI dashboard status')">KPI status</div>
      <div class="sug-chip" onclick="massISend_with('Analyse F4 furnace energy trend')">F4 energy</div>
      <div class="sug-chip" onclick="massISend_with('Show register health across all 62 sheets')">Register health</div>
      <div class="sug-chip" onclick="massISend_with('What are my top 5 risks before Stage 2?')">Top risks</div>
      <div class="sug-chip" onclick="massISend_with('Show training completion status')">Training</div>
      <div class="sug-chip" onclick="massISend_with('Analyse incident trends and recommend CAPAs')">Incidents</div>
    </div>

    <!-- Messages -->
    <div class="chat-msgs" id="chatMsgs"></div>

    <!-- Input -->
    <div class="chat-input-area">
      <div style="flex:1">
        <div class="file-chip" id="fileChip" style="display:none">
          <span>&#128196;</span><span id="fileChipName"></span><span id="fileChipInfo" style="color:#185FA5;margin-left:3px"></span>
        </div>
        <textarea class="chat-textarea" id="chatInput" rows="2"
          placeholder="Ask iMASSI anything about your IMS..."
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();massISend()}"
          oninput="this.style.height='44px';this.style.height=this.scrollHeight+'px'"></textarea>
      </div>
      <button class="attach-btn" onclick="document.getElementById('xlFile').click()" title="Upload Excel">&#128206;</button>
      <button class="send-btn" onclick="massISend()">&#10148; Ask</button>
      <input type="file" id="xlFile" accept=".xlsx,.xls,.csv" style="display:none">
    </div>

  </div><!-- /chatCol -->

</div><!-- /massi-page -->

<script>

const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbzpMxyCTh6J-qH-rwPwux6J9bzwEwHYQPNxTI-IRrWX6vhXRlZYESaZdUeWiTqdNIPKoQ/exec';
const GROQ_URL            = 'https://api.groq.com/openai/v1/chat/completions';
const GROQ_MODEL          = 'llama-3.3-70b-versatile';
const GROQ_FALLBACK_MODEL = 'llama-3.1-8b-instant';   /* separate rate-limit bucket, very high free limits */
var   GROQ_KEY            = '';                        /* loaded from Apps Script getConfig at startup */

const CEREBRAS_URL        = 'https://api.cerebras.ai/v1/chat/completions';
const CEREBRAS_MODELS_URL = 'https://api.cerebras.ai/v1/models';
var   CEREBRAS_MODEL      = 'llama-3.3-70b';           /* auto-corrected at startup from the live model list */
var   CEREBRAS_KEY        = '';                        /* optional — loaded from getConfig if present */

/* Preferred Cerebras models, best first — the startup check picks the first one
   that actually exists on the account, so lineup changes never break iMASSI. */
var CEREBRAS_PREFERRED = ['llama-3.3-70b','llama3.3-70b','gpt-oss-120b','qwen-3-235b-a22b-instruct-2507','qwen-3-32b','llama-4-scout-17b-16e-instruct','llama3.1-8b'];

function discoverCerebrasModel(){
  if (!CEREBRAS_KEY) return;
  fetch(CEREBRAS_MODELS_URL, {headers:{'Authorization':'Bearer '+CEREBRAS_KEY}})
    .then(function(r){return r.json();})
    .then(function(d){
      var ids = (d && d.data ? d.data : []).map(function(m){return m.id;});
      if (!ids.length) { console.warn('[iMASSI] Cerebras model list empty — keeping default'); return; }
      for (var i = 0; i < CEREBRAS_PREFERRED.length; i++) {
        if (ids.indexOf(CEREBRAS_PREFERRED[i]) >= 0) { CEREBRAS_MODEL = CEREBRAS_PREFERRED[i]; break; }
      }
      if (ids.indexOf(CEREBRAS_MODEL) < 0) CEREBRAS_MODEL = ids[0];
      console.log('[iMASSI] Cerebras models available: ' + ids.join(', ') + ' — using: ' + CEREBRAS_MODEL);
    })
    .catch(function(e){console.warn('[iMASSI] Cerebras model discovery failed ('+e.message+') — keeping default');});
}

/* Provider chain — biggest quota first, weakest model last:
   1. Cerebras 70B (~1M tokens/day) — primary when its key is configured
   2. Groq 70B (same model, independent service) — second
   3. Groq 8B — emergency only (both 70B services down) */
function buildProviders(){
  var p = [];
  if (CEREBRAS_KEY) p.push({name:'Cerebras 70B', url:CEREBRAS_URL, key:CEREBRAS_KEY, model:CEREBRAS_MODEL});
  p.push({name:'Groq 70B', url:GROQ_URL, key:GROQ_KEY, model:GROQ_MODEL});
  p.push({name:'Groq 8B', url:GROQ_URL, key:GROQ_KEY, model:GROQ_FALLBACK_MODEL});
  return p;
}

/* Builds an OpenAI-format request body for Groq */
function toGroqBody(messages, maxTokens, temperature, model){
  return {model: model || GROQ_MODEL, messages: messages, max_tokens: maxTokens, temperature: temperature};
}
/* Extracts the reply text from a Groq response (or '' if absent) */
function groqText(d){
  try { return d.choices[0].message.content; } catch(e) { return ''; }
}

const SHEET_TIMEOUT  = 25000;   /* Apps Script can take 10-20s when cold or throttled */
const LLM_TIMEOUT    = 60000;
const INTENT_TIMEOUT = 10000;
const CACHE_TTL      = 5 * 60 * 1000;
const BATCH_SIZE     = 6;
const MAX_CTX_TOKENS = 30000;
const AVG_CHARS_PER_TOKEN = 4;


/* ══════════════════════════════════════════════════════════════
   PROMPT MODULES — selected per query by intent classifier
══════════════════════════════════════════════════════════════ */

var PROMPT_BASE = [
  'You are iMASSI — the AI Digital IMS Manager at Saudi Arabian Glass Company Ltd. (SAGCO), Jeddah Industrial City Phase 4.',
  '',
  'SAGCO FACTS:',
  '- 5 HFO-fired furnaces F1-F5 | 884 direct employees | 152 contractors',
  '- Standards: ISO 9001:2015 | ISO 14001:2015 | ISO 45001:2018 | ISO 50001:2018 | ISO 37001:2016',
  '- TUV Austria Stage 1: 25-26 Aug 2026 | Stage 2: 22-26 Sep 2026',
  '- CEO: Rami Al Dobi | IMS Coordinator: Issam Ali Abdelkefi',
  '- Governance: Steering Committee | WG1 Plant & Quality | WG2 SHEE Energy & ENV | WG3 People Ethics & Procurement',
  '- Facility SPC baseline: 561.24 kWh/ton | F4 SHC URGENT +119 kcal/kg above target',
  '- 4 open CAPAs (001-004) Stage 2 blockers | 7 of 9 L1 policies pending CEO signature',
  '- HIRA E-03 overdue since June 2026',
  '',
  'SINGLE SOURCE OF TRUTH: The live Google Sheets database.',
  'When LIVE DATA blocks are provided, use them exclusively and cite the register.',

  'FULL LISTINGS: when the user asks to see all records, the interface renders the complete register as a scrollable table automatically. When an [INTERFACE NOTE] says the table is displayed, never re-list the rows — give a short expert read of the data and one next step.',
  '',
  'HOW YOU CONVERSE — you are a seasoned IMS professional, not a chatbot:',
  '- Understand the intent behind the question before anything else. If the request is clear enough to act on, act — never ask for information you can infer or already have in the live data or earlier in this conversation.',
  '- Progress the conversation. Each reply should move the user closer to their IMS objective: answer what was asked, then add the one insight or next step an experienced colleague would naturally offer ("...and since Stage 2 is close, I would also close CAPA-2026-002 first — want me to draft the update?").',
  '- If clarification is genuinely needed, ask exactly ONE short, specific follow-up question — woven into the reply, never a numbered list of questions, never a form or questionnaire.',
  '- Maintain the thread. Refer back naturally to what was said earlier ("the F4 issue we discussed", "that CAPA you asked about"). Never restart or re-introduce yourself mid-conversation.',
  '- Sound human: contractions, short sentences, varied openings. Vary how you begin replies — never repeat the same opener twice in a row. No corporate filler ("I hope this helps", "Please do not hesitate"), no restating the question, no apologising for normal work.',
  '- Match depth to the question: a quick factual question gets a 1-2 sentence answer; an analysis request gets structure. Do not pad short answers.',

  'WRITE OPERATIONS: When you recommend creating or updating a record, output a structured preview block:',

  'Never write without this block and explicit user approval.',

  'ANALYTICS OUTPUT: When generating charts, output:',
  '[CHART]{"type":"<bar|line|pie|doughnut>","title":"<title>","labels":[...],"datasets":[{"label":"<name>","data":[...],"color":"<hex>"}]}[/CHART]',
  '',
  'HEALTH OUTPUT: When reporting register health, output:',
  '[HEALTH]{"registers":["<tab_key>","..."]}[/HEALTH]'
].join('\n');

var PROMPT_AUDITOR = [
  'ACTIVE ROLE: ISO Lead Auditor',
  '',
  'Apply clause-by-clause conformance analysis.',
  'For every finding identify: objective evidence that EXISTS and evidence that is MISSING.',
  'Classify each gap as: MAJOR NC | MINOR NC | OBSERVATION | OFI',

  'Structure audit findings as: CLAUSE | REQUIREMENT | EVIDENCE FOUND | EVIDENCE MISSING | CLASSIFICATION | RECOMMENDATION',

var PROMPT_ANALYST = [
  'ACTIVE ROLE: Data Analyst',
  '',
  'Apply appropriate statistical methods to the data provided.',
  'State the method and why it was chosen.',
  'Present results: business interpretation first, technical detail second.',

  'For time series: identify if trend is improving, deteriorating, or stable.',

var PROMPT_ADVISOR = [
  'ACTIVE ROLE: Continuous Improvement Consultant',
  '',
  'Reason across multiple registers to identify systemic issues.',
  'Follow register relationships: CAPA links to incidents, incidents link to HIRA, etc.',

  'Structure every recommendation as:',
  'OBSERVATION: what the data shows',

var PROMPT_WRITER = [
  'ACTIVE ROLE: IMS Document Writer',
  '',
  'Generate complete, ISO-compliant record drafts.',
  'Include ALL mandatory fields for the target register.',
  'Follow SAGCO document coding: L1 policies = L1-IMS-PO-XX | L2 procedures = L2-IMS-[Clause]-P-XX',
  'Always use the [WRITE_PREVIEW] block format for record previews.',
  'Never generate partial records. If a field is unknown, mark it [REQUIRED].',
  'For CAPA records: always include root cause, corrective action, owner, due date, ISO clause.',
  'For risk records: always include likelihood, consequence, risk level, treatment, owner.',
  'Explain why each field matters for ISO compliance.'
].join('\n');

var PROMPT_DATA_MANAGER = [
  'ACTIVE ROLE: Data Quality Manager',
  '',
  'Assess completeness, accuracy, and consistency of register data.',
  'Detect: missing mandatory fields, expired records, potential duplicates, inconsistent status values.',
  'Score each register 0-100 and assign grade A/B/C/D/F.',
  'Grade scale: A=90-100 | B=75-89 | C=60-74 | D=40-59 | F=0-39',

/* ══════════════════════════════════════════════════════════════
   INTENT CLASSIFIER — lightweight two-step reasoning
══════════════════════════════════════════════════════════════ */
async function classifyIntent(userMessage, history) {
  if (!GROQ_KEY) return null;
  console.log('[iMASSI][INTENT] Classifying: "' + userMessage.substring(0,60) + '"');
  var t0 = performance.now();

  var recentHistory = history.slice(-4).map(function(m) {
    return m.role.toUpperCase() + ': ' + m.content.substring(0,200);
  }).join('\n');

  var messages = [
    {role: 'system', content: INTENT_CLASSIFIER_PROMPT},
    {role: 'user',   content: 'Recent context:\n' + recentHistory + '\n\nCurrent message: ' + userMessage}
  ];

  var controller = new AbortController();
  var tid = setTimeout(function() { controller.abort(); }, INTENT_TIMEOUT);

  try {
    var r = await fetch(GROQ_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json','Authorization':'Bearer ' + GROQ_KEY},
      body: JSON.stringify(toGroqBody(messages, 300, 0.1)),
      signal: controller.signal
    });
    clearTimeout(tid);
    var d = await r.json();
    var raw = groqText(d);
    raw = raw.replace(/```json|```/g,'').trim();
    var intent = JSON.parse(raw);
    console.log('[iMASSI][INTENT] ' + Math.round(performance.now()-t0) + 'ms | role=' + intent.role + ' intent=' + intent.intent + ' registers=' + (intent.primary_registers||[]).join(','));
    return intent;
  } catch(err) {
    clearTimeout(tid);
    console.warn('[iMASSI][INTENT] Failed (' + err.message + ') — using keyword fallback');
    return fallbackIntent(userMessage);
  }
}

function fallbackIntent(txt) {
  var lower = txt.toLowerCase();
  var intent = 'data_query';
  var role   = 'advisor';
  if (/audit|ready|conform|evidence|clause|nc |nonconform/i.test(txt)) { intent='audit_readiness'; role='auditor'; }
  else if (/trend|regression|forecast|statistic|spc|capability|correlat|analyz|analyse/i.test(txt)) { intent='analytics'; role='analyst'; }
  else if (/create|add|record|write|update|new capa|raise|log/i.test(txt)) { intent='write_operation'; role='writer'; }
  else if (/health|quality|complete|missing|duplicate|score/i.test(txt)) { intent='health_check'; role='data_manager'; }
  else if (/recommend|priorit|what should|advise|suggest/i.test(txt)) { intent='advisory'; role='advisor'; }

  var regs = [];
  Object.keys(TAB_KEYWORDS).forEach(function(tab) {
    TAB_KEYWORDS[tab].forEach(function(kw) { if(lower.indexOf(kw) >= 0 && regs.indexOf(tab) < 0) regs.push(tab); });
  });
  if (!regs.length && intent !== 'health_check') regs = ['kpi_dashboard','capa','objectives'];

  return { intent:intent, primary_registers:regs, linked_registers:[], iso_clauses:[], role:role, write_needed:false, analytics_needed:false, confidence:0.5 };
}


/* ══════════════════════════════════════════════════════════════
   SMART CONTEXT BUILDER — relationship-aware, token-budgeted
══════════════════════════════════════════════════════════════ */
function getLinkedRegisters(primaryTabs, maxLinked) {
  var linked = [];
  primaryTabs.forEach(function(tab) {
    var rel = RELATIONSHIPS[tab];
    if (!rel) return;
    rel.feeds_from.concat(rel.feeds_into).forEach(function(t) {
      if (primaryTabs.indexOf(t) < 0 && linked.indexOf(t) < 0) linked.push(t);
    });
  });
  return linked.slice(0, maxLinked || 4);
}

function buildSmartContext(intent) {
  var primary = intent.primary_registers || [];
  var linked  = intent.linked_registers  || [];

  /* Auto-add linked registers if not provided */
  if (!linked.length) linked = getLinkedRegisters(primary, 3);

  var allTabs    = primary.concat(linked.filter(function(t) { return primary.indexOf(t) < 0; }));
  var parts      = [];
  var tokenBudget = MAX_CTX_TOKENS;

  allTabs.forEach(function(tab) {
    if (tokenBudget <= 0) return;
    var entry = state.sheetCache[tab];
    if (!entry || !entry.data) { parts.push('[' + tab + ': not loaded]'); return; }
    var d = entry.data;
    var rows = d.rows || [];
    if (!rows.length) { parts.push('[' + tab + ': empty register]'); return; }

    var headers = d.headers || [];
    var age     = Math.round((Date.now() - entry.ts) / 1000);
    var isPrimary = primary.indexOf(tab) >= 0;

    /* Smart row selection */
    var selectedRows = rows;
    if (rows.length > 20 && !isPrimary) {
      /* For linked registers: only show relevant rows */
      var statusIdx = headers.findIndex(function(h) { return /status/i.test(h); });
      if (statusIdx >= 0) {
        var openRows = rows.filter(function(r) { return /open|at.risk|overdue|behind|pending/i.test(String(r[statusIdx]||'')); });
        selectedRows = openRows.length ? openRows.slice(0,10) : rows.slice(0,5);
      } else {
        selectedRows = rows.slice(0,8);
      }
    } else if (rows.length > 100 && isPrimary) {
      selectedRows = rows.slice(0,100);
    }

    var block = ['=== LIVE DATA: ' + tab.toUpperCase() + ' (' + rows.length + ' total, ' + selectedRows.length + ' shown, ' + age + 's ago) ==='];
    block.push('Columns: ' + headers.join(' | '));
    selectedRows.forEach(function(row) {
      var obj = {};
      headers.forEach(function(h,j) { if(h && row[j] !== undefined && row[j] !== '') obj[h] = row[j]; });
      if (Object.keys(obj).length) block.push(JSON.stringify(obj));
    });

    var blockText  = block.join('\n');
    var blockTokens = Math.ceil(blockText.length / AVG_CHARS_PER_TOKEN);
    if (blockTokens < tokenBudget) {
      parts.push(blockText);
      tokenBudget -= blockTokens;
    }
  });

  /* Include health summary for all registers */
  var healthSummary = buildHealthSummary();
  if (healthSummary) parts.push('\n=== REGISTER HEALTH SUMMARY ===\n' + healthSummary);

  return parts.join('\n\n');
}

function buildHealthSummary() {
  var issues = [];
  Object.keys(state.health).forEach(function(tab) {
    var h = state.health[tab];
    if (h && h.grade && (h.grade === 'D' || h.grade === 'F' || h.overdue > 0)) {
      issues.push(tab + ': grade=' + h.grade + ' completeness=' + h.completeness + '% overdue=' + h.overdue);
    }
  });
  return issues.slice(0,10).join('\n');
}

function escHtml(v) {
  return String(v === undefined || v === null ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function detectListAll(txt) {
  var t = txt.toLowerCase();
  /* explicit "all/full/complete..." near a data noun */
  if (/\b(all|full|complete|entire|every|whole|everything)\b/.test(t) &&
      /\b(record|records|row|rows|item|items|entr|list|data|register|table)/.test(t)) return true;
  /* "table of X" / "list of X" / "give me the table" — full listing unless the user limits it */
  if (/\b(table|listing|list)\b/.test(t) &&
      !/\b(top|first|last|latest|recent|newest|oldest|open|closed|overdue|pending|filter|only|summary|summar|chart|graph|trend|count|how many|\d+)\b/.test(t)) return true;
  return false;
}

/* Resolve which register the user means: classifier result first, then keyword scan */
function resolveListTab(txt, intent) {
  var tab = (intent && intent.primary_registers || [])[0];
  if (tab && state.sheetCache[tab]) return tab;
  var t = txt.toLowerCase();
  var keys = Object.keys(state.sheetCache);
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    if (t.indexOf(k) >= 0 || t.indexOf(k.replace(/_/g,' ')) >= 0) return k;
  }
  /* common aliases */
  var aliases = {capa:'capa', capas:'capa', incident:'incidents', hira:'hira', risk:'risks', risks:'risks',
                 kpi:'kpi_dashboard', kpis:'kpi_dashboard', objective:'objectives', policy:'policies', policies:'policies',
                 training:'training', calibration:'calibration', audit:'audit_programme', ptw:'ptw_register',
                 nonconformity:'nonconforming', ncr:'nonconforming', supplier:'supplier_esg', coi:'coi', tpdd:'tpdd'};
  var words = t.split(/[^a-z_]+/);
  for (var j = 0; j < words.length; j++) {
    if (aliases[words[j]] && state.sheetCache[aliases[words[j]]]) return aliases[words[j]];
  }
  return null;
}

function statusBadge(val) {
  var v = String(val||'');
  if (!v) return '';
  var l = v.toLowerCase();
  var style = 'background:#f0f0f0;color:#555';
  if (/open|at.risk|overdue|behind|fail|urgent|expired|major/.test(l)) style = 'background:#FCEBEB;color:#791F1F';
  else if (/closed|on.track|complete|pass|ok|valid|conform|done/.test(l)) style = 'background:#EAF3DE;color:#27500A';
  else if (/progress|pending|review|draft|minor/.test(l)) style = 'background:#FAEEDA;color:#633806';
  return '<span style="display:inline-block;font-size:10px;font-weight:700;border-radius:3px;padding:1px 6px;white-space:nowrap;' + style + '">' + escHtml(v) + '</span>';
}

function buildRowsHtml(tab, start, end) {
  var entry = state.sheetCache[tab];
  if (!entry || !entry.data) return '';
  var headers = entry.data.headers || [];
  var rows = entry.data.rows || [];
  var statusIdx = headers.findIndex(function(h){ return /^status$/i.test(h); });
  var html = '';
  for (var i = start; i < Math.min(end, rows.length); i++) {
    var bg = i % 2 === 0 ? '#fff' : '#f8f9fb';
    html += '<tr>';
    html += '<td style="padding:6px 8px;border-bottom:0.5px solid #eee;background:' + bg + ';color:#aaa;font-size:10px">' + (i+1) + '</td>';
    headers.forEach(function(h, j) {
      var cell = (j === statusIdx) ? statusBadge(rows[i][j]) : escHtml(rows[i][j]);
      html += '<td style="padding:6px 8px;border-bottom:0.5px solid #eee;background:' + bg + ';white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis">' + cell + '</td>';
    });
    html += '</tr>';
  }
  return html;
}

  });

    card += '<div style="padding:8px;text-align:center;background:#fafafa;border-top:0.5px solid #eee">';

  }

function loadMoreListRows(tid) {
  var ts = listTableState[tid];
  if (!ts) return;
  var entry = state.sheetCache[ts.tab];
  if (!entry || !entry.data) return;
  var rows = entry.data.rows || [];
  var tbody = document.getElementById(tid);
  var btn = document.getElementById(tid + '-more');
  if (!tbody) return;
  var next = Math.min(ts.offset + LIST_PAGE_SIZE, rows.length);
  tbody.insertAdjacentHTML('beforeend', buildRowsHtml(ts.tab, ts.offset, next));
  ts.offset = next;
  if (btn) {
    var remaining = rows.length - next;
    if (remaining <= 0) btn.parentElement.remove();
    else btn.textContent = 'Load ' + Math.min(LIST_PAGE_SIZE, remaining) + ' more (' + remaining + ' remaining)';
  }
}


/* ══════════════════════════════════════════════════════════════
   REGISTER HEALTH ENGINE — calculated during cache load
══════════════════════════════════════════════════════════════ */
function calculateHealth(tabKey, data) {
  if (!data || !data.rows || !data.rows.length) {
    return { score:0, grade:'F', completeness:0, overdue:0, duplicates:0, total:0, issues:['No data in register'] };
  }
  var headers = data.headers || [];
  var rows    = data.rows;
  var issues  = [];

  /* Completeness */
  var mandFields = MANDATORY_FIELDS[tabKey] || [];
  var filled = 0, total = 0;
  if (mandFields.length) {
    rows.forEach(function(row) {
      mandFields.forEach(function(field) {
        var idx = headers.indexOf(field);
        if (idx >= 0) { total++; if(row[idx] && String(row[idx]).trim()) filled++; }
      });
    });
  }
  var completeness = total > 0 ? Math.round(filled / total * 100) : 90;

  /* Overdue */
  var dateField = DATE_FIELDS[tabKey];
  var overdue = 0;
  if (dateField) {
    var dateIdx = headers.indexOf(dateField);
    if (dateIdx >= 0) {
      var today = new Date();
      rows.forEach(function(row) {
        if (row[dateIdx]) { var d = new Date(row[dateIdx]); if (!isNaN(d) && d < today) overdue++; }
      });
    }
  }

  /* Duplicates — check first non-empty column */
  var keyCol = rows.map(function(r) { return String(r[0]||'').trim().toLowerCase(); }).filter(function(v){return v;});
  var dupes  = keyCol.length - new Set(keyCol).size;

  /* Score */
  var score = 100;
  score -= (100 - completeness) * 0.5;
  score -= Math.min(overdue * 5, 30);
  score -= Math.min(dupes * 8, 20);
  score  = Math.max(0, Math.round(score));

  var grade = score >= 90 ? 'A' : score >= 75 ? 'B' : score >= 60 ? 'C' : score >= 40 ? 'D' : 'F';

  if (completeness < 80) issues.push((100-completeness) + '% of mandatory fields incomplete');
  if (overdue > 0)       issues.push(overdue + ' record' + (overdue>1?'s':'') + ' overdue');
  if (dupes > 0)         issues.push(dupes + ' potential duplicate' + (dupes>1?'s':'') + ' detected');
  if (!issues.length)    issues.push('No issues detected');

  return { score:score, grade:grade, completeness:completeness, overdue:overdue, duplicates:dupes, total:rows.length, issues:issues };
}

function renderHealthCards(tabs) {
  var html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px">';
  tabs.forEach(function(tab) {
    var h = state.health[tab];

    var gradeColor = {A:'#27500A',B:'#1a5276',C:'#633806',D:'#7d3c00',F:'#791F1F'}[h.grade] || '#333';
    var gradeBg    = {A:'#EAF3DE',B:'#EEF5FF',C:'#FAEEDA',D:'#FFF3E0',F:'#FCEBEB'}[h.grade] || '#f5f5f5';
    html += '<div style="background:white;border:0.5px solid #e0e0e0;border-radius:8px;padding:10px;border-left:3px solid ' + gradeColor + '">';

    html += '<div style="height:4px;background:#e8e8e8;border-radius:2px;margin-bottom:6px">';

    }
    html += '</div>';
  });
  html += '</div>';
  return html;
}


/* ══════════════════════════════════════════════════════════════
   CACHE MANAGEMENT — background, non-blocking
══════════════════════════════════════════════════════════════ */
function fetchWithTimeout(url, ms) {
  return new Promise(function(resolve, reject) {
    var tid = setTimeout(function() { reject(new Error('timeout')); }, ms);
    fetch(url).then(function(r) { clearTimeout(tid); return r.json(); })
      .then(resolve).catch(function(e) { clearTimeout(tid); reject(e); });
  });
}

function loadTab(tab) {
  var url = SHEETS_URL + '?tab=' + tab + '&limit=100';
  var t0  = performance.now();
  return fetchWithTimeout(url, SHEET_TIMEOUT)
    .then(function(data) {
      if (data) {
        state.sheetCache[tab] = { data:data, ts:Date.now() };
        state.health[tab] = calculateHealth(tab, data);
      }
      console.log('[iMASSI][SHEETS] ' + tab + ': ' + ((data&&data.rows)?data.rows.length:0) + ' rows | ' + Math.round(performance.now()-t0) + 'ms | health=' + (state.health[tab]?state.health[tab].grade:'N/A'));
      return data;
    })
    .catch(function(err) {
      console.warn('[iMASSI][SHEETS] ' + tab + ' failed (' + err.message + ') — retrying once in 3s');
      return new Promise(function(res) { setTimeout(res, 3000); }).then(function() {
        return fetchWithTimeout(url, SHEET_TIMEOUT).then(function(data) {
          if (data) {
            state.sheetCache[tab] = { data:data, ts:Date.now() };
            state.health[tab] = calculateHealth(tab, data);
            console.log('[iMASSI][SHEETS] ' + tab + ': recovered on retry (' + ((data.rows||[]).length) + ' rows)');
          }
          return data;
        }).catch(function(e2) {
          console.warn('[iMASSI][SHEETS] FAIL: ' + tab + ' — ' + e2.message);
          return null;
        });
      });
    });
}

async function initCache() {
  if (state.cacheLoading) return;
  state.cacheLoading = true;
  var t0 = performance.now();
  console.log('[iMASSI] === CACHE INIT START === ' + new Date().toISOString());

  setStatus('connecting', 'Connecting to Google Sheets...');

  /* Phase 1: priority tabs */
  setStatus('loading', 'Loading priority registers...', 0);
  await Promise.allSettled(PRIORITY_TABS.map(function(t) { return loadTab(t); }));
  var p1n  = Object.keys(state.sheetCache).length;
  state.cacheReady = true;
  setStatus('loading', 'Priority data ready — loading ' + (ALL_TABS.length-PRIORITY_TABS.length) + ' more...', Math.round(p1n/ALL_TABS.length*100));
  console.log('[iMASSI] Phase 1 done: ' + p1n + ' tabs in ' + Math.round(performance.now()-t0) + 'ms');

  /* Phase 2: remaining in batches */
  var remaining = ALL_TABS.filter(function(t) { return PRIORITY_TABS.indexOf(t) < 0; });
  for (var i = 0; i < remaining.length; i += BATCH_SIZE) {
    if (i > 0) await new Promise(function(res) { setTimeout(res, 400); });   /* breathe between batches */
    await Promise.allSettled(remaining.slice(i, i+BATCH_SIZE).map(function(t) { return loadTab(t); }));
    var n = Object.keys(state.sheetCache).length;
    setStatus('syncing', 'Building knowledge cache: ' + n + ' / ' + ALL_TABS.length, Math.round(n/ALL_TABS.length*100));
  }

  var total   = Object.keys(state.sheetCache).length;
  var elapsed = Math.round(performance.now() - t0);
  state.cacheTime    = Date.now();
  state.cacheLoading = false;

  /* Open CAPA count from live data */
  var openCapas = 0;
  var ce = state.sheetCache['capa'];
  if (ce && ce.data && ce.data.rows) {
    var si = (ce.data.headers||[]).findIndex(function(h) { return /status/i.test(h); });
    if (si >= 0) openCapas = ce.data.rows.filter(function(r) { return /open/i.test(String(r[si]||'')); }).length;
  }

  var readyMsg = total + ' of ' + ALL_TABS.length + ' registers loaded' + (openCapas > 0 ? ' — ' + openCapas + ' open CAPAs' : '');
  setStatus('ready', readyMsg);
  updateHealthPanel();

  console.log('[iMASSI] === CACHE COMPLETE === total=' + total + '/' + ALL_TABS.length + ' time=' + elapsed + 'ms');

  /* Background refresh */
  setTimeout(function bgRefresh() {
    if (!state.cacheLoading) {
      var stale = ALL_TABS.filter(function(t) { var e=state.sheetCache[t]; return !e||(Date.now()-e.ts)>CACHE_TTL; });
      if (stale.length) {
        setStatus('syncing', 'Refreshing ' + stale.length + ' registers...');
        Promise.allSettled(stale.map(function(t) { return loadTab(t); })).then(function() {
          setStatus('ready', Object.keys(state.sheetCache).length + ' registers — refreshed');
          updateHealthPanel();
        });
      }
    }
    setTimeout(bgRefresh, CACHE_TTL);
  }, CACHE_TTL);
}

/* ══════════════════════════════════════════════════════════════
   WRITE WORKFLOW — draft → approve → audit write
══════════════════════════════════════════════════════════════ */
function initiateWrite(writeData) {
  state.pendingWrite = writeData;
  appendAI(
    'I have prepared a draft record for <strong>' + writeData.register + '</strong>. ' +
    'Review the details below, add your reason, and click <strong>Approve & Write</strong> to save — or dismiss to cancel.',
    renderWriteCard(writeData), false
  );
}

function approveWrite() {
  if (!state.pendingWrite) return;
  var reason = document.getElementById('writeReason');
  if (!reason || !reason.value.trim()) {
    reason.style.border = '1px solid #E24B4A';
    reason.placeholder  = 'Reason is required for ISO audit trail';
    return;
  }
  var w = state.pendingWrite;
  var auditRecord = {
    action:    w.action,
    tab:       w.tab,
    register:  w.register,
    record:    w.record,
    reason:    reason.value.trim(),
    user:      'IMS Coordinator',
    session:   state.sessionId,
    timestamp: new Date().toISOString(),
    iso_clause: w.iso_clause || ''
  };

  setAvatar('thinking');
  var url = SHEETS_URL + '?action=writeRow&tab=' + w.tab +
    '&data=' + encodeURIComponent(JSON.stringify(w.record)) +
    '&reason=' + encodeURIComponent(reason.value.trim()) +
    '&user=IMS_Coordinator&session=' + state.sessionId;

  fetchWithTimeout(url, 15000)
    .then(function(result) {
      setAvatar('success'); setTimeout(function(){setAvatar('idle');}, 3000);
      var msg = 'Record written to <strong>' + w.register + '</strong> register.';
      if (result && result.written) msg += ' Row ' + result.written + ' created.';
      msg += '<br><small style="color:#888">Audit trail: ' + auditRecord.timestamp + ' | ' + auditRecord.user + ' | ' + reason.value.trim() + '</small>';
      appendAI(msg);
      /* Refresh the cached tab */
      loadTab(w.tab);
      state.pendingWrite = null;
      removeWriteCard();
    })
    .catch(function(err) {
      setAvatar('idle');
      appendAI('Write failed: ' + err.message + '. Please check the Apps Script connection and try again.');
    });
}

function dismissWrite() {
  state.pendingWrite = null;
  removeWriteCard();
  appendAI('Write operation dismissed. No changes were made to Google Sheets.');
}

var N='#1B2A4A', G='#C9A84C', F='#2A4A7A', L='#E8F0FB';

  if(st==='idle'){eA='style="transform-origin:'+cx+'px '+eyeY+'px;animation:massi-blink 4s ease-in-out infinite"';mouth='<path d="M'+(cx-s*.1)+' '+mouthY+' Q'+cx+' '+(mouthY+s*.06)+' '+(cx+s*.1)+' '+mouthY+'" stroke="'+G+'" stroke-width="'+(s*.025)+'" stroke-linecap="round" fill="none"/>';bA='style="animation:massi-float 3s ease-in-out infinite"';}

  else if(st==='thinking'){pA='style="animation:massi-scan 1s ease-in-out infinite"';mouth='<path d="M'+(cx-s*.08)+' '+(mouthY+s*.01)+' Q'+cx+' '+(mouthY-s*.03)+' '+(cx+s*.08)+' '+(mouthY+s*.01)+'" stroke="'+G+'" stroke-width="'+(s*.022)+'" stroke-linecap="round" fill="none"/>';ring='<circle cx="'+cx+'" cy="'+(cy+r*1.4)+'" r="3" fill="'+G+'" style="animation:massi-t1 1.2s ease-in-out infinite"/><circle cx="'+(cx+s*.14)+'" cy="'+(cy+r*1.4)+'" r="3" fill="'+G+'" style="animation:massi-t2 1.2s ease-in-out infinite"/><circle cx="'+(cx-s*.14)+'" cy="'+(cy+r*1.4)+'" r="3" fill="'+G+'" style="animation:massi-t3 1.2s ease-in-out infinite"/>';}
  else if(st==='success'){mouth='<path d="M'+(cx-s*.14)+' '+(mouthY-s*.02)+' Q'+cx+' '+(mouthY+s*.12)+' '+(cx+s*.14)+' '+(mouthY-s*.02)+'" stroke="'+G+'" stroke-width="'+(s*.028)+'" stroke-linecap="round" fill="none"/>';bA='style="animation:massi-celebrate .8s ease-in-out 2"';ring='<circle cx="'+cx+'" cy="'+cy+'" r="'+(r+s*.08)+'" fill="none" stroke="'+G+'" stroke-width="'+(s*.04)+'" opacity=".3" style="animation:massi-ring 1s ease-out 2"/>';}
  else if(st==='happy'){mouth='<path d="M'+(cx-s*.14)+' '+(mouthY-s*.02)+' Q'+cx+' '+(mouthY+s*.12)+' '+(cx+s*.14)+' '+(mouthY-s*.02)+'" stroke="'+G+'" stroke-width="'+(s*.028)+'" stroke-linecap="round" fill="none"/>';bA='style="animation:massi-float 1.5s ease-in-out infinite"';}

function setStatus(status, detail, pct) {
  var cfg = {offline:{label:'Offline',cls:'offline'},connecting:{label:'Connecting',cls:'connecting'},loading:{label:'Loading',cls:'loading'},syncing:{label:'Syncing',cls:'syncing'},ready:{label:'Connected',cls:'ready'},error:{label:'Error',cls:'error'}}[status]||{label:'Offline',cls:'offline'};
  var els = {strip:'dbStrip',dot:'dbDot',label:'dbLabel',detail:'dbDetail',progress:'dbProgress',fill:'dbFill',sync:'dbSync',retry:'dbRetry',hdrDot:'hdrDot',hdrTxt:'hdrTxt'};
  Object.keys(els).forEach(function(k){els[k]=document.getElementById(els[k]);});
  if(els.strip) els.strip.className='db-strip '+cfg.cls;
  if(els.dot)   els.dot.className='db-dot '+cfg.cls;
  if(els.label) els.label.textContent=cfg.label;
  if(els.detail)els.detail.textContent=detail||'';
  if(els.hdrDot)els.hdrDot.className='hdr-badge-dot '+cfg.cls;
  if(els.hdrTxt)els.hdrTxt.textContent=cfg.label;
  if(els.progress){
    if(pct!==undefined&&status!=='ready'&&status!=='error'){els.progress.style.display='block';if(els.fill){els.fill.style.width=pct+'%';els.fill.className='db-prog-fill';}}
    else if(status==='ready'){els.progress.style.display='block';if(els.fill){els.fill.style.width='100%';els.fill.className='db-prog-fill done';}}
    else{els.progress.style.display='none';}
  }
  if(els.sync&&status==='ready'){var now=new Date();els.sync.textContent='Synced '+now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
  if(els.retry)els.retry.style.display=(status==='error')?'inline-block':'none';
}

function showTyping() {

function appendUser(txt) {
  var msgs=document.getElementById('chatMsgs');if(!msgs)return;
  var t=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  var div=document.createElement('div');div.className='msg user';
  div.innerHTML='<div class="msg-av user">I</div><div><div class="bubble">'+txt.replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')+'</div><div class="msg-time">'+t+'</div></div>';
  msgs.appendChild(div);msgs.scrollTop=msgs.scrollHeight;
}

function formatText(txt) {
  var lines=txt.split('\n'),out=[],inTable=false,tableRows=[];
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim();
    if(line.charAt(0)==='|'&&line.charAt(line.length-1)==='|'){if(!inTable){inTable=true;tableRows=[];}tableRows.push(line);}
    else{if(inTable){out.push(renderMdTable(tableRows));tableRows=[];inTable=false;}out.push(lines[i]);}
  }
  if(inTable&&tableRows.length)out.push(renderMdTable(tableRows));
  return out.join('\n').replace(/[*][*](.*?)[*][*]/g,'<strong>$1</strong>').replace(/[*](.*?)[*]/g,'<em>$1</em>').replace(/\n/g,'<br>');
}
function renderMdTable(rows){
  var html='<table style="width:100%;border-collapse:collapse;font-size:11.5px;margin:8px 0">';
  rows.forEach(function(row,idx){
    if(/^\|[\s\-|]+\|$/.test(row))return;
    var cells=row.split('|').filter(function(c,i,a){return i>0&&i<a.length-1;});
    var isHdr=idx===0;
    html+='<tr>';
    cells.forEach(function(cell){
      if(isHdr)html+='<th style="background:#1B2A4A;color:#C9A84C;padding:7px 10px;text-align:left;font-weight:600;font-size:11px">'+cell.trim()+'</th>';
      else{var bg=idx%2===0?'#f8f9fb':'#fff';html+='<td style="padding:7px 10px;border-bottom:0.5px solid #e8e8e8;background:'+bg+'">'+cell.trim()+'</td>';}
    });
    html+='</tr>';
  });
  return html+'</table>';
}

function parseResponseBlocks(text) {
  var result = {text:text, writeData:null, chartData:null, healthTabs:null};

  /* Never render an echoed interface note */
  result.text = result.text.replace(/\[INTERFACE NOTE:[\s\S]*?\]/gi,'').trim();

  /* WRITE_PREVIEW block */
  var wm = text.match(/\[WRITE_PREVIEW\]([\s\S]*?)\[\/WRITE_PREVIEW\]/);
  if(wm){try{result.writeData=JSON.parse(wm[1].trim());}catch(e){} result.text=text.replace(wm[0],'').trim();}

  /* CHART block */
  var cm = text.match(/\[CHART\]([\s\S]*?)\[\/CHART\]/);
  if(cm){try{result.chartData=JSON.parse(cm[1].trim());}catch(e){} result.text=result.text.replace(cm[0],'').trim();}

  /* HEALTH block */
  var hm = text.match(/\[HEALTH\]([\s\S]*?)\[\/HEALTH\]/);
  if(hm){try{result.healthTabs=JSON.parse(hm[1].trim()).registers;}catch(e){} result.text=result.text.replace(hm[0],'').trim();}

  return result;
}

function appendAI(txt, card, parse) {
  if(parse !== false) {
    var blocks = parseResponseBlocks(txt || '');
    txt = blocks.text;

    if(blocks.writeData)  { initiateWrite(blocks.writeData); }
    if(blocks.chartData)  { renderChart(blocks.chartData); }
    if(blocks.healthTabs) { renderHealthInline(blocks.healthTabs); }
  }

  var msgs=document.getElementById('chatMsgs');if(!msgs)return;
  var t=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  var div=document.createElement('div');div.className='msg ai';
  var content='';
  if(txt) content+='<div class="bubble">'+formatText(txt)+'</div>';
  if(card) content+=card;
  div.innerHTML='<div class="massi-msg-av">'+buildMassi(28,'idle')+'</div><div>'+content+'<div class="msg-time">'+t+'</div></div>';
  msgs.appendChild(div);msgs.scrollTop=msgs.scrollHeight;
  console.log('[iMASSI] Response rendered');
}

function addHistory(q) {

   MAIN SEND FLOW — two-step: classify then respond
══════════════════════════════════════════════════════════════ */
function massISend() {
  var inp=document.getElementById('chatInput');if(!inp){console.error('[iMASSI] chatInput not found');return;}
  var txt=inp.value.trim();
  console.log('[iMASSI] massISend: "'+txt.substring(0,60)+'"');
  if(!txt&&!state.pendingParsed)return;
  if(txt)appendUser(txt);
  inp.value='';inp.style.height='38px';
  var chips=document.getElementById('sugChips');if(chips)chips.style.display='none';
  if(state.awaitingConfirm){handleConfirm(txt);return;}
  if(state.pendingParsed){processExcel(txt);return;}
  if(/thank|great|excellent|good job|well done|perfect|amazing/i.test(txt)){setAvatar('happy');setTimeout(function(){setAvatar('idle');},2500);}
  sendToMassi(txt);
}

function massISend_with(txt){var inp=document.getElementById('chatInput');if(inp)inp.value=txt;massISend();}

async function sendToMassi(txt) {
  if(!GROQ_KEY){appendAI('Still connecting to the AI service (the key loads from Google Sheets config). Give it a second and try again.',null,false);return;}
  console.log('[iMASSI] sendToMassi: "'+txt.substring(0,60)+'"');

  /* Show typing immediately */
  setAvatar('thinking');
  showTyping();

  /* Step 1: Classify intent — LOCAL keyword classifier only.
     The LLM-based classifier cost one extra API request per message,
     which doubled free-tier quota consumption. The keyword classifier
     covers the same roles/registers at zero API cost. */
  console.log('[iMASSI] Step 1: classifying intent (local)...');
  var intent = fallbackIntent(txt);
  console.log('[iMASSI] Intent:', JSON.stringify(intent));

  /* Step 2: Build targeted context from cache */
  var context = buildSmartContext(intent);
  console.log('[iMASSI] Context built: '+context.length+' chars | tabs: '+(intent.primary_registers||[]).join(','));

  /* Full-listing path: if the user asked for the table / all records, render the
     complete register directly from cache (no LLM truncation possible), then let
     the LLM add a short professional read of the data instead of re-listing it. */
  var listNote = '';
  if (detectListAll(txt)) {
    var listTab = resolveListTab(txt, intent);
    if (listTab && state.sheetCache[listTab] && state.sheetCache[listTab].data && (state.sheetCache[listTab].data.rows||[]).length) {
      removeTyping();
      var totalRows = state.sheetCache[listTab].data.rows.length;
      renderFullRegisterTable(listTab);
      showTyping();
      listNote = '\n\n[INTERFACE NOTE: The complete ' + listTab + ' register (' + totalRows + ' records) is already displayed to the user as a full scrollable table. Do NOT list the records again and do NOT repeat or mention this note. Give a brief professional read of this data instead: 2-4 sentences on what stands out — open/overdue items, patterns, risks — and one concrete suggested next step.]';
    }
  }

  /* Select specialist prompt */
  var specialistPrompt = {
    auditor:      PROMPT_AUDITOR,
    analyst:      PROMPT_ANALYST,
    advisor:      PROMPT_ADVISOR,
    writer:       PROMPT_WRITER,
    data_manager: PROMPT_DATA_MANAGER
  }[intent.role] || PROMPT_ADVISOR;

  /* Build full message array — the INTERFACE NOTE goes only into the outgoing
     message, never into stored history, so the model can't learn to echo it. */
  var systemContent = PROMPT_BASE + '\n\n' + specialistPrompt;
  var userContent   = context ? (txt + '\n\n' + context) : txt;

  state.history.push({role:'user', content: userContent});
  if(state.history.length > 16) state.history = state.history.slice(-16);

  var messages = [{role:'system', content:systemContent}];
  state.history.forEach(function(m){messages.push({role:m.role, content:m.content});});
  if (listNote) messages[messages.length-1] = {role:'user', content: userContent + listNote};

  console.log('[iMASSI] LLM call: role='+intent.role+' messages='+messages.length+' systemTokens~'+Math.round(systemContent.length/4));
  var t0 = performance.now();

  /* LLM call — provider chain with graceful degradation:
     Groq 70B → Cerebras 70B (same model, independent quota) → Groq 8B
     If the whole chain is busy: wait the advised seconds, retry the chain end once. */
  var llmDone = false;
  var providers = buildProviders();

  function isQuotaError(err) {
    if (!err) return false;
    var code = err.code;
    if (code === 429 || code === 500 || code === 502 || code === 503) return true;
    if (String(code||'').match(/rate_limit|capacity|unavailable|overload/i)) return true;
    if (err.type && /rate_limit|capacity|unavailable|overload/i.test(err.type)) return true;
    /* message-based: rate limits AND temporary capacity problems ("high demand") */
    return /rate.?limit|quota|too many|high demand|over.?capacit|capacity|unavailable|overload|try again later|temporar/i.test(err.message || '');
  }
  function retrySeconds(err) {
    var msg = (err && err.message) || '';
    var m = /try again in (?:(\d+)m)?([0-9.]+)s/i.exec(msg) || /retry in (?:(\d+)m)?([0-9.]+)s/i.exec(msg);
    if (!m) return 20;
    return Math.ceil((parseInt(m[1]||'0',10) * 60) + parseFloat(m[2]));
  }

  function llmAttempt(pIdx, waitedOnce) {
    var p = providers[Math.min(pIdx, providers.length - 1)];
    var llmTimeout = setTimeout(function() {
      if(!llmDone){llmDone=true;removeTyping();setAvatar('idle');appendAI('The AI took too long to respond (60s). Please try again.',null,false);}
    }, LLM_TIMEOUT);

    fetch(p.url, {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+p.key},
      body:JSON.stringify(toGroqBody(messages, 1500, 0.7, p.model))
    })
    .then(function(r){console.log('[iMASSI] '+p.name+' HTTP '+r.status);return r.json();})
    .then(function(d){
      if(llmDone)return;
      clearTimeout(llmTimeout);
      var elapsed=Math.round(performance.now()-t0);
      var gtxt=groqText(d);

      if(!gtxt) {
        console.warn('[iMASSI] '+p.name+' gave no answer'+(d.error?' ('+(d.error.message||d.error.type||'error')+')':'')+' — moving down the chain');
        if (pIdx < providers.length - 1) {
          /* next provider, immediately — the user never notices */
          llmAttempt(pIdx + 1, waitedOnce);
          return;
        }
        if (d.error && isQuotaError(d.error) && !waitedOnce) {
          /* whole chain busy — wait the advised time, then one final retry */
          var secs = retrySeconds(d.error);
          removeTyping();
          appendAI('All AI services are momentarily busy — no problem, I will retry automatically in <strong>' + secs + ' seconds</strong>. Your question stays queued.', null, false);
          showTyping();
          setTimeout(function(){ llmAttempt(providers.length - 1, true); }, (secs + 1) * 1000);
          return;
        }
      }

      llmDone=true;
      console.log('[iMASSI] Response in '+elapsed+'ms | provider='+p.name+' | intent='+intent.intent+' role='+intent.role);
      removeTyping();
      var resp='I could not get a response. Please try again.';
      if(gtxt)resp=gtxt;
      else if(d.error && isQuotaError(d.error))resp='All AI services are still busy after several retries. Please wait a minute and ask again — your data cache is unaffected.';
      else if(d.error)resp='AI error: '+d.error.message;
      state.history.push({role:'assistant', content:resp});
      setAvatar('idle');
      appendAI(resp);
      addHistory(txt);
    })
    .catch(function(err){
      if(llmDone)return;
      clearTimeout(llmTimeout);
      /* network-level failure on one provider: try the next before surfacing an error */
      if (pIdx < providers.length - 1) { console.warn('[iMASSI] '+p.name+' fetch failed ('+err.message+') — trying next provider'); llmAttempt(pIdx + 1, waitedOnce); return; }
      llmDone=true;
      removeTyping();setAvatar('idle');
      appendAI('Connection error: '+err.message+'. Check your internet connection.',null,false);
      console.error('[iMASSI] LLM error:',err);
    });
  }

  llmAttempt(0, false);
}

function handleConfirm(txt){
  if(/yes|y|confirm|proceed|ok/i.test(txt.trim())){state.awaitingConfirm=false;appendAI('Confirmed.');setAvatar('success');setTimeout(function(){setAvatar('idle');},2500);}
  else if(/no|n|cancel/i.test(txt.trim())){state.awaitingConfirm=false;appendAI('Cancelled. No changes made.');}
  else{appendAI('Type yes to confirm or no to cancel.');}
}

window.addEventListener('DOMContentLoaded', function() {
  console.log('[iMASSI] === PAGE LOAD === ' + new Date().toISOString());

  /* Excel file input */
  var xlFile = document.getElementById('xlFile');
  if(xlFile) {
    xlFile.addEventListener('change', function(e) {
      var file=e.target.files[0];if(!file)return;
      var reader=new FileReader();
      reader.onload=function(ev){
        try{
          var wb=XLSX.read(ev.target.result,{type:'array'});
          var ws=wb.Sheets[wb.SheetNames[0]];
          var data=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
          if(data.length<2){appendAI('That file appears empty.');return;}
          state.pendingParsed={headers:data[0].map(String),rows:data.slice(1).filter(function(r){return r.some(function(c){return String(c).trim();});})};
          var chip=document.getElementById('fileChip');if(chip)chip.style.display='flex';
          document.getElementById('fileChipName').textContent=file.name;
          document.getElementById('fileChipInfo').textContent=' — '+state.pendingParsed.rows.length+' rows';
          var inp=document.getElementById('chatInput');if(inp)inp.focus();
        }catch(err){appendAI('Could not read that file.');}
      };
      reader.readAsArrayBuffer(file);e.target.value='';
    });
  }

  requestAnimationFrame(function() {
    setStatus('connecting','Connecting to Google Sheets...');
    setAvatar('greeting');
    setTimeout(function(){setAvatar('idle');},2500);

    var daysToS1=Math.max(0,Math.floor((new Date('2026-08-25')-new Date())/86400000));
    appendAI(
      'Hello. I am iMASSI — your AI Digital IMS Manager for SAGCO.' +
      '<br><br>Connecting to Google Sheets now. I will load all 62 registers in the background.' +
      '<br>Stage 1 audit is in <strong>'+daysToS1+' days</strong>.' +
      '<br><br>You can ask me anything immediately.',
      null, false
    );

    /* Fetch AI keys securely from Apps Script config (never stored in this file).
       groqKey is required; cerebrasKey is optional and enables the 70B fallback. */
    fetch(SHEETS_URL+'?action=getConfig')
      .then(function(r){return r.json();})
      .then(function(d){
        if(d&&d.groqKey){GROQ_KEY=d.groqKey;console.log('[iMASSI] Groq key loaded');}
        else console.error('[iMASSI] getConfig returned no groqKey:',JSON.stringify(d));
        if(d&&d.cerebrasKey){CEREBRAS_KEY=d.cerebrasKey;console.log('[iMASSI] Cerebras key loaded');discoverCerebrasModel();}
        else console.log('[iMASSI] No cerebrasKey in config — fallback will use Groq 8B');
      })
      .catch(function(err){console.error('[iMASSI] Key fetch error:',err.message);});

    /* Load all 62 sheets in background */
    initCache().then(function() {
      var n=Object.keys(state.sheetCache).length;
      var openCapas=0;
      var ce=state.sheetCache['capa'];
      if(ce&&ce.data&&ce.data.rows){var si=(ce.data.headers||[]).findIndex(function(h){return /status/i.test(h);});if(si>=0)openCapas=ce.data.rows.filter(function(r){return /open/i.test(String(r[si]||''));}).length;}
      appendAI(
        'Connected. <strong>'+n+' of '+ALL_TABS.length+' registers loaded</strong> from Google Sheets. ' +
        (openCapas>0?'I can see <strong>'+openCapas+' open CAPA'+(openCapas>1?'s':'')+'</strong> in your register. ':'') +
        'Register health is now visible in the panel on the right.',
        null, false
      );
      updateHealthPanel();
    }).catch(function(err){
      setStatus('error','Connection failed: '+err.message);
      appendAI('Warning: Could not connect to Google Sheets ('+err.message+'). I can still answer general IMS questions. Click Retry in the status bar.',null,false);
    });
  });
});
