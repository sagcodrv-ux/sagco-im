<!DOCTYPE html>

<head>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f5f7;margin:0;padding:0}

/* Layout */
.massi-page{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;overflow:hidden;z-index:9998}
.massi-centre{display:flex;flex-direction:column;flex:1;min-height:0;background:white;border:none}

/* Header */
.chat-header{background:linear-gradient(135deg,#1B2A4A 0%,#243a5e 100%);border-bottom:none;
  padding:16px 24px;display:flex;align-items:center;gap:16px;flex-shrink:0;position:relative;overflow:hidden}
.chat-header::before{content:'';position:absolute;top:-50px;right:-30px;width:200px;height:200px;
  border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.1) 0%,transparent 70%);
  animation:hpulse 3s ease-in-out infinite;pointer-events:none}
@keyframes hpulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.2);opacity:1}}
.chat-header-av-wrap{position:relative;flex-shrink:0;width:80px;height:104px;
  display:flex;align-items:center;justify-content:center}
.av-ring{position:absolute;border-radius:50%;border:1.5px solid rgba(201,168,76,.3);
  animation:avring 2.5s ease-in-out infinite;pointer-events:none}
.av-ring1{width:88px;height:88px}
.av-ring2{width:108px;height:108px;animation-delay:.5s}
@keyframes avring{0%,100%{transform:scale(.9);opacity:.6}50%{transform:scale(1.05);opacity:.15}}
.chat-header-info{flex:1;z-index:1}
.chat-header-title{font-size:22px;font-weight:700;color:#C9A84C;letter-spacing:1.5px}
.chat-header-sub{font-size:11px;color:rgba(255,255,255,.5);margin-top:3px}
.chat-header-live{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:10.5px;color:rgba(255,255,255,.5)}
.ch-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;animation:status-pulse 2s ease-in-out infinite}
.hdr-badge{display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:10px;
  background:rgba(255,255,255,.1);border:0.5px solid rgba(255,255,255,.15);
  font-size:10px;font-weight:600;white-space:nowrap}
.hdr-badge-dot{width:6px;height:6px;border-radius:50%}
.hdr-badge-dot.loading,.hdr-badge-dot.connecting,.hdr-badge-dot.syncing{background:#EF9F27;animation:status-pulse 1s ease-in-out infinite}
.hdr-badge-dot.ready{background:#4ade80}
.hdr-badge-dot.error{background:#E24B4A}
.hdr-badge-dot.offline{background:#aaa}
.hdr-badge-txt{color:rgba(255,255,255,.8)}

/* DB status strip */
.db-strip{flex-shrink:0;padding:6px 24px;display:flex;align-items:center;gap:8px;
  font-size:11px;background:#f8f9fb;border-bottom:0.5px solid #e8e8e8;transition:background .3s}
.db-strip.loading,.db-strip.connecting,.db-strip.syncing{background:#EEF5FF}
.db-strip.ready{background:#F0FAF0}
.db-strip.error{background:#FFF0F0}
.db-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.db-dot.loading,.db-dot.connecting,.db-dot.syncing{background:#378ADD;animation:status-pulse 1s ease-in-out infinite}
.db-dot.ready{background:#4ade80}
.db-dot.error{background:#E24B4A;animation:status-pulse .5s ease-in-out infinite}
.db-dot.offline{background:#aaa}
.db-label{font-weight:600;color:#333;min-width:90px}
.db-detail{color:#666;flex:1;font-size:10.5px}
.db-sync{font-size:10px;color:#aaa;margin-left:auto;white-space:nowrap}
.db-retry{margin-left:8px;background:#E24B4A;color:white;border:none;border-radius:4px;
  padding:2px 8px;font-size:10px;font-weight:600;cursor:pointer;display:none}
.db-progress{height:2px;width:100px;background:#ddd;border-radius:1px;overflow:hidden;flex-shrink:0}
.db-prog-fill{height:100%;background:#378ADD;width:0%;transition:width .3s ease;border-radius:1px}
.db-prog-fill.done{background:#4ade80}

/* Chat */
.suggested-chips{padding:8px 24px;display:flex;flex-wrap:wrap;gap:6px;flex-shrink:0;
  background:#fafafa;border-bottom:0.5px solid #f0f0f0}
.sug-chip{background:#f5f5f5;border:0.5px solid #e0e0e0;border-radius:16px;padding:5px 12px;
  font-size:11px;cursor:pointer;color:#444;transition:all .12s;white-space:nowrap}
.sug-chip:hover{background:#E6F1FB;border-color:#B5D4F4;color:#0C447C}
.chat-msgs{flex:1;overflow-y:auto;padding:16px 24px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;max-width:100%}
.msg.user{flex-direction:row-reverse}
.msg-av{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;font-size:13px;font-weight:600;margin-top:1px}
.msg-av.user{background:#E6F1FB;color:#0C447C}
.massi-msg-av{flex-shrink:0;width:28px;height:36px;margin-top:1px}
.bubble{padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.7;max-width:65%}
.msg.ai .bubble{background:#f5f5f5;border-radius:3px 12px 12px 12px;color:#1a1a1a}
.msg.user .bubble{background:#1B2A4A;color:white;border-radius:12px 3px 12px 12px}
.msg.ai .bubble a{color:#185FA5}
.msg-time{font-size:9.5px;color:#aaa;margin-top:3px;padding:0 3px}
.msg.user .msg-time{text-align:right}
.typing-b{display:flex;align-items:center;gap:3px;padding:9px 12px;background:#f5f5f5;border-radius:3px 10px 10px 10px}
.tdot{width:5px;height:5px;border-radius:50%;background:#999;animation:td 1.2s ease-in-out infinite}
.tdot:nth-child(2){animation-delay:.2s}.tdot:nth-child(3){animation-delay:.4s}
@keyframes td{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:.9;transform:scale(1)}}
.hist-item{padding:6px 0;border-bottom:0.5px solid #f5f5f5;cursor:pointer}
.hist-item:hover .hist-q{color:#185FA5}
.hist-q{font-size:11px;color:#333;margin-bottom:1px;line-height:1.4}
.hist-t{font-size:9.5px;color:#aaa}
.file-chip{background:#E6F1FB;border:0.5px solid #B5D4F4;border-radius:6px;
  padding:4px 8px;font-size:10px;color:#0C447C;display:flex;align-items:center;gap:4px;margin-bottom:5px}
.chat-input-area{border-top:1px solid #f0f0f0;padding:12px 24px;display:flex;
  gap:7px;align-items:flex-end;flex-shrink:0;background:white;box-shadow:0 -4px 16px rgba(0,0,0,.04)}
.chat-textarea{width:100%;border:0.5px solid #ddd;border-radius:8px;padding:10px 14px;
  font-size:13px;resize:none;min-height:44px;max-height:160px;font-family:Arial,sans-serif;
  outline:none;color:#1a1a1a;line-height:1.5;overflow-y:auto}
.chat-textarea:focus{border-color:#888}
.attach-btn{width:32px;height:32px;border-radius:7px;background:#f5f5f5;border:0.5px solid #ddd;
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
.attach-btn:hover{background:#ebebeb}
.send-btn-lg{height:36px;border-radius:8px;background:#1B2A4A;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0 18px;
  gap:5px;font-size:13px;font-weight:600;color:#C9A84C;white-space:nowrap}
.send-btn-lg:hover{background:#243a5e}

/* Animations */
@keyframes status-pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes massi-blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(0.05)}}
@keyframes massi-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes massi-nod{0%,100%{transform:translateY(0)}30%,70%{transform:translateY(-4px)}50%{transform:translateY(-7px)}}
@keyframes massi-wave{0%,100%{transform:rotate(0deg)}20%{transform:rotate(-18deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-10deg)}80%{transform:rotate(6deg)}}
@keyframes massi-celebrate{0%,100%{transform:scale(1) rotate(0deg)}25%{transform:scale(1.08) rotate(-3deg)}50%{transform:scale(1.12) rotate(3deg)}75%{transform:scale(1.06) rotate(-2deg)}}
@keyframes massi-ring{0%{r:19;opacity:.6}100%{r:24;opacity:0}}
@keyframes massi-scan{0%,100%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
@keyframes massi-t1{0%,100%{opacity:.3;transform:scale(.7)}33%{opacity:1;transform:scale(1)}}
@keyframes massi-t2{0%,100%{opacity:.3;transform:scale(.7)}66%{opacity:1;transform:scale(1)}}
@keyframes massi-t3{0%,100%{opacity:.3;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}
</style>

<script>

const GROQ_URL   = 'https://api.groq.com/openai/v1/chat/completions';

var   GROQ_KEY   = ''; /* loaded securely from Apps Script on startup — never stored in this file */

/* ── Timeouts ──────────────────────────────────────────────────────── */

const LLM_TIMEOUT   = 60000;  // 60s LLM request
const CACHE_TTL     = 5 * 60 * 1000; // 5 min cache
const BATCH_SIZE    = 6;

/* ── App state ─────────────────────────────────────────────────────── */

};

/* ── All 62 Google Sheets tabs ─────────────────────────────────────── */
var ALL_TABS = [

/* ── Keyword → tab map ─────────────────────────────────────────────── */
var TAB_KEYWORDS = {

  incidents:       ['incident','accident','injury','near miss','ltifr','fatality','lost time'],

};

/* ══════════════════════════════════════════════════════════════
   SYSTEM PROMPT — 3 layers
══════════════════════════════════════════════════════════════ */
var SYSTEM_PROMPT = [
  'You are iMASSI — the Intelligent IMS Copilot at Saudi Arabian Glass Company Ltd. (SAGCO), Jeddah Industrial City Phase 4.',
  '',
  'SAGCO FACTS: 5 HFO-fired furnaces F1-F5 | 884 employees | 152 contractors',

  '  Status badges: OPEN/AT RISK → #FCEBEB/#791F1F | CLOSED/ON TRACK → #EAF3DE/#27500A | IN PROGRESS → #FAEEDA/#633806',
  'KPI summaries → cards with progress bars',

/* ══════════════════════════════════════════════════════════════
   STATUS UI
══════════════════════════════════════════════════════════════ */
function setStatus(status, detail, pct) {
  var cfg = {
    offline:    {label:'Offline',     cls:'offline'},
    connecting: {label:'Connecting',  cls:'connecting'},
    loading:    {label:'Loading',     cls:'loading'},
    syncing:    {label:'Syncing',     cls:'syncing'},
    ready:      {label:'Connected',   cls:'ready'},
    error:      {label:'Error',       cls:'error'}
  }[status] || {label:'Offline', cls:'offline'};

  var strip  = document.getElementById('dbStrip');
  var dot    = document.getElementById('dbDot');
  var label  = document.getElementById('dbLabel');
  var detEl  = document.getElementById('dbDetail');
  var prog   = document.getElementById('dbProgress');
  var fill   = document.getElementById('dbFill');
  var sync   = document.getElementById('dbSync');
  var retry  = document.getElementById('dbRetry');
  var hdrDot = document.getElementById('hdrDot');
  var hdrTxt = document.getElementById('hdrTxt');

  if (strip)  strip.className  = 'db-strip ' + cfg.cls;
  if (dot)    dot.className    = 'db-dot '   + cfg.cls;
  if (label)  label.textContent  = cfg.label;
  if (detEl)  detEl.textContent  = detail || '';
  if (hdrDot) hdrDot.className   = 'hdr-badge-dot ' + cfg.cls;
  if (hdrTxt) hdrTxt.textContent = cfg.label;

  if (prog) {
    if (pct !== undefined && status !== 'ready' && status !== 'error') {
      prog.style.display = 'block';
      if (fill) { fill.style.width = pct + '%'; fill.className = 'db-prog-fill'; }
    } else if (status === 'ready') {
      prog.style.display = 'block';
      if (fill) { fill.style.width = '100%'; fill.className = 'db-prog-fill done'; }
    } else {
      prog.style.display = 'none';
    }
  }

  if (sync && status === 'ready') {
    var now = new Date();
    sync.textContent = 'Synced ' + now.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
  }
  if (retry) retry.style.display = (status === 'error') ? 'inline-block' : 'none';

  console.log('[iMASSI] Status:', status, '|', detail || '');
}

function retryConn() {
  state.cacheLoading = false;
  state.cacheReady   = false;
  state.sheetCache   = {};
  initCache();
}

/* ══════════════════════════════════════════════════════════════
   SHEET CACHE — background, non-blocking
══════════════════════════════════════════════════════════════ */
function fetchWithTimeout(url, ms) {
  return new Promise(function(resolve, reject) {
    var tid = setTimeout(function() { reject(new Error('timeout')); }, ms);
    fetch(url).then(function(r) {
      clearTimeout(tid);
      return r.json();
    }).then(resolve).catch(function(e) {
      clearTimeout(tid);
      reject(e);
    });
  });
}

function loadTab(tab) {
  var url = SHEETS_URL + '?tab=' + tab + '&limit=100';
  console.log('[iMASSI][SHEETS] Fetching: ' + tab);
  var t0 = performance.now();
  return fetchWithTimeout(url, SHEET_TIMEOUT)
    .then(function(data) {
      var ms = Math.round(performance.now() - t0);
      var rows = (data && data.rows) ? data.rows.length : 0;
      console.log('[iMASSI][SHEETS] OK: ' + tab + ' — ' + rows + ' rows in ' + ms + 'ms');
      if (data) state.sheetCache[tab] = { data: data, ts: Date.now() };
      return data;
    })
    .catch(function(err) {
      console.warn('[iMASSI][SHEETS] FAIL: ' + tab + ' — ' + err.message);
      return null;
    });
}

async function initCache() {
  if (state.cacheLoading) return;
  state.cacheLoading = true;
  state.cacheReady   = false;
  var t0 = performance.now();
  console.log('[iMASSI] === CACHE INIT START === ' + new Date().toISOString());
  console.log('[iMASSI] Target: ' + ALL_TABS.length + ' sheets');

  setStatus('connecting', 'Connecting to Google Sheets...');

  /* Phase 1: priority tabs */
  setStatus('loading', 'Loading priority registers...', 0);
  console.log('[iMASSI] Phase 1: ' + PRIORITY_TABS.length + ' priority tabs');
  var t1 = performance.now();
  await Promise.allSettled(PRIORITY_TABS.map(function(t) { return loadTab(t); }));
  var p1n = Object.keys(state.sheetCache).length;
  var p1ms = Math.round(performance.now() - t1);
  console.log('[iMASSI] Phase 1 done: ' + p1n + ' loaded in ' + p1ms + 'ms');

  state.cacheReady = true; /* can answer questions from now on */
  setStatus('loading', 'Priority data ready — loading ' + (ALL_TABS.length - PRIORITY_TABS.length) + ' more...', Math.round(p1n / ALL_TABS.length * 100));

  /* Phase 2: remaining in batches */
  var remaining = ALL_TABS.filter(function(t) { return PRIORITY_TABS.indexOf(t) < 0; });
  var t2 = performance.now();
  for (var i = 0; i < remaining.length; i += BATCH_SIZE) {
    var batch = remaining.slice(i, i + BATCH_SIZE);
    await Promise.allSettled(batch.map(function(t) { return loadTab(t); }));
    var n = Object.keys(state.sheetCache).length;
    setStatus('syncing', 'Building cache: ' + n + ' / ' + ALL_TABS.length + ' registers', Math.round(n / ALL_TABS.length * 100));
  }

  var total   = Object.keys(state.sheetCache).length;
  var elapsed = Math.round(performance.now() - t0);
  state.cacheTime    = Date.now();
  state.cacheLoading = false;
  state.cacheReady   = true;

  /* Count open CAPAs */
  var openCapas = 0;
  var capaEntry = state.sheetCache['capa'];
  if (capaEntry && capaEntry.data && capaEntry.data.rows) {
    var hdr = capaEntry.data.headers || [];
    var si  = hdr.findIndex(function(h) { return /status/i.test(h); });
    if (si >= 0) openCapas = capaEntry.data.rows.filter(function(r) { return /open/i.test(String(r[si] || '')); }).length;
  }

  var readyMsg = total + ' of ' + ALL_TABS.length + ' registers loaded' + (openCapas > 0 ? ' — ' + openCapas + ' open CAPAs' : '');
  setStatus('ready', readyMsg);

  console.log('[iMASSI] === CACHE INIT COMPLETE ===');
  console.log('[iMASSI] Loaded:  ' + total + ' / ' + ALL_TABS.length);
  console.log('[iMASSI] Phase 1: ' + p1ms + 'ms');
  console.log('[iMASSI] Phase 2: ' + Math.round(performance.now() - t2) + 'ms');
  console.log('[iMASSI] Total:   ' + elapsed + 'ms');

  /* Refresh every 5 min */
  setTimeout(function bgRefresh() {
    var stale = ALL_TABS.filter(function(t) {
      var e = state.sheetCache[t];
      return !e || (Date.now() - e.ts) > CACHE_TTL;
    });
    if (stale.length) {
      console.log('[iMASSI] BG refresh: ' + stale.length + ' stale tabs');
      setStatus('syncing', 'Refreshing ' + stale.length + ' registers...');
      Promise.allSettled(stale.map(function(t) { return loadTab(t); })).then(function() {
        setStatus('ready', Object.keys(state.sheetCache).length + ' registers — refreshed');
      });
    }
    setTimeout(bgRefresh, CACHE_TTL);
  }, CACHE_TTL);
}

/* ══════════════════════════════════════════════════════════════
   CONTEXT BUILDER — uses cache
══════════════════════════════════════════════════════════════ */
function getRelevantTabs(txt) {
  var lower = txt.toLowerCase();
  var matched = [];
  Object.keys(TAB_KEYWORDS).forEach(function(tab) {
    var keys = TAB_KEYWORDS[tab];
    for (var i = 0; i < keys.length; i++) {
      if (lower.indexOf(keys[i]) >= 0) {
        if (matched.indexOf(tab) < 0) matched.push(tab);
        break;
      }
    }
  });
  if (matched.length === 0) {
    var isData = /show|list|find|what|how many|status|report|overview|summary|check|display/i.test(txt);
    var isSagco = /sagco|ims|iso|audit|capa|kpi|furnace|energy|safety|quality|environment|hsse/i.test(txt);
    if (isData || isSagco) matched = ['kpi_dashboard','capa','objectives','hira','compliance'];
  }
  return matched;
}

function buildContext(tabs) {
  if (!tabs || !tabs.length) return '';
  var parts = [];
  tabs.forEach(function(tab) {
    var entry = state.sheetCache[tab];
    if (!entry || !entry.data) { parts.push('[' + tab + ': not loaded yet]'); return; }
    var d = entry.data;
    var rows = (d.rows || []).slice(0, 50);
    var headers = d.headers || [];
    if (!rows.length) { parts.push('[' + tab + ': sheet is empty — needs data entry]'); return; }
    var age = Math.round((Date.now() - entry.ts) / 1000);
    var lines = ['=== LIVE DATA: ' + tab.toUpperCase() + ' (' + rows.length + ' records, ' + age + 's ago) ==='];
    lines.push('Columns: ' + headers.join(' | '));
    rows.forEach(function(row) {
      var obj = {};
      headers.forEach(function(h, j) { if (h && row[j] !== undefined && row[j] !== '') obj[h] = row[j]; });
      if (Object.keys(obj).length) lines.push(JSON.stringify(obj));
    });
    parts.push(lines.join('\n'));
  });
  return parts.join('\n\n');
}

function formatText(txt) {
  /* Convert markdown tables to HTML */
  var lines = txt.split('\n');
  var out = [], inTable = false, tableRows = [];
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (line.charAt(0) === '|' && line.charAt(line.length-1) === '|') {
      if (!inTable) { inTable = true; tableRows = []; }
      tableRows.push(line);
    } else {
      if (inTable) { out.push(renderTable(tableRows)); tableRows = []; inTable = false; }
      out.push(line);
    }
  }
  if (inTable && tableRows.length) out.push(renderTable(tableRows));
  return out.join('\n')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/\n/g, '<br>');
}

function renderTable(rows) {
  var html = '<table style="width:100%;border-collapse:collapse;font-size:11.5px;margin:8px 0">';
  rows.forEach(function(row, idx) {
    if (/^\|[\s\-|]+\|$/.test(row)) return;
    var cells = row.split('|').filter(function(c, i, a) { return i > 0 && i < a.length-1; });
    var isHdr = idx === 0;
    html += '<tr>';
    cells.forEach(function(cell) {
      if (isHdr) {
        html += '<th style="background:#1B2A4A;color:#C9A84C;padding:7px 10px;text-align:left;font-weight:600;font-size:11px">' + cell.trim() + '</th>';
      } else {
        var bg = (idx % 2 === 0) ? '#f8f9fb' : '#ffffff';
        html += '<td style="padding:7px 10px;border-bottom:0.5px solid #e8e8e8;background:' + bg + '">' + cell.trim() + '</td>';
      }
    });
    html += '</tr>';
  });
  return html + '</table>';
}

══════════════════════════════════════════════════════════════ */
function massISend() {
  var inp = document.getElementById('chatInput');
  if (!inp) { console.error('[iMASSI] chatInput not found'); return; }
  var txt = inp.value.trim();
  console.log('[iMASSI] massISend called, txt="' + txt.substring(0,60) + '"');
  if (!txt && !state.pendingParsed) return;
  if (txt) appendUser(txt);
  inp.value = ''; inp.style.height = '38px';
  var chips = document.getElementById('sugChips');
  if (chips) chips.style.display = 'none';
  if (state.awaitingConfirm) { handleConfirm(txt); return; }
  if (state.pendingParsed)   { processExcel(txt); return; }
  if (/thank|great|excellent|good job|well done|perfect|amazing/i.test(txt)) {
    setAvatar('happy'); setTimeout(function() { setAvatar('idle'); }, 2500);
  }
  sendToMassi(txt);
}

function massISend_with(txt) {
  var inp = document.getElementById('chatInput');
  if (inp) { inp.value = txt; }
  massISend();
}

function sendToMassi(txt) {
  console.log('[iMASSI] sendToMassi: "' + txt.substring(0,60) + '"');

  /* If key not yet loaded, retry in 1s */
  if (!GROQ_KEY) {
    console.warn('[iMASSI] Groq key not loaded yet — retrying in 1s');
    appendAI('Just a moment — still loading the AI configuration...');
    setTimeout(function() { sendToMassi(txt); }, 1000);
    return;
  }

  /* Show typing immediately — never delay */
  setAvatar('thinking');
  showTyping();

  /* Build context from cache (synchronous — no await) */
  var tabs       = getRelevantTabs(txt);
  var context    = buildContext(tabs);
  var sourceInfo = tabs.length > 0 ? '\n[Sheets queried: ' + tabs.join(', ') + ']' : '';

  console.log('[iMASSI] Tabs: [' + tabs.join(', ') + '] | Context: ' + context.length + ' chars');

  /* Build messages */
  var fullMsg = context ? (txt + '\n\n' + context + sourceInfo) : txt;
  state.history.push({role:'user', content: fullMsg});
  if (state.history.length > 20) state.history = state.history.slice(-20);

  var messages = [{role:'system', content: SYSTEM_PROMPT}];
  state.history.forEach(function(m) { messages.push({role: m.role, content: m.content}); });

  console.log('[iMASSI] LLM request start — ' + messages.length + ' messages');
  var t0 = performance.now();

  /* LLM request with timeout */
  var llmDone = false;
  var llmTimeout = setTimeout(function() {
    if (!llmDone) {
      llmDone = true;
      removeTyping(); setAvatar('idle');
      appendAI('Sorry, the AI took too long to respond (60s timeout). Please try again.');
      console.error('[iMASSI] LLM timeout after 60s');
    }
  }, LLM_TIMEOUT);

  fetch(GROQ_URL, {
    method: 'POST',
    headers: {'Content-Type':'application/json', 'Authorization':'Bearer ' + GROQ_KEY},
    body: JSON.stringify({model: GROQ_MODEL, messages: messages, max_tokens: 1200, temperature: 0.7})
  })
  .then(function(r) {
    console.log('[iMASSI] Groq HTTP status: ' + r.status);
    return r.json();
  })
  .then(function(d) {
    if (llmDone) return;
    llmDone = true;
    clearTimeout(llmTimeout);
    var elapsed = Math.round(performance.now() - t0);
    console.log('[iMASSI] Groq response in ' + elapsed + 'ms');
    removeTyping();
    var resp = 'I could not get a response. Please try again.';
    if (d.choices && d.choices[0]) resp = d.choices[0].message.content;
    else if (d.error) resp = 'AI error: ' + d.error.message;
    else console.warn('[iMASSI] Unexpected Groq response:', JSON.stringify(d).substring(0,200));
    state.history.push({role:'assistant', content: resp});
    setAvatar('idle');
    appendAI(resp);
    addHistory(txt);
  })
  .catch(function(err) {
    if (llmDone) return;
    llmDone = true;
    clearTimeout(llmTimeout);
    removeTyping(); setAvatar('idle');
    var msg = 'Connection error: ' + err.message + '. Check your internet connection.';
    appendAI(msg);
    console.error('[iMASSI] Groq fetch error:', err);
  });
}

          var ws = wb.Sheets[wb.SheetNames[0]];
          var data = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
          if (data.length < 2) { appendAI('That file appears empty.'); return; }
          state.pendingParsed = {
            headers: data[0].map(String),
            rows: data.slice(1).filter(function(r) { return r.some(function(c) { return String(c).trim(); }); })
          };
          var chip = document.getElementById('fileChip');
          if (chip) chip.style.display = 'flex';
          document.getElementById('fileChipName').textContent = file.name;
          document.getElementById('fileChipInfo').textContent = ' — ' + state.pendingParsed.rows.length + ' rows';
          var inp = document.getElementById('chatInput');
          if (inp) inp.focus();
        } catch(err) { appendAI('Could not read that file — ensure it is a valid .xlsx or .csv.'); }
      };
      reader.readAsArrayBuffer(file);
      e.target.value = '';
    });
  }

  /* Use requestAnimationFrame to ensure DOM is painted before touching status elements */
  requestAnimationFrame(function() {
    setStatus('connecting', 'Connecting to Google Sheets...');
    setAvatar('greeting');
    setTimeout(function() { setAvatar('idle'); }, 2500);

    var daysToS1 = Math.max(0, Math.floor((new Date('2026-08-25') - new Date()) / 86400000));
    appendAI(
      'Hello! I\'m iMASSI, your IMS Copilot for SAGCO.' +
      '<br><br>Connecting to your Google Sheets database now — you can ask me anything immediately. ' +
      'Stage 1 audit is in <strong>' + daysToS1 + ' days</strong>.'
    );

    /* Load Groq key securely from Apps Script */
    fetch(SHEETS_URL + '?action=getConfig')
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d && d.groqKey) {
          GROQ_KEY = d.groqKey;
          console.log('[iMASSI] Groq key loaded securely from Apps Script');
        } else {
          console.error('[iMASSI] getConfig: no key returned', JSON.stringify(d));
        }
      })
      .catch(function(err) {
        console.error('[iMASSI] Failed to load Groq key:', err.message);
      });

    /* Load cache in background */
    initCache().then(function() {
      var n = Object.keys(state.sheetCache).length;
      var openCapas = 0;
      var ce = state.sheetCache['capa'];
      if (ce && ce.data && ce.data.rows) {
        var hdr = ce.data.headers || [];
        var si  = hdr.findIndex(function(h) { return /status/i.test(h); });
        if (si >= 0) openCapas = ce.data.rows.filter(function(r) { return /open/i.test(String(r[si] || '')); }).length;
      }
      appendAI(
        'Connected. <strong>' + n + ' of ' + ALL_TABS.length + ' registers loaded</strong> from Google Sheets.' +
        (openCapas > 0 ? ' I can see <strong>' + openCapas + ' open CAPA' + (openCapas > 1 ? 's' : '') + '</strong> in your register.' : '') +
        ' Every answer I give comes directly from your live data.'
      );
    }).catch(function(err) {
      console.error('[iMASSI] Cache init error:', err);
      setStatus('error', 'Connection failed: ' + err.message);
      appendAI('Warning: Could not connect to Google Sheets (' + err.message + '). I can still answer general IMS questions, but live register data will not be available. Click Retry in the status bar.');
    });
  });
});

</script>
