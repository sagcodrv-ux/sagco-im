<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iMASSI &mdash; AI Digital IMS Manager | SAGCO</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;margin:0;padding:0}
/* ── LAYOUT ── */
.massi-page{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:row;overflow:hidden;z-index:9998}
#chatCol{display:flex;flex-direction:column;flex:1;min-width:0}
/* ── HEADER ── */
.chat-header{background:linear-gradient(135deg,#1B2A4A 0%,#243a5e 100%);padding:14px 24px;display:flex;align-items:center;gap:16px;flex-shrink:0;position:relative;overflow:hidden}
.chat-header::before{content:'';position:absolute;top:-50px;right:-30px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.1) 0%,transparent 70%);animation:hpulse 3s ease-in-out infinite;pointer-events:none}
@keyframes hpulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.2);opacity:1}}
.chat-header-av-wrap{position:relative;flex-shrink:0;width:80px;height:104px;display:flex;align-items:center;justify-content:center}
.av-ring{position:absolute;border-radius:50%;border:1.5px solid rgba(201,168,76,.3);animation:avring 2.5s ease-in-out infinite;pointer-events:none}
.av-ring1{width:88px;height:88px}.av-ring2{width:108px;height:108px;animation-delay:.5s}
@keyframes avring{0%,100%{transform:scale(.9);opacity:.6}50%{transform:scale(1.05);opacity:.15}}
.chat-header-info{flex:1;z-index:1}
.chat-header-title{font-size:20px;font-weight:700;color:#C9A84C;letter-spacing:1px}
.chat-header-sub{font-size:11px;color:rgba(255,255,255,.5);margin-top:2px}
.chat-header-live{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:10.5px;color:rgba(255,255,255,.5)}
.ch-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;animation:status-pulse 2s ease-in-out infinite}
.hdr-badge{display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:10px;background:rgba(255,255,255,.1);border:0.5px solid rgba(255,255,255,.15);font-size:10px;font-weight:600;white-space:nowrap}
.hdr-badge-dot{width:6px;height:6px;border-radius:50%}
.hdr-badge-dot.connecting,.hdr-badge-dot.loading,.hdr-badge-dot.syncing{background:#EF9F27;animation:status-pulse 1s ease-in-out infinite}
.hdr-badge-dot.ready{background:#4ade80}.hdr-badge-dot.error{background:#E24B4A}.hdr-badge-dot.offline{background:#aaa}
.hdr-badge-txt{color:rgba(255,255,255,.8)}
/* ── DB STRIP ── */
.db-strip{flex-shrink:0;padding:5px 24px;display:flex;align-items:center;gap:8px;font-size:11px;background:#f8f9fb;border-bottom:0.5px solid #e8e8e8;transition:background .3s}
.db-strip.loading,.db-strip.connecting,.db-strip.syncing{background:#EEF5FF}
.db-strip.ready{background:#F0FAF0}.db-strip.error{background:#FFF0F0}
.db-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.db-dot.loading,.db-dot.connecting,.db-dot.syncing{background:#378ADD;animation:status-pulse 1s ease-in-out infinite}
.db-dot.ready{background:#4ade80}.db-dot.error{background:#E24B4A;animation:status-pulse .5s ease-in-out infinite}.db-dot.offline{background:#aaa}
.db-label{font-weight:600;color:#333;min-width:80px}
.db-detail{color:#666;flex:1;font-size:10.5px}
.db-sync{font-size:10px;color:#aaa;margin-left:auto;white-space:nowrap}
.db-retry{margin-left:8px;background:#E24B4A;color:white;border:none;border-radius:4px;padding:2px 8px;font-size:10px;font-weight:600;cursor:pointer;display:none}
.ds-btn{margin-left:8px;background:#1B2A4A;color:#C9A84C;border:none;border-radius:4px;padding:3px 9px;font-size:10px;font-weight:600;cursor:pointer;white-space:nowrap}
.ds-btn:hover{background:#243a5e}
.ds-btn.ds-drive{background:white;color:#1B2A4A;border:0.5px solid #1B2A4A}
.ds-btn.ds-drive:hover{background:#f0f3f8}
.db-progress{height:2px;width:100px;background:#ddd;border-radius:1px;overflow:hidden;flex-shrink:0}
.db-prog-fill{height:100%;background:#378ADD;width:0%;transition:width .3s ease;border-radius:1px}
.db-prog-fill.done{background:#4ade80}
/* ── CHIPS ── */
.suggested-chips{padding:7px 24px;display:flex;flex-wrap:wrap;gap:5px;flex-shrink:0;background:#fafafa;border-bottom:0.5px solid #f0f0f0}
.sug-chip{background:#f5f5f5;border:0.5px solid #e0e0e0;border-radius:14px;padding:4px 11px;font-size:11px;cursor:pointer;color:#444;transition:all .12s;white-space:nowrap}
.sug-chip:hover{background:#E6F1FB;border-color:#B5D4F4;color:#0C447C}
/* ── CHAT ── */
.chat-msgs{flex:1;overflow-y:auto;padding:16px 24px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;max-width:100%}
.msg.user{flex-direction:row-reverse}
.msg-av{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px}
.msg-av.user{background:#1B2A4A;color:#C9A84C}
.massi-msg-av{flex-shrink:0;width:28px;height:36px;margin-top:1px}
.bubble{padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.7;max-width:72%}
.msg.ai .bubble{background:#f5f5f5;border-radius:3px 12px 12px 12px;color:#1a1a1a}
.msg.user .bubble{background:#1B2A4A;color:white;border-radius:12px 3px 12px 12px}
.msg.ai .bubble a{color:#185FA5}
.msg-time{font-size:9.5px;color:#aaa;margin-top:3px;padding:0 3px}
.msg.user .msg-time{text-align:right}
.typing-b{display:flex;align-items:center;gap:3px;padding:9px 12px;background:#f5f5f5;border-radius:3px 10px 10px 10px}
.tdot{width:5px;height:5px;border-radius:50%;background:#999;animation:td 1.2s ease-in-out infinite}
.tdot:nth-child(2){animation-delay:.2s}.tdot:nth-child(3){animation-delay:.4s}
@keyframes td{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:.9;transform:scale(1)}}
.hist-item{padding:5px 0;border-bottom:0.5px solid #f5f5f5;cursor:pointer}
.hist-item:hover .hist-q{color:#185FA5}
.hist-q{font-size:11px;color:#333;line-height:1.4}
.hist-t{font-size:9.5px;color:#aaa}
.file-chip{background:#E6F1FB;border:0.5px solid #B5D4F4;border-radius:6px;padding:4px 8px;font-size:10px;color:#0C447C;display:flex;align-items:center;gap:4px;margin-bottom:5px}
/* ── INPUT ── */
.chat-input-area{border-top:1px solid #f0f0f0;padding:12px 24px;display:flex;gap:7px;align-items:flex-end;flex-shrink:0;background:white;box-shadow:0 -4px 16px rgba(0,0,0,.04)}
.chat-textarea{width:100%;border:0.5px solid #ddd;border-radius:8px;padding:10px 14px;font-size:13px;resize:none;min-height:44px;max-height:160px;font-family:Arial,sans-serif;outline:none;color:#1a1a1a;line-height:1.5;overflow-y:auto}
.chat-textarea:focus{border-color:#888}
.attach-btn{width:32px;height:32px;border-radius:7px;background:#f5f5f5;border:0.5px solid #ddd;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.attach-btn:hover{background:#ebebeb}
.send-btn{height:36px;border-radius:8px;background:#1B2A4A;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0 18px;font-size:13px;font-weight:600;color:#C9A84C;white-space:nowrap;flex-shrink:0}
.send-btn:hover{background:#243a5e}
/* ── ANIMATIONS ── */
@keyframes status-pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes massi-blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(0.05)}}
@keyframes massi-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes massi-nod{0%,100%{transform:translateY(0)}30%,70%{transform:translateY(-4px)}50%{transform:translateY(-7px)}}
@keyframes massi-wave{0%,100%{transform:rotate(0deg)}20%{transform:rotate(-18deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-10deg)}80%{transform:rotate(6deg)}}
@keyframes massi-celebrate{0%,100%{transform:scale(1) rotate(0deg)}25%{transform:scale(1.08) rotate(-3deg)}50%{transform:scale(1.12) rotate(3deg)}75%{transform:scale(1.06) rotate(-2deg)}}
@keyframes massi-ring{0%{r:19;opacity:.6}100%{r:24;opacity:0}}
@keyframes massi-scan{0%,100%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
@keyframes massi-t1{0%,100%{opacity:.3;transform:scale(.7)}33%{opacity:1;transform:scale(1)}}
@keyframes massi-t2{0%,100%{opacity:.3;transform:scale(.7)}66%{opacity:1;transform:scale(1)}}
@keyframes massi-t3{0%,100%{opacity:.3;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}

</style>
</head>
<body>
<div id="topbar-mount" style="display:none"></div>
<div class="massi-page">

  <!-- ── CHAT COLUMN ── -->
  <div id="chatCol">

    <!-- Header -->
    <div class="chat-header">
      <div class="chat-header-av-wrap">
        <div class="av-ring av-ring1"></div>
        <div class="av-ring av-ring2"></div>
        <div id="massiAv" style="width:70px;height:91px;position:relative;z-index:1"></div>
      </div>
      <div class="chat-header-info">
        <div class="chat-header-title">iMASSI</div>
        <div class="chat-header-sub">AI Digital IMS Manager &middot; SAGCO</div>
        <div class="chat-header-live"><div class="ch-dot"></div>ISO 9001 &middot; 14001 &middot; 45001 &middot; 50001 &middot; 37001</div>
      </div>
      <div class="hdr-badge" id="hdrBadge">
        <div class="hdr-badge-dot offline" id="hdrDot"></div>
        <span class="hdr-badge-txt" id="hdrTxt">Offline</span>
      </div>
    </div>

    <!-- DB Status Strip -->
    <div class="db-strip offline" id="dbStrip">
      <div class="db-dot offline" id="dbDot"></div>
      <div class="db-label" id="dbLabel">Offline</div>
      <div class="db-progress" id="dbProgress" style="display:none"><div class="db-prog-fill" id="dbFill"></div></div>
      <div class="db-detail" id="dbDetail">Not connected</div>
      <div class="db-sync" id="dbSync"></div>
      <button class="ds-btn" onclick="downloadSummary()" title="Download session summary as Markdown">&#128221; Summary .md</button>
      <button class="ds-btn ds-drive" onclick="saveSummaryToDrive()" title="Save session summary to Google Drive">&#9729; Save to Drive</button>
      <button class="db-retry" id="dbRetry" onclick="retryConn()">&#8635; Retry</button>
    </div>

    <!-- Suggested chips -->
    <div class="suggested-chips" id="sugChips">
      <div class="sug-chip" onclick="massISend_with('Show all open CAPAs and Certification Audit blockers')">Open CAPAs</div>
      <div class="sug-chip" onclick="massISend_with('Am I ready for Pre-Certification Audit?')">Audit readiness</div>
      <div class="sug-chip" onclick="massISend_with('Show KPI dashboard status')">KPI status</div>
      <div class="sug-chip" onclick="massISend_with('Analyse F4 furnace energy trend')">F4 energy</div>
      <div class="sug-chip" onclick="massISend_with('Show register health across all 62 sheets')">Register health</div>
      <div class="sug-chip" onclick="massISend_with('What are my top 5 risks before the Certification Audit?')">Top risks</div>
      <div class="sug-chip" onclick="massISend_with('Show training completion status')">Training</div>
      <div class="sug-chip" onclick="massISend_with('Analyse incident trends and recommend CAPAs')">Incidents</div>
    </div>

    <!-- Messages -->
    <div class="chat-msgs" id="chatMsgs"></div>

    <!-- Input -->
    <div class="chat-input-area">
      <div style="flex:1">
        <div class="file-chip" id="fileChip" style="display:none">
          <span>&#128196;</span><span id="fileChipName"></span><span id="fileChipInfo" style="color:#185FA5;margin-left:3px"></span>
        </div>
        <textarea class="chat-textarea" id="chatInput" rows="2"
          placeholder="Ask iMASSI anything about your IMS..."
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();massISend()}"
          oninput="this.style.height='44px';this.style.height=this.scrollHeight+'px'"></textarea>
      </div>
      <button class="attach-btn" onclick="document.getElementById('xlFile').click()" title="Upload Excel">&#128206;</button>
      <button class="send-btn" onclick="massISend()">&#10148; Ask</button>
      <input type="file" id="xlFile" accept=".xlsx,.xls,.csv" style="display:none">
    </div>

  </div><!-- /chatCol -->

</div><!-- /massi-page -->

<script>

const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbzpMxyCTh6J-qH-rwPwux6J9bzwEwHYQPNxTI-IRrWX6vhXRlZYESaZdUeWiTqdNIPKoQ/exec';
const GROQ_URL            = 'https://api.groq.com/openai/v1/chat/completions';
const GROQ_MODEL          = 'llama-3.3-70b-versatile';
const GROQ_FALLBACK_MODEL = 'llama-3.1-8b-instant';   /* separate rate-limit bucket, very high free limits */
var   GROQ_KEY            = '';                        /* loaded from Apps Script getConfig at startup */

const CEREBRAS_URL        = 'https://api.cerebras.ai/v1/chat/completions';
const CEREBRAS_MODELS_URL = 'https://api.cerebras.ai/v1/models';
var   CEREBRAS_MODEL      = 'llama-3.3-70b';           /* auto-corrected at startup from the live model list */
var   CEREBRAS_KEY        = '';                        /* optional — loaded from getConfig if present */

/* Preferred Cerebras models, best first — the startup check picks the first one
   that actually exists on the account, so lineup changes never break iMASSI. */
var CEREBRAS_PREFERRED = ['llama-3.3-70b','llama3.3-70b','gpt-oss-120b','qwen-3-235b-a22b-instruct-2507','qwen-3-32b','llama-4-scout-17b-16e-instruct','llama3.1-8b'];

function discoverCerebrasModel(){
  if (!CEREBRAS_KEY) return;
  fetch(CEREBRAS_MODELS_URL, {headers:{'Authorization':'Bearer '+CEREBRAS_KEY}})
    .then(function(r){return r.json();})
    .then(function(d){
      var ids = (d && d.data ? d.data : []).map(function(m){return m.id;});
      if (!ids.length) { console.warn('[iMASSI] Cerebras model list empty — keeping default'); return; }
      for (var i = 0; i < CEREBRAS_PREFERRED.length; i++) {
        if (ids.indexOf(CEREBRAS_PREFERRED[i]) >= 0) { CEREBRAS_MODEL = CEREBRAS_PREFERRED[i]; break; }
      }
      if (ids.indexOf(CEREBRAS_MODEL) < 0) CEREBRAS_MODEL = ids[0];
      console.log('[iMASSI] Cerebras models available: ' + ids.join(', ') + ' — using: ' + CEREBRAS_MODEL);
    })
    .catch(function(e){console.warn('[iMASSI] Cerebras model discovery failed ('+e.message+') — keeping default');});
}

/* Provider chain — biggest quota first, weakest model last:
   1. Cerebras 70B (~1M tokens/day) — primary when its key is configured
   2. Groq 70B (same model, independent service) — second
   3. Groq 8B — emergency only (both 70B services down) */
function buildProviders(){
  var p = [];
  if (CEREBRAS_KEY) p.push({name:'Cerebras 70B', url:CEREBRAS_URL, key:CEREBRAS_KEY, model:CEREBRAS_MODEL});
  p.push({name:'Groq 70B', url:GROQ_URL, key:GROQ_KEY, model:GROQ_MODEL});
  p.push({name:'Groq 8B', url:GROQ_URL, key:GROQ_KEY, model:GROQ_FALLBACK_MODEL});
  return p;
}

/* Builds an OpenAI-format request body for Groq */
function toGroqBody(messages, maxTokens, temperature, model){
  return {model: model || GROQ_MODEL, messages: messages, max_tokens: maxTokens, temperature: temperature};
}
/* Extracts the reply text from a Groq response (or '' if absent) */
function groqText(d){
  try { return d.choices[0].message.content; } catch(e) { return ''; }
}

const SHEET_TIMEOUT  = 25000;   /* Apps Script can take 10-20s when cold or throttled */
const LLM_TIMEOUT    = 60000;
const INTENT_TIMEOUT = 10000;
const CACHE_TTL      = 5 * 60 * 1000;
const BATCH_SIZE     = 6;
const MAX_CTX_TOKENS = 3500;   /* register-context budget per message — keeps total request under every provider TPM limit incl. Groq 8B (6k) */
const AVG_CHARS_PER_TOKEN = 4;


/* ══════════════════════════════════════════════════════════════
   PROMPT MODULES — selected per query by intent classifier
══════════════════════════════════════════════════════════════ */

var PROMPT_BASE = [
  'You are iMASSI — the AI Digital IMS Manager at Saudi Arabian Glass Company Ltd. (SAGCO), Jeddah Industrial City Phase 4.',
  '',
  'SAGCO FACTS:',
  '- 5 HFO-fired furnaces F1-F5 | 884 direct employees | 152 contractors',
  '- Standards: ISO 9001:2015 | ISO 14001:2015 | ISO 45001:2018 | ISO 50001:2018 | ISO 37001:2016',
  '- TUV Austria Pre-Certification: last week of Sep 2026 | Certification: last week of Oct 2026',
  '- CEO: Rami Al Dobi | IMS Coordinator: Issam Ali Abdelkefi',
  '- Governance: Steering Team | WG1 Plant & Quality | WG2 SHEE Energy & ENV | WG3 People Ethics & Procurement',
  '- Facility SPC baseline: 561.24 kWh/ton | F4 SHC URGENT +119 kcal/kg above target',
  '- 4 open CAPAs (001-004) Certification Audit blockers | 7 of 9 L1 policies pending CEO signature',
  '- HIRA E-03 overdue since June 2026',
  '',
  'SINGLE SOURCE OF TRUTH: The live Google Sheets database.',
  'When LIVE DATA blocks are provided, use them exclusively and cite the register.',
  'NEVER invent or fabricate SAGCO data. If a register is empty, say so.',
  'FULL LISTINGS: when the user asks to see all records, the interface renders the complete register as a scrollable table automatically. When an [INTERFACE NOTE] says the table is displayed, never re-list the rows — give a short expert read of the data and one next step.',
  '',
  'WHO YOU ARE: an experienced SAGCO IMS colleague sitting in the office next to the user. You already work here, know the company, the registers, and the people. Never introduce yourself, never explain what you can do — just help.',
  'THE 80/20 RULE — your most important style rule: 80% of responses must be 2-4 short sentences. Only expand when the user explicitly asks for analysis, a report, an explanation, or documentation. Short, accurate, natural answers always beat long generic ones.',
  'TONE: human, warm, calm, direct, professional. Contractions are fine. Vary your openings ("Certainly.", "Let me check that.", "Here is what I found.", "Based on the latest IMS records..."). Never repeat the same opener twice in a row.',
  'BANNED — these sound like an AI assistant, never use them or anything similar: "I can help you with...", "I have access to...", "I can analyze/retrieve/assist...", "I have KPIs/CAPAs/incidents...", "What would you like to dive into first...", listing available modules or data types as a menu, long introductions, marketing language, capability advertising.',
  'DATA SOURCE: your answers come from the live IMS database. Mention it lightly and only when natural ("I am checking the latest records from the live IMS database"), never repeatedly, and avoid saying "Google Sheets" — the user should simply feel you are connected to the live IMS.',
  'CONVERSATION FLOW: understand the intent first. If you can answer, answer. If clarification is genuinely needed, ask exactly ONE short question woven into your reply — never a menu of options, never a questionnaire. Each reply moves the user closer to their IMS objective; when useful, end with one practical next step, the way a colleague would ("Want me to draft the update for the HSSE Manager?").',
  'MAINTAIN THE THREAD: refer back naturally to earlier turns ("the F4 issue we discussed"). Never restart or re-greet mid-conversation.',
  'THINK LIKE AN IMS MANAGER: practical, direct, supportive. If the data shows a problem, say it plainly. If a register is empty or a deadline will be missed, say so and propose the fix. Connect the dots across registers only when genuinely useful, in one short sentence.',
  'GOLDEN RULE: if a sentence sounds like marketing, remove it. If it sounds robotic, rewrite it. If it can be shorter, shorten it. If it does not help the user, delete it.',
  '',
  'FORMATTING: All structured data = rich HTML. Never markdown or ASCII tables.',
  'Tables: header #1B2A4A / #C9A84C | alternating rows | status badges.',
  'Status badges: OPEN/AT RISK/OVERDUE = #FCEBEB/#791F1F | CLOSED/ON TRACK = #EAF3DE/#27500A | IN PROGRESS = #FAEEDA/#633806.',
  '',
  'WRITE OPERATIONS: When you recommend creating or updating a record, output a structured preview block:',
  '[WRITE_PREVIEW]{"register":"<name>","tab":"<key>","action":"create|update","record":{...},"reason":"<why>","iso_clause":"<clause>"}[/WRITE_PREVIEW]',
  'Never write without this block and explicit user approval.',
  '',
  'ANALYTICS OUTPUT: When generating charts, output:',
  '[CHART]{"type":"<bar|line|pie|doughnut>","title":"<title>","labels":[...],"datasets":[{"label":"<name>","data":[...],"color":"<hex>"}]}[/CHART]',
  '[KPI_CARDS]{"title":"<title>","cards":[{"label":"<metric>","value":"<value>","target":"<target>","status":"<ON TRACK|AT RISK|...>","trend":"<▲0.4|▼2>"}]}[/KPI_CARDS]',
  '[TIMELINE]{"title":"<title>","items":[{"date":"<date>","label":"<event>","detail":"<short detail>","status":"<status>"}]}[/TIMELINE]',
  '[ACCORDION]{"title":"<title>","sections":[{"heading":"<heading>","content":"<text>"}]}[/ACCORDION]',
  'PRESENTATION RULES — pick the component that fits the data, always instead of plain lists: metric snapshots or status overviews → [KPI_CARDS]; deadlines, schedules, audit milestones → [TIMELINE]; trends and comparisons → [CHART]; long structured detail (procedures, clause explanations) → [ACCORDION]; record sets → an HTML <table>. Never ASCII/markdown tables, never terminal formatting. Keep any prose around a component within the 80/20 rule.',
  'PORTAL NAVIGATION: the clause_map register maps every ISO clause to the portal page(s) covering it, with URLs. When asked where a clause, requirement or topic is covered on the portal/website, answer from clause_map: name the page title and give the plain URL on its own (it renders as a clickable link automatically) — never invent URLs, only use those from clause_map. If several pages match, list the 2-3 most specific ones.',
  'When a note marked VERIFIED ANALYTICS appears in the message, those figures were computed exactly by the analytics engine — narrate them as given, never recompute, never invent numbers.',
  '',
  'HEALTH OUTPUT: When reporting register health, output:',
  '[HEALTH]{"registers":["<tab_key>","..."]}[/HEALTH]'
].join('\n');

var PROMPT_AUDITOR = [
  'ACTIVE ROLE: ISO Lead Auditor',
  '',
  'Apply clause-by-clause conformance analysis.',
  'For every finding identify: objective evidence that EXISTS and evidence that is MISSING.',

async function classifyIntent(userMessage, history) {
  if (!GROQ_KEY) return null;
  console.log('[iMASSI][INTENT] Classifying: "' + userMessage.substring(0,60) + '"');
  var t0 = performance.now();

  var recentHistory = history.slice(-4).map(function(m) {
    return m.role.toUpperCase() + ': ' + m.content.substring(0,200);
  }).join('\n');

  var messages = [
    {role: 'system', content: INTENT_CLASSIFIER_PROMPT},
    {role: 'user',   content: 'Recent context:\n' + recentHistory + '\n\nCurrent message: ' + userMessage}
  ];

  var controller = new AbortController();
  var tid = setTimeout(function() { controller.abort(); }, INTENT_TIMEOUT);

  try {
    var r = await fetch(GROQ_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json','Authorization':'Bearer ' + GROQ_KEY},
      body: JSON.stringify(toGroqBody(messages, 300, 0.1)),
      signal: controller.signal
    });
    clearTimeout(tid);
    var d = await r.json();
    var raw = groqText(d);
    raw = raw.replace(/```json|```/g,'').trim();
    var intent = JSON.parse(raw);
    console.log('[iMASSI][INTENT] ' + Math.round(performance.now()-t0) + 'ms | role=' + intent.role + ' intent=' + intent.intent + ' registers=' + (intent.primary_registers||[]).join(','));
    return intent;
  } catch(err) {
    clearTimeout(tid);
    console.warn('[iMASSI][INTENT] Failed (' + err.message + ') — using keyword fallback');
    return fallbackIntent(userMessage);
  }
}

function fallbackIntent(txt) {
  var lower = txt.toLowerCase();
  var intent = 'data_query';
  var role   = 'advisor';
  if (/audit|ready|conform|evidence|clause|nc |nonconform/i.test(txt)) { intent='audit_readiness'; role='auditor'; }
  else if (/trend|regression|forecast|statistic|spc|capability|correlat|analyz|analyse/i.test(txt)) { intent='analytics'; role='analyst'; }
  else if (/create|add|record|write|update|new capa|raise|log/i.test(txt)) { intent='write_operation'; role='writer'; }
  else if (/health|quality|complete|missing|duplicate|score/i.test(txt)) { intent='health_check'; role='data_manager'; }
  else if (/recommend|priorit|what should|advise|suggest/i.test(txt)) { intent='advisory'; role='advisor'; }

  var regs = [];
  Object.keys(TAB_KEYWORDS).forEach(function(tab) {
    TAB_KEYWORDS[tab].forEach(function(kw) { if(lower.indexOf(kw) >= 0 && regs.indexOf(tab) < 0) regs.push(tab); });
  });
  if (!regs.length && intent !== 'health_check') regs = ['kpi_dashboard','capa','objectives'];

  return { intent:intent, primary_registers:regs, linked_registers:[], iso_clauses:[], role:role, write_needed:false, analytics_needed:false, confidence:0.5 };
}


/* ══════════════════════════════════════════════════════════════
   SMART CONTEXT BUILDER — relationship-aware, token-budgeted
══════════════════════════════════════════════════════════════ */
function getLinkedRegisters(primaryTabs, maxLinked) {
  var linked = [];
  primaryTabs.forEach(function(tab) {
    var rel = RELATIONSHIPS[tab];
    if (!rel) return;
    rel.feeds_from.concat(rel.feeds_into).forEach(function(t) {
      if (primaryTabs.indexOf(t) < 0 && linked.indexOf(t) < 0) linked.push(t);
    });
  });
  return linked.slice(0, maxLinked || 4);
}

function buildSmartContext(intent) {
  var primary = intent.primary_registers || [];
  var linked  = intent.linked_registers  || [];

  /* Auto-add linked registers if not provided */
  if (!linked.length) linked = getLinkedRegisters(primary, 3);

  var allTabs    = primary.concat(linked.filter(function(t) { return primary.indexOf(t) < 0; }));
  var parts      = [];
  var tokenBudget = MAX_CTX_TOKENS;

  allTabs.forEach(function(tab) {
    if (tokenBudget <= 0) return;
    var entry = state.sheetCache[tab];
    if (!entry || !entry.data) { parts.push('[' + tab + ': not loaded]'); return; }
    var d = entry.data;
    var rows = d.rows || [];
    if (!rows.length) { parts.push('[' + tab + ': empty register]'); return; }

    var headers = d.headers || [];
    var age     = Math.round((Date.now() - entry.ts) / 1000);
    var isPrimary = primary.indexOf(tab) >= 0;

    /* Smart row selection */
    var selectedRows = rows;
    if (rows.length > 20 && !isPrimary) {
      /* For linked registers: only show relevant rows */
      var statusIdx = headers.findIndex(function(h) { return /status/i.test(h); });
      if (statusIdx >= 0) {
        var openRows = rows.filter(function(r) { return /open|at.risk|overdue|behind|pending/i.test(String(r[statusIdx]||'')); });
        selectedRows = openRows.length ? openRows.slice(0,10) : rows.slice(0,5);
      } else {
        selectedRows = rows.slice(0,8);
      }
    } else if (rows.length > 100 && isPrimary) {
      selectedRows = rows.slice(0,100);
    }

    var block = ['=== LIVE DATA: ' + tab.toUpperCase() + ' (' + rows.length + ' total, ' + selectedRows.length + ' shown, ' + age + 's ago) ==='];
    block.push('Columns: ' + headers.join(' | '));
    selectedRows.forEach(function(row) {
      var obj = {};
      headers.forEach(function(h,j) { if(h && row[j] !== undefined && row[j] !== '') obj[h] = row[j]; });
      if (Object.keys(obj).length) block.push(JSON.stringify(obj));
    });

    var blockText  = block.join('\n');
    var blockTokens = Math.ceil(blockText.length / AVG_CHARS_PER_TOKEN);
    /* FIT-NOT-DROP (Rev.21c): if the block exceeds the remaining budget,
       truncate its rows to fit rather than silently dropping the whole
       register — a partial register beats an invisible one. */
    while (blockTokens >= tokenBudget && selectedRows.length > 5) {
      selectedRows = selectedRows.slice(0, Math.max(5, Math.floor(selectedRows.length * 0.7)));
      block = ['=== LIVE DATA: ' + tab.toUpperCase() + ' (' + rows.length + ' total, ' + selectedRows.length + ' shown, ' + age + 's ago) ==='];
      block.push('Columns: ' + headers.join(' | '));
      selectedRows.forEach(function(row) {
        var obj = {};
        headers.forEach(function(h,j) { if(h && row[j] !== undefined && row[j] !== '') obj[h] = row[j]; });
        if (Object.keys(obj).length) block.push(JSON.stringify(obj));
      });
      if (selectedRows.length < rows.length) block.push('[...' + (rows.length - selectedRows.length) + ' more rows in this register — ask to filter or list in full]');
      blockText  = block.join('\n');
      blockTokens = Math.ceil(blockText.length / AVG_CHARS_PER_TOKEN);
    }
    if (blockTokens < tokenBudget || parts.length === 0) {
      parts.push(blockText);
      tokenBudget -= blockTokens;
    }
  });

  /* Include health summary for all registers */
  var healthSummary = buildHealthSummary();
  if (healthSummary) parts.push('\n=== REGISTER HEALTH SUMMARY ===\n' + healthSummary);

  return parts.join('\n\n');
}

function buildHealthSummary() {
  var issues = [];
  Object.keys(state.health).forEach(function(tab) {
    var h = state.health[tab];
    if (h && h.grade && (h.grade === 'D' || h.grade === 'F' || h.overdue > 0)) {
      issues.push(tab + ': grade=' + h.grade + ' completeness=' + h.completeness + '% overdue=' + h.overdue);
    }
  });
  return issues.slice(0,10).join('\n');
}

function escHtml(v) {
  return String(v === undefined || v === null ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function detectListAll(txt) {
  var t = txt.toLowerCase();
  /* explicit "all/full/complete..." near a data noun */
  if (/\b(all|full|complete|entire|every|whole|everything)\b/.test(t) &&
      /\b(record|records|row|rows|item|items|entr|list|data|register|table)/.test(t)) return true;
  /* "table of X" / "list of X" / "give me the table" — full listing unless the user limits it */
  if (/\b(table|listing|list)\b/.test(t) &&
      !/\b(top|first|last|latest|recent|newest|oldest|open|closed|overdue|pending|filter|only|summary|summar|chart|graph|trend|count|how many|\d+)\b/.test(t)) return true;
  return false;
}

/* Resolve which register the user means: classifier result first, then keyword scan */
function resolveListTab(txt, intent) {
  var tab = (intent && intent.primary_registers || [])[0];
  if (tab && state.sheetCache[tab]) return tab;
  var t = txt.toLowerCase();
  var keys = Object.keys(state.sheetCache);
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    if (t.indexOf(k) >= 0 || t.indexOf(k.replace(/_/g,' ')) >= 0) return k;
  }
  /* common aliases */
  var aliases = {clause:'clause_map', clauses:'clause_map', capa:'capa', capas:'capa', incident:'incidents', hira:'hira', risk:'risks', risks:'risks',
                 kpi:'kpi_dashboard', kpis:'kpi_dashboard', objective:'objectives', policy:'policies', policies:'policies',
                 training:'training', calibration:'calibration', audit:'audit_programme', ptw:'ptw_register',
                 nonconformity:'nonconforming', ncr:'nonconforming', supplier:'supplier_esg', coi:'coi', tpdd:'tpdd'};
  var words = t.split(/[^a-z_]+/);
  for (var j = 0; j < words.length; j++) {
    if (aliases[words[j]] && state.sheetCache[aliases[words[j]]]) return aliases[words[j]];
  }
  return null;
}

function statusBadge(val) {
  var v = String(val||'');
  if (!v) return '';
  var l = v.toLowerCase();
  var style = 'background:#f0f0f0;color:#555';
  if (/open|at.risk|overdue|behind|fail|urgent|expired|major/.test(l)) style = 'background:#FCEBEB;color:#791F1F';
  else if (/closed|on.track|complete|pass|ok|valid|conform|done/.test(l)) style = 'background:#EAF3DE;color:#27500A';
  else if (/progress|pending|review|draft|minor/.test(l)) style = 'background:#FAEEDA;color:#633806';
  return '<span style="display:inline-block;font-size:10px;font-weight:700;border-radius:3px;padding:1px 6px;white-space:nowrap;' + style + '">' + escHtml(v) + '</span>';
}

function buildRowsHtml(tab, start, end) {
  var entry = state.sheetCache[tab];
  if (!entry || !entry.data) return '';
  var headers = entry.data.headers || [];
  var rows = entry.data.rows || [];
  var statusIdx = headers.findIndex(function(h){ return /^status$/i.test(h); });
  var html = '';
  for (var i = start; i < Math.min(end, rows.length); i++) {
    var bg = i % 2 === 0 ? '#fff' : '#f8f9fb';
    html += '<tr>';
    html += '<td style="padding:6px 8px;border-bottom:0.5px solid #eee;background:' + bg + ';color:#aaa;font-size:10px">' + (i+1) + '</td>';
    headers.forEach(function(h, j) {
      var cell = (j === statusIdx) ? statusBadge(rows[i][j]) : escHtml(rows[i][j]);
      html += '<td style="padding:6px 8px;border-bottom:0.5px solid #eee;background:' + bg + ';white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis">' + cell + '</td>';
    });
    html += '</tr>';
  }
  return html;
}

function renderFullRegisterTable(tab) {
  var entry = state.sheetCache[tab];
  if (!entry || !entry.data || !(entry.data.rows||[]).length) {
    appendAI('The <strong>' + tab + '</strong> register is empty or not loaded yet.', null, false);
    return false;
  }
  var headers = entry.data.headers || [];
  var rows = entry.data.rows;
  var tid = 'listtbl-' + Date.now();
  listTableState[tid] = {tab: tab, offset: Math.min(LIST_PAGE_SIZE, rows.length)};
  var h = state.health[tab];
  var age = Math.round((Date.now() - entry.ts) / 60000);

  var card = '<div style="border:0.5px solid #e0e0e0;border-radius:8px;margin-top:5px;overflow:hidden;background:white">';
  card += '<div style="background:#1B2A4A;padding:8px 12px;display:flex;align-items:center;gap:8px">';
  card += '<span style="color:#C9A84C;font-size:12px;font-weight:700">' + tab.toUpperCase() + ' — complete register</span>';
  card += '<span style="color:rgba(255,255,255,.6);font-size:10.5px;margin-left:auto">' + rows.length + ' records · synced ' + (age < 1 ? 'just now' : age + ' min ago') + (h ? ' · health ' + h.grade : '') + '</span></div>';
  card += '<div style="max-height:420px;overflow:auto">';
  card += '<table style="width:100%;border-collapse:collapse;font-size:11px">';
  card += '<thead><tr><th style="position:sticky;top:0;background:#f4f5f7;padding:7px 8px;text-align:left;font-size:10px;color:#888;border-bottom:1px solid #ddd">#</th>';
  headers.forEach(function(hd) {
    card += '<th style="position:sticky;top:0;background:#f4f5f7;padding:7px 8px;text-align:left;font-weight:700;font-size:10.5px;color:#1B2A4A;border-bottom:1px solid #ddd;white-space:nowrap">' + escHtml(hd) + '</th>';
  });
  card += '</tr></thead><tbody id="' + tid + '">';
  card += buildRowsHtml(tab, 0, LIST_PAGE_SIZE);
  card += '</tbody></table></div>';
  if (rows.length > LIST_PAGE_SIZE) {
    card += '<div style="padding:8px;text-align:center;background:#fafafa;border-top:0.5px solid #eee">';
    card += '<button id="' + tid + '-more" onclick="loadMoreListRows(\'' + tid + '\')" style="background:#1B2A4A;color:#C9A84C;border:none;border-radius:5px;padding:6px 16px;font-size:11px;font-weight:600;cursor:pointer">Load ' + Math.min(LIST_PAGE_SIZE, rows.length - LIST_PAGE_SIZE) + ' more (' + (rows.length - LIST_PAGE_SIZE) + ' remaining)</button></div>';
  }
  card += '</div>';
  appendAI(null, card, false);
  slLogArtifact('Full register table — ' + tab + ' (' + rows.length + ' records)');
  return true;
}

function loadMoreListRows(tid) {
  var ts = listTableState[tid];
  if (!ts) return;
  var entry = state.sheetCache[ts.tab];
  if (!entry || !entry.data) return;
  var rows = entry.data.rows || [];
  var tbody = document.getElementById(tid);
  var btn = document.getElementById(tid + '-more');
  if (!tbody) return;
  var next = Math.min(ts.offset + LIST_PAGE_SIZE, rows.length);
  tbody.insertAdjacentHTML('beforeend', buildRowsHtml(ts.tab, ts.offset, next));
  ts.offset = next;
  if (btn) {
    var remaining = rows.length - next;
    if (remaining <= 0) btn.parentElement.remove();
    else btn.textContent = 'Load ' + Math.min(LIST_PAGE_SIZE, remaining) + ' more (' + remaining + ' remaining)';
  }
}


/* ══════════════════════════════════════════════════════════════
   PHASE 4 · ENTERPRISE HARDENING
   Identity (audit stamps on every write) · optional write-access
   code (enforced server-side if configured) · cache persistence
   with TTL so page reloads stop re-fetching all 75 registers.
══════════════════════════════════════════════════════════════ */
var CACHE_TTL_MS = 10 * 60 * 1000;   /* reuse cached registers for 10 minutes */

function initIdentity() {
  /* Identity overlay removed per user request — writes are stamped with the
     stored name if one exists, otherwise the default IMS Coordinator identity. */
  try {
    state.userName   = localStorage.getItem('imassi_user')  || 'Issam Ali Abdelkefi';
    state.writeToken = localStorage.getItem('imassi_token') || '';
  } catch(e) { state.userName='Issam Ali Abdelkefi'; state.writeToken=''; }
  try { sessionSummary.session_information.user = state.userName + ' — SAGCO IMS'; } catch(e){}
}

function saveIdentity() {
  try {
    var n = (document.getElementById('idName')||{}).value || '';
    var t = (document.getElementById('idToken')||{}).value || '';
    if (!n.trim()) { var el=document.getElementById('idName'); if(el){el.style.border='1px solid #E24B4A';el.placeholder='Name is required for the audit trail';} return; }
    state.userName = n.trim(); state.writeToken = t.trim();
    try { localStorage.setItem('imassi_user', state.userName); localStorage.setItem('imassi_token', state.writeToken); } catch(e){ console.warn('[iMASSI] Storage blocked — identity kept for this session only'); }
    try { sessionSummary.session_information.user = state.userName + ' — SAGCO IMS'; } catch(e){}
  } catch(err) { console.error('[iMASSI] saveIdentity:', err.message); }
  var ov = document.getElementById('idOverlay'); if (ov) ov.remove();
  try { appendAI('Welcome, <strong>' + escHtml(state.userName || 'colleague') + '</strong> — your name is now stamped on every record change. What are we working on?', null, false); } catch(e){}
}

function persistCache() {
  try {
    var payload = JSON.stringify({ts:Date.now(), sheetCache:state.sheetCache, health:state.health});
    if (payload.length < 3800000) localStorage.setItem('imassi_cache', payload);
  } catch(e) { console.warn('[iMASSI] Cache persist skipped:', e.message); }
}
function hydrateCache() {
  try {
    var raw = localStorage.getItem('imassi_cache'); if (!raw) return false;
    var c = JSON.parse(raw);
    if (!c.ts || Date.now() - c.ts > CACHE_TTL_MS) return false;
    state.sheetCache = c.sheetCache || {}; state.health = c.health || {};
    var n = Object.keys(state.sheetCache).length;
    if (n < 5) return false;
    state.cacheReady = true; state.cacheTime = c.ts;
    var age = Math.round((Date.now()-c.ts)/60000);
    setStatus('ready', n + ' registers — from local cache (' + (age<1?'moments':age+' min') + ' old)');
    updateHealthPanel();
    console.log('[iMASSI] Cache hydrated from localStorage: ' + n + ' tabs, age ' + age + ' min');
    return true;
  } catch(e) { return false; }
}


/* ══════════════════════════════════════════════════════════════
   PHASE 3 · EXCEL INTELLIGENCE
   Upload → structure detection → register inference (confidence)
   → column mapping → validation → duplicate check vs LIVE cache
   → preview → approval → batch sync with audit trail.
══════════════════════════════════════════════════════════════ */
function normHeader(h){ return String(h).toLowerCase().replace(/[^a-z0-9]/g,''); }

function inferRegister(upHeaders) {
  var results = [];
  Object.keys(state.sheetCache).forEach(function(tab){
    var e = state.sheetCache[tab]; if (!e||!e.data||!e.data.headers) return;
    var regNorm = e.data.headers.map(normHeader);
    var matched = 0;
    upHeaders.forEach(function(h){ var nh = normHeader(h); if (nh && regNorm.indexOf(nh) >= 0) matched++; });
    if (matched >= 2) results.push({tab:tab, matched:matched,
      confidence: Math.round(matched / Math.max(regNorm.length, upHeaders.length) * 100),
      coverage:   Math.round(matched / upHeaders.length * 100)});
  });
  results.sort(function(a,b){ return b.matched - a.matched || b.confidence - a.confidence; });
  return results;
}

function mapColumns(upHeaders, regHeaders) {
  var regNorm = regHeaders.map(normHeader);
  return upHeaders.map(function(h, i){
    var idx = regNorm.indexOf(normHeader(h));
    return {uploadCol:String(h), registerCol: idx >= 0 ? regHeaders[idx] : null, index:i, regIndex:idx};
  });
}

function validateImport(parsed, tab) {
  var e = state.sheetCache[tab];
  var regHeaders = e.data.headers;
  var mapping = mapColumns(parsed.headers, regHeaders);
  var mapped  = mapping.filter(function(m){ return m.registerCol; });
  var idRegIdx = regHeaders.findIndex(function(h){ return /^id$|record.?id|^ref/i.test(String(h).trim()); });
  var idUpIdx = -1;
  mapping.forEach(function(m){ if (m.regIndex === idRegIdx && idRegIdx >= 0) idUpIdx = m.index; });
  var existingIds = {};
  if (idRegIdx >= 0) e.data.rows.forEach(function(r){ var v = String(r[idRegIdx]||'').trim(); if (v) existingIds[v] = 1; });
  var issues = [], duplicates = [], newRows = [];
  parsed.rows.forEach(function(row, ri){
    var allEmpty = mapped.every(function(m){ return !String(row[m.index]||'').trim(); });
    if (allEmpty) return;
    var id = idUpIdx >= 0 ? String(row[idUpIdx]||'').trim() : '';
    if (id && existingIds[id]) { duplicates.push({row: ri+2, id: id}); return; }
    if (idUpIdx >= 0 && !id) issues.push('Row ' + (ri+2) + ': missing ID — will be imported without one');
    newRows.push(row);
  });
  return {mapping:mapping, mappedCount:mapped.length, unmapped:mapping.filter(function(m){return !m.registerCol;}).map(function(m){return m.uploadCol;}),
          duplicates:duplicates, issues:issues, newRows:newRows, regHeaders:regHeaders};
}

function renderImportPreview(tab, parsed, val, confidence) {
  var mapped = val.mapping.filter(function(m){ return m.registerCol; });
  var html = CARD_SHELL_OPEN + componentHeader('Import preview — ' + tab + ' register', (confidence?confidence+'% match · ':'') + val.newRows.length + ' new records');
  html += '<div style="padding:10px 12px;font-size:11.5px">';
  html += '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px">' +
    '<span style="color:#27500A;font-weight:700">&#10003; ' + val.newRows.length + ' new record' + (val.newRows.length===1?'':'s') + '</span>' +
    (val.duplicates.length ? '<span style="color:#633806;font-weight:700">&#8856; ' + val.duplicates.length + ' duplicate' + (val.duplicates.length===1?'':'s') + ' skipped (' + val.duplicates.slice(0,4).map(function(d){return d.id;}).join(', ') + (val.duplicates.length>4?'…':'') + ')</span>' : '') +
    (val.unmapped.length ? '<span style="color:#791F1F">&#9888; unmapped columns: ' + val.unmapped.map(escHtml).join(', ') + '</span>' : '') +
    '</div>';
  if (val.issues.length) html += '<div style="color:#633806;margin-bottom:6px">' + val.issues.slice(0,5).map(escHtml).join('<br>') + '</div>';
  html += '<div style="color:#666;margin-bottom:8px">Mapping: ' + mapped.map(function(m){ return escHtml(m.uploadCol) + ' &rarr; <strong>' + escHtml(m.registerCol) + '</strong>'; }).join(' · ') + '</div>';
  html += '<div style="max-height:220px;overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:11px"><thead><tr>';
  mapped.forEach(function(m){ html += '<th style="background:#f4f5f7;text-align:left;padding:4px 7px;position:sticky;top:0">' + escHtml(m.registerCol) + '</th>'; });
  html += '</tr></thead><tbody>';
  val.newRows.slice(0,8).forEach(function(row){
    html += '<tr>';
    mapped.forEach(function(m){ html += '<td style="padding:4px 7px;border-bottom:0.5px solid #eee">' + escHtml(String(row[m.index]||'')) + '</td>'; });
    html += '</tr>';
  });
  html += '</tbody></table>' + (val.newRows.length > 8 ? '<div style="color:#999;padding:4px 7px">…and ' + (val.newRows.length-8) + ' more</div>' : '') + '</div>';
  html += '<div style="margin-top:10px"><input id="importReason" placeholder="Reason for import (required — ISO audit trail)" style="width:100%;box-sizing:border-box;border:0.5px solid #ccc;border-radius:5px;padding:6px 9px;font-size:11.5px"></div>';
  html += '<div style="margin-top:8px;display:flex;gap:8px">' +
    '<button onclick="approveImport()" style="background:#27500A;color:white;border:none;border-radius:5px;padding:6px 16px;font-size:11.5px;font-weight:700;cursor:pointer">Approve import (' + val.newRows.length + ')</button>' +
    '<button onclick="dismissImport()" style="background:white;color:#791F1F;border:0.5px solid #791F1F;border-radius:5px;padding:6px 16px;font-size:11.5px;cursor:pointer">Cancel</button>' +
    '<span id="importProg" style="font-size:11px;color:#666;align-self:center"></span></div>';
  html += '</div></div>';
  return html;
}

function dismissImport(){ state.pendingImport = null; appendAI('Import cancelled. Nothing was written to the live IMS database.', null, false); }

function approveImport() {
  var pi = state.pendingImport; if (!pi) return;
  var reasonEl = document.getElementById('importReason');
  if (!reasonEl || !reasonEl.value.trim()) { if(reasonEl){reasonEl.style.border='1px solid #E24B4A'; reasonEl.placeholder='Reason is required for ISO audit trail';} return; }
  var reason = reasonEl.value.trim();
  var mapped = pi.val.mapping.filter(function(m){ return m.registerCol; });
  var prog = document.getElementById('importProg');
  var rows = pi.val.newRows;
  var done = 0, failed = 0;
  setAvatar('thinking');
  function writeNext(i) {
    if (i >= rows.length) {
      setAvatar(failed ? 'idle' : 'success'); setTimeout(function(){setAvatar('idle');}, 3000);
      loadTab(pi.tab);
      slLogWrite(pi.tab + ' register', pi.tab, 'BULK IMPORT', done + ' records', reason);
      slLogArtifact('Excel import — ' + pi.tab + ' (' + done + ' records' + (failed?', '+failed+' failed':'') + ')');
      appendAI('Import complete: <strong>' + done + ' record' + (done===1?'':'s') + ' written</strong> to the ' + pi.tab + ' register' +
        (failed ? ', ' + failed + ' failed (see console)' : '') +
        (pi.val.duplicates.length ? ' ' + pi.val.duplicates.length + ' duplicates were skipped.' : ''), null, false);
      state.pendingImport = null;
      return;
    }
    var record = {};
    mapped.forEach(function(m){ record[m.registerCol] = String(rows[i][m.index]||''); });
    var url = SHEETS_URL + '?action=writeRow&tab=' + pi.tab +
      '&data=' + encodeURIComponent(JSON.stringify(record)) +
      '&reason=' + encodeURIComponent(reason + ' [bulk import ' + (i+1) + '/' + rows.length + ']') +
      '&user=' + encodeURIComponent(state.userName || 'IMS Coordinator') + (state.writeToken ? '&token=' + encodeURIComponent(state.writeToken) : '') + '&session=' + state.sessionId;
    fetchWithTimeout(url, 20000)
      .then(function(r){ if (r && (r.success || r.ok)) done++; else failed++; })
      .catch(function(){ failed++; })
      .then(function(){
        if (prog) prog.textContent = 'Writing ' + (done+failed) + ' / ' + rows.length + '…';
        setTimeout(function(){ writeNext(i+1); }, 300);
      });
  }
  if (prog) prog.textContent = 'Writing 0 / ' + rows.length + '…';
  writeNext(0);
}


/* ══════════════════════════════════════════════════════════════
   PHASE 2 · DISCUSSION SUMMARY — incremental, zero-token.
   A structured session object is updated deterministically as the
   session evolves (no AI calls). "Generate" = pure extraction to
   Markdown. Chat stays HTML; only this artifact is Markdown.
══════════════════════════════════════════════════════════════ */
var sessionSummary = {
  session_information: { date: new Date().toISOString().slice(0,10),
    startTime: new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),
    startMs: Date.now(), user: 'SAGCO IMS user', model: '' },
  discussion_sections: [],   /* {time, question, responseGist, registers} */
  key_findings: [],
  decisions: [],
  recommendations: [],
  ims_records: [],           /* {record, module, action, reason, time} */
  analytics: [],             /* {type, source, results} */
  generated_artifacts: [],   /* strings */
  pending_actions: [],
  next_steps: []
};

function slPush(arr, item, max) {           /* dedup + cap */
  var key = JSON.stringify(item);
  for (var i=0;i<arr.length;i++) if (JSON.stringify(arr[i])===key) return;
  arr.push(item); if (arr.length > (max||60)) arr.shift();
}

function slLogTurn(question, responseText, intent) {
  var gist = String(responseText||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,220);
  slPush(sessionSummary.discussion_sections, {
    time: new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),
    question: String(question||'').slice(0,200),
    responseGist: gist,
    registers: (intent && intent.primary_registers || []).slice(0,3).join(', ')
  }, 80);
  /* light deterministic extraction */
  var plain = String(responseText||'').replace(/<[^>]+>/g,' ');
  plain.split(/[.!?]\s+/).forEach(function(sen){
    var s = sen.trim(); if (s.length < 15 || s.length > 240) return;
    if (/\b(overdue|remains open|still open|behind schedule|pending (approval|signature))\b/i.test(s)) slPush(sessionSummary.pending_actions, s, 25);
    if (/\b(I (would|recommend)|recommendation|should (be|start|close|prioriti)|worth (a|doing)|suggest)\b/i.test(s)) slPush(sessionSummary.recommendations, s, 25);
    if (/\b(drives|exceed|above target|below target|trending|deviation|at risk|non.?conform|gap of)\b/i.test(s)) slPush(sessionSummary.key_findings, s, 30);
  });
}

function slLogAnalytics(type, source, results) {
  slPush(sessionSummary.analytics, {type:type, source:source, results:String(results).slice(0,300)}, 20);
  slPush(sessionSummary.generated_artifacts, 'Chart — ' + type + ' (' + source + ')', 40);
}
function slLogArtifact(desc) { slPush(sessionSummary.generated_artifacts, desc, 40); }
function slLogWrite(register, tab, action, recordId, reason) {
  slPush(sessionSummary.ims_records, {record: recordId||'(new)', module: register + ' (' + tab + ')', action: action,
    reason: String(reason||'').slice(0,160), time: new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}, 30);
  slPush(sessionSummary.decisions, 'Approved ' + action + ' to ' + register + (recordId?(' — '+recordId):''), 25);
}

function mdEscape(s){ return String(s||'').replace(/\|/g,'\\|').replace(/\r?\n/g,' '); }

function buildSummaryMarkdown() {
  var S = sessionSummary, si = S.session_information;
  var end = new Date();
  var durMin = Math.max(1, Math.round((Date.now()-si.startMs)/60000));
  var dur = durMin >= 60 ? Math.floor(durMin/60)+'h '+(durMin%60)+'m' : durMin+' min';
  var model = (typeof CEREBRAS_KEY!=='undefined' && CEREBRAS_KEY) ? (CEREBRAS_MODEL+' (Cerebras) / '+GROQ_MODEL+' (Groq fallback)') : GROQ_MODEL+' (Groq)';
  var topics = {}; S.discussion_sections.forEach(function(t){ (t.registers||'').split(', ').forEach(function(r){ if(r) topics[r]=1; }); });
  var topicList = Object.keys(topics).join(', ') || 'general IMS';
  var L = [];
  L.push('# iMASSI Discussion Summary');
  L.push('');
  L.push('## Session Information');
  L.push('');
  L.push('| Item | Details |');
  L.push('|---|---|');
  L.push('| Date | ' + si.date + ' |');
  L.push('| Start Time | ' + si.startTime + ' |');
  L.push('| End Time | ' + end.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) + ' |');
  L.push('| Duration | ' + dur + ' |');
  L.push('| User | ' + si.user + ' |');
  L.push('| AI Model | ' + model + ' |');
  L.push('');
  L.push('---');
  L.push('');
  L.push('## Executive Summary');
  L.push('');
  L.push('Working session covering ' + S.discussion_sections.length + ' exchange' + (S.discussion_sections.length===1?'':'s') +
    ' on ' + topicList + '.' +
    (S.analytics.length ? ' ' + S.analytics.length + ' analytical stud' + (S.analytics.length===1?'y':'ies') + ' performed.' : '') +
    (S.ims_records.length ? ' ' + S.ims_records.length + ' IMS record' + (S.ims_records.length===1?'':'s') + ' created/updated with documented approval.' : '') +
    (S.key_findings.length ? ' ' + S.key_findings.length + ' key finding' + (S.key_findings.length===1?'':'s') + ' identified.' : '') +
    (S.pending_actions.length ? ' ' + S.pending_actions.length + ' item' + (S.pending_actions.length===1?'':'s') + ' remain pending follow-up.' : ''));
  L.push('');
  L.push('---');
  L.push('');
  L.push('## Discussion Summary');
  L.push('');
  if (S.discussion_sections.length) S.discussion_sections.forEach(function(t,i){
    L.push('**' + (i+1) + '. [' + t.time + '] ' + mdEscape(t.question) + '**' + (t.registers?('  \n_Registers: ' + t.registers + '_'):''));
    if (t.responseGist) L.push('  \n' + mdEscape(t.responseGist) + (t.responseGist.length>=220?'…':''));
    L.push('');
  }); else L.push('_No exchanges recorded._\n');
  L.push('---');
  L.push('');
  function section(title, arr, formatter, empty) {
    L.push('## ' + title); L.push('');
    if (arr.length) arr.forEach(function(x){ L.push('- ' + formatter(x)); });
    else L.push('_' + (empty||'None recorded in this session.') + '_');

  }
  section('Key Findings', S.key_findings, mdEscape);
  section('Decisions Made', S.decisions, mdEscape);
  section('Recommendations', S.recommendations, mdEscape);
  L.push('## IMS Records Created or Updated'); L.push('');
  if (S.ims_records.length) {

  } else L.push('_No records were created or updated in this session._');
  L.push(''); L.push('---'); L.push('');
  L.push('## Analytics Performed'); L.push('');
  if (S.analytics.length) {
    L.push('| Analysis Type | Data Source | Main Results |');
    L.push('|---|---|---|');
    S.analytics.forEach(function(a){ L.push('| ' + mdEscape(a.type) + ' | ' + mdEscape(a.source) + ' | ' + mdEscape(a.results) + ' |'); });
  } else L.push('_No analytics were performed in this session._');
  L.push(''); L.push('---'); L.push('');
  section('Generated Artifacts', S.generated_artifacts, mdEscape);
  section('Pending Actions', S.pending_actions, mdEscape, 'No pending items were flagged in this session.');
  section('Next Steps', S.next_steps.length ? S.next_steps : S.pending_actions.slice(0,5), mdEscape, 'To be defined at the next session.');
  L.push('## Data Source'); L.push('');
  L.push('Live Google Sheets IMS Database'); L.push('');
  L.push('---'); L.push('');
  L.push('## Generation Information'); L.push('');
  L.push('Generated by: iMASSI — AI Digital IMS Manager, SAGCO  ');
  L.push('Generation Timestamp: ' + si.date + ' ' + end.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}));
  L.push('');
  return L.join('\n');
}

/* ══════════════════════════════════════════════════════════════
   PHASE 1 · ANALYTICS ENGINE — deterministic math, never the LLM.
   Computes on cached register data; the LLM only narrates results.
══════════════════════════════════════════════════════════════ */
var Analytics = {
  regression: function(ys) {                    /* x = 0..n-1 */
    var n = ys.length; if (n < 2) return null;
    var sx=0, sy=0, sxy=0, sxx=0;
    for (var i=0;i<n;i++){sx+=i;sy+=ys[i];sxy+=i*ys[i];sxx+=i*i;}
    var slope=(n*sxy-sx*sy)/(n*sxx-sx*sx), intercept=(sy-slope*sx)/n;
    var mean=sy/n, ssTot=0, ssRes=0;
    for (i=0;i<n;i++){var p=slope*i+intercept; ssTot+=(ys[i]-mean)*(ys[i]-mean); ssRes+=(ys[i]-p)*(ys[i]-p);}
    var r2 = ssTot===0 ? 1 : 1-ssRes/ssTot;
    return {slope:+slope.toFixed(4), intercept:+intercept.toFixed(4), r2:+r2.toFixed(3),
            predict:function(x){return +(slope*x+intercept).toFixed(2);}};
  },
  forecast: function(ys, periods) {
    var reg = Analytics.regression(ys); if (!reg) return null;
    var out=[]; for (var k=0;k<periods;k++) out.push(reg.predict(ys.length+k));
    return {values:out, reg:reg};
  },
  stats: function(ys) {
    if (!ys.length) return null;
    var min=Math.min.apply(null,ys), max=Math.max.apply(null,ys);
    var mean=ys.reduce(function(a,b){return a+b;},0)/ys.length;
    var v=ys.reduce(function(a,b){return a+(b-mean)*(b-mean);},0)/ys.length;
    return {n:ys.length, min:min, max:max, mean:+mean.toFixed(2), stdev:+Math.sqrt(v).toFixed(2),
            first:ys[0], last:ys[ys.length-1], delta:+(ys[ys.length-1]-ys[0]).toFixed(2)};
  },
  pareto: function(counts) {                    /* counts: {label:n} → sorted with cumulative % */
    var entries = Object.keys(counts).map(function(k){return {label:k, count:counts[k]};})
      .sort(function(a,b){return b.count-a.count;});
    var total = entries.reduce(function(a,e){return a+e.count;},0) || 1;
    var cum = 0;
    entries.forEach(function(e){cum+=e.count; e.pct=+(e.count/total*100).toFixed(1); e.cumPct=+(cum/total*100).toFixed(1);});
    return {items:entries, total:total};
  }
};

/* Extract a numeric time series from a register: month columns if present, else the
   first column where most values are numeric. Returns {labels, values, seriesName} or null. */
var MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function extractSeries(tab, rowFilter) {
  var e = state.sheetCache[tab]; if (!e || !e.data) return null;
  var headers = e.data.headers||[], rows = e.data.rows||[];
  if (rowFilter) rows = rows.filter(rowFilter);
  if (!rows.length) return null;
  var mCols = []; headers.forEach(function(h,i){ if (MONTH_NAMES.indexOf(String(h).trim())>=0) mCols.push(i); });
  if (mCols.length >= 3) {           /* month-structured register: first row with enough data */
    for (var r=0;r<rows.length;r++) {
      var vals=[], labs=[];
      mCols.forEach(function(ci){ var v=parseFloat(String(rows[r][ci]).replace(/[^0-9.\-]/g,'')); if(!isNaN(v)){vals.push(v);labs.push(headers[ci]);} });
      if (vals.length >= 3) return {labels:labs, values:vals, seriesName:String(rows[r][0]||tab)};
    }
  }
  /* fallback: first mostly-numeric column, rows as sequence */
  for (var c=1;c<headers.length;c++) {
    var vals2=[], ok=0;
    rows.forEach(function(row){ var v=parseFloat(String(row[c]).replace(/[^0-9.\-]/g,'')); if(!isNaN(v)){vals2.push(v);ok++;} });
    if (ok >= Math.max(3, rows.length*0.6)) {
      return {labels: vals2.map(function(_,i){return '#'+(i+1);}), values: vals2, seriesName: headers[c]};
    }
  }
  return null;
}

/* Categorical counts for Pareto: pick the named column or the best repeating text column */
function extractCounts(tab, preferRe) {
  var e = state.sheetCache[tab]; if (!e || !e.data) return null;
  var headers = e.data.headers||[], rows = e.data.rows||[];
  var col = -1;
  if (preferRe) col = headers.findIndex(function(h){return preferRe.test(h);});
  if (col < 0) {          /* best column: text values that repeat */
    var best=-1, bestScore=0;
    for (var c=1;c<headers.length;c++) {
      var seen={}, reps=0, nonEmpty=0;
      rows.forEach(function(row){ var v=String(row[c]||'').trim(); if(!v)return; nonEmpty++; if(seen[v])reps++; seen[v]=1; });
      var uniq=Object.keys(seen).length;
      if (nonEmpty>=3 && uniq>1 && uniq<=Math.max(2,nonEmpty*0.7) && reps>bestScore){bestScore=reps;best=c;}
    }
    col = best;
  }
  if (col < 0) return null;
  var counts={};
  rows.forEach(function(row){ var v=String(row[col]||'').trim(); if(v) counts[v]=(counts[v]||0)+1; });
  return {counts:counts, column:headers[col]};
}

/* Router detection + orchestration: returns a note for the LLM, or '' */
function detectAnalytics(txt) {
  var t = txt.toLowerCase();
  if (/pareto/.test(t)) return 'pareto';
  if (/forecast|predict|projection|extrapolat/.test(t)) return 'forecast';
  if (/regression|correlat|r2|r-squared/.test(t)) return 'regression';
  if (/trend analysis|statistical|std ?dev|standard deviation|variance|analy[sz]e the trend/.test(t)) return 'stats';
  return '';
}

function runAnalytics(kind, tab) {
  if (!tab || !state.sheetCache[tab]) return '';
  var note = '';
  if (kind === 'pareto') {
    var pc = null;
    var prefs = [/root.?cause/i, /\bcause\b/i, /category|classification/i, /\btype\b/i];
    for (var pi2 = 0; pi2 < prefs.length && !pc; pi2++) pc = extractCounts(tab, prefs[pi2]);
    if (!pc) pc = extractCounts(tab, null);
    if (!pc) return '';
    var p = Analytics.pareto(pc.counts);
    var top = p.items.slice(0,10);
    renderChart({type:'bar', title:'Pareto — ' + tab + ' by ' + pc.column,
      labels: top.map(function(i){return i.label;}),
      datasets:[{label:'Count', data: top.map(function(i){return i.count;})}]});
    var vitalFew = p.items.filter(function(i){return i.cumPct <= 80;});
    note = '[VERIFIED ANALYTICS — Pareto of ' + tab + ' by "' + pc.column + '" (' + p.total + ' records): ' +
      top.map(function(i){return i.label + '=' + i.count + ' (' + i.pct + '%, cum ' + i.cumPct + '%)';}).join('; ') +
      '. Vital few (≤80% cumulative): ' + (vitalFew.map(function(i){return i.label;}).join(', ')||top[0].label) +
      '. A Pareto chart is already displayed. Narrate these exact figures in 2-4 sentences with one practical recommendation. Do not recompute or invent numbers.]';
  } else {
    var s = extractSeries(tab);
    if (!s) return '';
    var st = Analytics.stats(s.values);
    var reg = Analytics.regression(s.values);
    if (kind === 'forecast') {
      var fc = Analytics.forecast(s.values, 3);
      renderChart({type:'line', title:'Forecast — ' + s.seriesName,
        labels: s.labels.concat(['+1','+2','+3']),
        datasets:[{label:s.seriesName, data:s.values.concat([null,null,null])},
                  {label:'Forecast', data:s.values.map(function(){return null;}).concat(fc.values), color:'#C9A84C'}]});
      note = '[VERIFIED ANALYTICS — forecast for "' + s.seriesName + '" (' + tab + '): history ' + s.values.join(', ') +
        '; linear trend slope ' + reg.slope + '/period, R²=' + reg.r2 + '; next 3 periods ≈ ' + fc.values.join(', ') +
        '. Chart already displayed. Narrate these exact figures briefly, note forecast confidence based on R², one recommendation. Do not recompute.]';
    } else {
      renderChart({type:'line', title:'Trend — ' + s.seriesName, labels:s.labels,
        datasets:[{label:s.seriesName, data:s.values}]});
      note = '[VERIFIED ANALYTICS — "' + s.seriesName + '" (' + tab + '): values ' + s.values.join(', ') +
        '; mean ' + st.mean + ', stdev ' + st.stdev + ', min ' + st.min + ', max ' + st.max + ', overall change ' + st.delta +
        '; regression slope ' + reg.slope + '/period, R²=' + reg.r2 +
        '. Chart already displayed. Narrate these exact figures in 2-4 sentences. Do not recompute.]';
    }
  }
  if (note) {
    var kindName = {pareto:'Pareto analysis', forecast:'Forecast (linear regression)', regression:'Regression analysis', stats:'Trend & statistical analysis'}[kind]||kind;
    slLogAnalytics(kindName, tab, note.replace(/^\[VERIFIED ANALYTICS — /,'').split('. Chart')[0].split('. A Pareto')[0].slice(0,280));
  }
  return note;
}

/* ══════════════════════════════════════════════════════════════
   REGISTER HEALTH ENGINE — calculated during cache load
══════════════════════════════════════════════════════════════ */
function calculateHealth(tabKey, data) {
  if (!data || !data.rows || !data.rows.length) {
    return { score:0, grade:'F', completeness:0, overdue:0, duplicates:0, total:0, issues:['No data in register'] };
  }
  var headers = data.headers || [];
  var rows    = data.rows;
  var issues  = [];

  /* Completeness */
  var mandFields = MANDATORY_FIELDS[tabKey] || [];
  var filled = 0, total = 0;
  if (mandFields.length) {
    rows.forEach(function(row) {
      mandFields.forEach(function(field) {
        var idx = headers.indexOf(field);
        if (idx >= 0) { total++; if(row[idx] && String(row[idx]).trim()) filled++; }
      });
    });
  }
  var completeness = total > 0 ? Math.round(filled / total * 100) : 90;

  /* Overdue */
  var dateField = DATE_FIELDS[tabKey];
  var overdue = 0;
  if (dateField) {
    var dateIdx = headers.indexOf(dateField);
    if (dateIdx >= 0) {
      var today = new Date();
      rows.forEach(function(row) {
        if (row[dateIdx]) { var d = new Date(row[dateIdx]); if (!isNaN(d) && d < today) overdue++; }
      });
    }
  }

  /* Duplicates — check first non-empty column */
  var keyCol = rows.map(function(r) { return String(r[0]||'').trim().toLowerCase(); }).filter(function(v){return v;});
  var dupes  = keyCol.length - new Set(keyCol).size;

  /* Score */
  var score = 100;
  score -= (100 - completeness) * 0.5;
  score -= Math.min(overdue * 5, 30);
  score -= Math.min(dupes * 8, 20);
  score  = Math.max(0, Math.round(score));

  var grade = score >= 90 ? 'A' : score >= 75 ? 'B' : score >= 60 ? 'C' : score >= 40 ? 'D' : 'F';

  if (completeness < 80) issues.push((100-completeness) + '% of mandatory fields incomplete');
  if (overdue > 0)       issues.push(overdue + ' record' + (overdue>1?'s':'') + ' overdue');
  if (dupes > 0)         issues.push(dupes + ' potential duplicate' + (dupes>1?'s':'') + ' detected');
  if (!issues.length)    issues.push('No issues detected');

  return { score:score, grade:grade, completeness:completeness, overdue:overdue, duplicates:dupes, total:rows.length, issues:issues };
}

function renderHealthCards(tabs) {
  var html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px">';
  tabs.forEach(function(tab) {

  return html;
}


/* ══════════════════════════════════════════════════════════════
   CACHE MANAGEMENT — background, non-blocking
══════════════════════════════════════════════════════════════ */
function fetchWithTimeout(url, ms) {
  return new Promise(function(resolve, reject) {
    var tid = setTimeout(function() { reject(new Error('timeout')); }, ms);
    fetch(url).then(function(r) { clearTimeout(tid); return r.json(); })
      .then(resolve).catch(function(e) { clearTimeout(tid); reject(e); });
  });
}

function loadTab(tab) {
  var url = SHEETS_URL + '?tab=' + tab + '&limit=100';
  var t0  = performance.now();
  return fetchWithTimeout(url, SHEET_TIMEOUT)
    .then(function(data) {
      if (data) {
        state.sheetCache[tab] = { data:data, ts:Date.now() };
        state.health[tab] = calculateHealth(tab, data);
      }
      console.log('[iMASSI][SHEETS] ' + tab + ': ' + ((data&&data.rows)?data.rows.length:0) + ' rows | ' + Math.round(performance.now()-t0) + 'ms | health=' + (state.health[tab]?state.health[tab].grade:'N/A'));
      return data;
    })
    .catch(function(err) {
      console.warn('[iMASSI][SHEETS] ' + tab + ' failed (' + err.message + ') — retrying once in 3s');
      return new Promise(function(res) { setTimeout(res, 3000); }).then(function() {
        return fetchWithTimeout(url, SHEET_TIMEOUT).then(function(data) {
          if (data) {
            state.sheetCache[tab] = { data:data, ts:Date.now() };
            state.health[tab] = calculateHealth(tab, data);
            console.log('[iMASSI][SHEETS] ' + tab + ': recovered on retry (' + ((data.rows||[]).length) + ' rows)');
          }
          return data;
        }).catch(function(e2) {
          console.warn('[iMASSI][SHEETS] FAIL: ' + tab + ' — ' + e2.message);
          return null;
        });
      });
    });
}

async function initCache() {
  if (state.cacheLoading) return;
  state.cacheLoading = true;
  var t0 = performance.now();
  console.log('[iMASSI] === CACHE INIT START === ' + new Date().toISOString());

  setStatus('connecting', 'Connecting to Google Sheets...');

  /* Phase 1: priority tabs */
  setStatus('loading', 'Loading priority registers...', 0);
  await Promise.allSettled(PRIORITY_TABS.map(function(t) { return loadTab(t); }));
  var p1n  = Object.keys(state.sheetCache).length;
  state.cacheReady = true;
  setStatus('loading', 'Priority data ready — loading ' + (ALL_TABS.length-PRIORITY_TABS.length) + ' more...', Math.round(p1n/ALL_TABS.length*100));
  console.log('[iMASSI] Phase 1 done: ' + p1n + ' tabs in ' + Math.round(performance.now()-t0) + 'ms');

  /* Phase 2: remaining in batches */
  var remaining = ALL_TABS.filter(function(t) { return PRIORITY_TABS.indexOf(t) < 0; });
  for (var i = 0; i < remaining.length; i += BATCH_SIZE) {
    if (i > 0) await new Promise(function(res) { setTimeout(res, 400); });   /* breathe between batches */
    await Promise.allSettled(remaining.slice(i, i+BATCH_SIZE).map(function(t) { return loadTab(t); }));
    var n = Object.keys(state.sheetCache).length;
    setStatus('syncing', 'Building knowledge cache: ' + n + ' / ' + ALL_TABS.length, Math.round(n/ALL_TABS.length*100));
  }

  var total   = Object.keys(state.sheetCache).length;
  var elapsed = Math.round(performance.now() - t0);
  state.cacheTime    = Date.now();
  state.cacheLoading = false;

  /* Open CAPA count from live data */
  var openCapas = 0;
  var ce = state.sheetCache['capa'];
  if (ce && ce.data && ce.data.rows) {
    var si = (ce.data.headers||[]).findIndex(function(h) { return /status/i.test(h); });
    if (si >= 0) openCapas = ce.data.rows.filter(function(r) { return /open/i.test(String(r[si]||'')); }).length;
  }

  var readyMsg = total + ' of ' + ALL_TABS.length + ' registers loaded' + (openCapas > 0 ? ' — ' + openCapas + ' open CAPAs' : '');
  setStatus('ready', readyMsg);
  updateHealthPanel();

  console.log('[iMASSI] === CACHE COMPLETE === total=' + total + '/' + ALL_TABS.length + ' time=' + elapsed + 'ms');

  /* Background refresh */
  setTimeout(function bgRefresh() {
    if (!state.cacheLoading) {
      var stale = ALL_TABS.filter(function(t) { var e=state.sheetCache[t]; return !e||(Date.now()-e.ts)>CACHE_TTL; });
      if (stale.length) {
        setStatus('syncing', 'Refreshing ' + stale.length + ' registers...');
        Promise.allSettled(stale.map(function(t) { return loadTab(t); })).then(function() {
          setStatus('ready', Object.keys(state.sheetCache).length + ' registers — refreshed');
          updateHealthPanel();
        });
      }
    }
    setTimeout(bgRefresh, CACHE_TTL);
  }, CACHE_TTL);
}

/* ══════════════════════════════════════════════════════════════
   WRITE WORKFLOW — draft → approve → audit write
══════════════════════════════════════════════════════════════ */
function initiateWrite(writeData) {
  state.pendingWrite = writeData;
  appendAI(
    'I have prepared a draft record for <strong>' + writeData.register + '</strong>. ' +
    'Review the details below, add your reason, and click <strong>Approve & Write</strong> to save — or dismiss to cancel.',
    renderWriteCard(writeData), false
  );
}

function approveWrite() {
  if (!state.pendingWrite) return;
  var reason = document.getElementById('writeReason');
  if (!reason || !reason.value.trim()) {
    reason.style.border = '1px solid #E24B4A';
    reason.placeholder  = 'Reason is required for ISO audit trail';
    return;
  }
  var w = state.pendingWrite;
  var auditRecord = {
    action:    w.action,
    tab:       w.tab,
    register:  w.register,
    record:    w.record,
    reason:    reason.value.trim(),
    user:      state.userName || 'IMS Coordinator',
    session:   state.sessionId,
    timestamp: new Date().toISOString(),
    iso_clause: w.iso_clause || ''
  };

  setAvatar('thinking');
  var url = SHEETS_URL + '?action=writeRow&tab=' + w.tab +
    '&data=' + encodeURIComponent(JSON.stringify(w.record)) +
    '&reason=' + encodeURIComponent(reason.value.trim()) +
    '&user=' + encodeURIComponent(state.userName || 'IMS Coordinator') + (state.writeToken ? '&token=' + encodeURIComponent(state.writeToken) : '') + '&session=' + state.sessionId;

  fetchWithTimeout(url, 15000)
    .then(function(result) {
      setAvatar('success'); setTimeout(function(){setAvatar('idle');}, 3000);
      var msg = 'Record written to <strong>' + w.register + '</strong> register.';
      if (result && result.written) msg += ' Row ' + result.written + ' created.';
      msg += '<br><small style="color:#888">Audit trail: ' + auditRecord.timestamp + ' | ' + auditRecord.user + ' | ' + reason.value.trim() + '</small>';
      appendAI(msg);
      /* Refresh the cached tab */
      loadTab(w.tab);
      slLogWrite(w.register, w.tab, w.action, (w.record&&(w.record.ID||w.record.Id||w.record.id))||'', auditRecord.reason);
      state.pendingWrite = null;
      removeWriteCard();
    })
    .catch(function(err) {
      setAvatar('idle');
      appendAI('Write failed: ' + err.message + '. Please check the Apps Script connection and try again.');
    });
}

function dismissWrite() {
  state.pendingWrite = null;
  removeWriteCard();
  appendAI('Write operation dismissed. No changes were made to Google Sheets.');
}

/* ══════════════════════════════════════════════════════════════
   STATUS UI
══════════════════════════════════════════════════════════════ */
function setStatus(status, detail, pct) {
  var cfg = {offline:{label:'Offline',cls:'offline'},connecting:{label:'Connecting',cls:'connecting'},loading:{label:'Loading',cls:'loading'},syncing:{label:'Syncing',cls:'syncing'},ready:{label:'Connected',cls:'ready'},error:{label:'Error',cls:'error'}}[status]||{label:'Offline',cls:'offline'};
  var els = {strip:'dbStrip',dot:'dbDot',label:'dbLabel',detail:'dbDetail',progress:'dbProgress',fill:'dbFill',sync:'dbSync',retry:'dbRetry',hdrDot:'hdrDot',hdrTxt:'hdrTxt'};
  Object.keys(els).forEach(function(k){els[k]=document.getElementById(els[k]);});
  if(els.strip) els.strip.className='db-strip '+cfg.cls;
  if(els.dot)   els.dot.className='db-dot '+cfg.cls;
  if(els.label) els.label.textContent=cfg.label;
  if(els.detail)els.detail.textContent=detail||'';
  if(els.hdrDot)els.hdrDot.className='hdr-badge-dot '+cfg.cls;
  if(els.hdrTxt)els.hdrTxt.textContent=cfg.label;
  if(els.progress){
    if(pct!==undefined&&status!=='ready'&&status!=='error'){els.progress.style.display='block';if(els.fill){els.fill.style.width=pct+'%';els.fill.className='db-prog-fill';}}
    else if(status==='ready'){els.progress.style.display='block';if(els.fill){els.fill.style.width='100%';els.fill.className='db-prog-fill done';}}
    else{els.progress.style.display='none';}
  }
  if(els.sync&&status==='ready'){var now=new Date();els.sync.textContent='Synced '+now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
  if(els.retry)els.retry.style.display=(status==='error')?'inline-block':'none';
}

function formatText(txt) {
  var lines=txt.split('\n'),out=[],inTable=false,tableRows=[];
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim();
    if(line.charAt(0)==='|'&&line.charAt(line.length-1)==='|'){if(!inTable){inTable=true;tableRows=[];}tableRows.push(line);}
    else{if(inTable){out.push(renderMdTable(tableRows));tableRows=[];inTable=false;}out.push(lines[i]);}
  }
  if(inTable&&tableRows.length)out.push(renderMdTable(tableRows));
  return out.join('\n')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" style="color:#185FA5">$1</a>')
    .replace(/(^|[^"'>=\]])(https?:\/\/[^\s<>"')\]]+)/g,'$1<a href="$2" target="_blank" style="color:#185FA5">$2</a>')
    .replace(/[*][*](.*?)[*][*]/g,'<strong>$1</strong>').replace(/[*](.*?)[*]/g,'<em>$1</em>').replace(/\n/g,'<br>');
}
function renderMdTable(rows){
  var html='<table style="width:100%;border-collapse:collapse;font-size:11.5px;margin:8px 0">';
  rows.forEach(function(row,idx){
    if(/^\|[\s\-|]+\|$/.test(row))return;
    var cells=row.split('|').filter(function(c,i,a){return i>0&&i<a.length-1;});
    var isHdr=idx===0;
    html+='<tr>';
    cells.forEach(function(cell){
      if(isHdr)html+='<th style="background:#1B2A4A;color:#C9A84C;padding:7px 10px;text-align:left;font-weight:600;font-size:11px">'+cell.trim()+'</th>';
      else{var bg=idx%2===0?'#f8f9fb':'#fff';html+='<td style="padding:7px 10px;border-bottom:0.5px solid #e8e8e8;background:'+bg+'">'+cell.trim()+'</td>';}
    });
    html+='</tr>';
  });
  return html+'</table>';
}

function parseResponseBlocks(text) {
  var result = {text:text, writeData:null, chartData:null, healthTabs:null};

  /* Never render an echoed interface note */
  result.text = result.text.replace(/\[INTERFACE NOTE:[\s\S]*?\]/gi,'').trim();

  /* WRITE_PREVIEW block */
  var wm = text.match(/\[WRITE_PREVIEW\]([\s\S]*?)\[\/WRITE_PREVIEW\]/);
  if(wm){try{result.writeData=JSON.parse(wm[1].trim());}catch(e){} result.text=text.replace(wm[0],'').trim();}

  /* CHART block */
  var cm = text.match(/\[CHART\]([\s\S]*?)\[\/CHART\]/);
  if(cm){try{result.chartData=JSON.parse(cm[1].trim());}catch(e){} result.text=result.text.replace(cm[0],'').trim();}

  /* HEALTH block */
  var hm = text.match(/\[HEALTH\]([\s\S]*?)\[\/HEALTH\]/);
  if(hm){try{result.healthTabs=JSON.parse(hm[1].trim()).registers;}catch(e){} result.text=result.text.replace(hm[0],'').trim();}

  /* Component blocks: KPI_CARDS / TIMELINE / ACCORDION */
  result.components = [];
  [['KPI_CARDS',renderKpiCards],['TIMELINE',renderTimeline],['ACCORDION',renderAccordion]].forEach(function(def){
    var re = new RegExp('\\['+def[0]+'\\]([\\s\\S]*?)\\[\\/'+def[0]+'\\]');
    var m2;
    while((m2 = result.text.match(re))){
      try{result.components.push(def[1](JSON.parse(m2[1].trim())));}catch(e){}
      result.text = result.text.replace(m2[0],'').trim();
    }
  });

  return result;
}
