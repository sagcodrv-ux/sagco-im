<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Permit to Work — SAGCO IMS</title>
<script src="auth.js"></script>
<script src="data.js"></script>
<style>
  :root{
    --pdw-bg:#0D1B35; --pdw-bg2:#142140; --pdw-bg3:#1a2a50;
    --pdw-gold:#C9A84C; --pdw-gold-lt:#E8C97A;
    --pdw-text:rgba(255,255,255,.92); --pdw-text-muted:rgba(255,255,255,.55);
    --pdw-text-dim:rgba(255,255,255,.35); --pdw-border:rgba(255,255,255,.08);
    --pdw-border-gold:rgba(201,168,76,.35);
    --pdw-blue:#5B9BD5; --pdw-red:#F0685C; --pdw-amb:#E8B339; --pdw-grn:#4FCB9E;
  }
  *{box-sizing:border-box}
  body{background:var(--pdw-bg); color:var(--pdw-text); margin:0; min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;}
  .pm-wrap{max-width:480px; margin:0 auto; padding:16px 16px 40px}
  .pm-header{display:flex; align-items:center; justify-content:space-between; padding:6px 2px 16px}
  .pm-header h1{font-size:16px; margin:0; color:var(--pdw-gold-lt); font-weight:700}
  .pm-header .pm-sub{font-size:10.5px; color:var(--pdw-text-muted); margin-top:2px}
  .pm-full-link{font-size:10.5px; color:var(--pdw-gold-lt); text-decoration:none; border:1px solid var(--pdw-border-gold);
    padding:5px 9px; border-radius:6px; white-space:nowrap}
  .pm-home-btn{display:flex; align-items:center; gap:14px; width:100%; background:var(--pdw-bg2); border:1px solid var(--pdw-border);
    border-radius:14px; padding:18px 16px; margin-bottom:12px; color:inherit; text-align:left; font-family:inherit; cursor:pointer}
  .pm-home-btn .pm-icon{font-size:28px; flex:0 0 auto}
  .pm-home-btn .pm-label{font-size:15px; font-weight:700}
  .pm-home-btn .pm-count{font-size:11.5px; color:var(--pdw-text-muted); margin-top:2px}
  .pm-home-btn.pm-primary{background:linear-gradient(135deg,var(--pdw-gold) 0%, #B08F3A 100%); color:#15223f; border:none}
  .pm-home-btn.pm-primary .pm-count{color:rgba(21,34,63,.65)}
  .pm-back{display:inline-flex; align-items:center; gap:5px; color:var(--pdw-gold-lt); font-size:12px; font-weight:600;
    text-decoration:none; background:none; border:none; padding:6px 0 14px; cursor:pointer; font-family:inherit}
  .pm-list-title{font-size:15px; font-weight:700; margin:0 0 4px}
  .pm-list-empty{font-size:12.5px; color:var(--pdw-text-muted); padding:30px 10px; text-align:center}
  .pm-card{background:var(--pdw-bg2); border:1px solid var(--pdw-border); border-radius:12px; padding:14px; margin-bottom:10px; cursor:pointer}
  .pm-card-viewonly{opacity:.78}
  .pm-card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px}
  .pm-card-id{font-size:13.5px; font-weight:700}
  .pm-badge{font-size:10px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap}
  .pm-b-amber{background:rgba(232,179,57,.18); color:var(--pdw-amb)}
  .pm-b-blue{background:rgba(91,155,213,.18); color:var(--pdw-blue)}
  .pm-b-green{background:rgba(79,203,158,.18); color:var(--pdw-grn)}
  .pm-b-red{background:rgba(240,104,92,.18); color:var(--pdw-red)}
  .pm-b-grey{background:rgba(255,255,255,.08); color:var(--pdw-text-muted)}
  .pm-card-meta{font-size:12px; color:var(--pdw-text-muted); margin-top:6px; line-height:1.5}
  .pm-card-meta b{color:var(--pdw-text); font-weight:600}
  .pm-card-action{display:block; width:100%; margin-top:10px; padding:10px; border-radius:8px; border:none;
    font-size:13px; font-weight:700; text-align:center; cursor:pointer; font-family:inherit; text-decoration:none}
  .pm-act-main{background:var(--pdw-gold); color:#15223f}
  .pm-act-view{background:var(--pdw-bg3); color:var(--pdw-gold-lt); border:1px solid var(--pdw-border-gold)}
  .pm-step-dots{display:flex; gap:6px; justify-content:center; margin-bottom:16px}
  .pm-dot{width:8px; height:8px; border-radius:50%; background:var(--pdw-border)}
  .pm-dot.pm-active{background:var(--pdw-gold)}
  .pm-field{margin-bottom:14px}
  .pm-field label{display:block; font-size:12px; font-weight:600; margin-bottom:5px; color:var(--pdw-text-muted)}
  .pm-field input,.pm-field select,.pm-field textarea{width:100%; padding:11px 12px; font-size:14px; border-radius:8px;
    border:1px solid var(--pdw-border); background:var(--pdw-bg3); color:inherit; font-family:inherit}
  .pm-field input::placeholder,.pm-field textarea::placeholder{color:var(--pdw-text-dim)}
  .pm-step-nav{display:flex; gap:10px; margin-top:8px}
  .pm-step-nav button{flex:1; padding:13px; border-radius:9px; border:none; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit}
  .pm-btn-next{background:var(--pdw-gold); color:#15223f}
  .pm-btn-back{background:var(--pdw-bg2); color:var(--pdw-text); border:1px solid var(--pdw-border) !important}
  .pm-review-row{display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--pdw-border); font-size:13px}
  .pm-review-row span:first-child{color:var(--pdw-text-muted)}
  .pm-review-row span:last-child{font-weight:600; text-align:right}
  .pm-err{font-size:12px; color:var(--pdw-red); margin-top:6px; display:none}
  .pm-loading{text-align:center; padding:60px 10px; color:var(--pdw-text-muted); font-size:13px}
  .pm-chip-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
  .pm-chip{font-size:11px; font-weight:700; padding:6px 10px; border-radius:20px; text-decoration:none; white-space:nowrap}
  .pm-chip-done{background:rgba(79,203,158,.16); color:var(--pdw-grn); border:1px solid rgba(79,203,158,.4)}
  .pm-chip-todo{background:rgba(232,179,57,.16); color:var(--pdw-amb); border:1px solid rgba(232,179,57,.4)}
  .pm-chip-locked{background:rgba(255,255,255,.06); color:var(--pdw-text-dim); border:1px solid var(--pdw-border); cursor:not-allowed}
  .pm-type-row{display:flex; align-items:center; gap:14px; width:100%; background:var(--pdw-bg2); border:1px solid var(--pdw-border);
    border-radius:14px; padding:16px; margin-bottom:10px; color:inherit; text-decoration:none; text-align:left; font-family:inherit; cursor:pointer}
  .pm-type-row .pm-icon{font-size:22px}
  .pm-type-row .pm-label{font-size:14px; font-weight:700}
  .pm-type-row .pm-meta{font-size:11px; color:var(--pdw-text-muted); margin-top:2px}
  /* Rev.86 — sticky search/filter/action bar for the full-screen
     permit list landing view. */
  .pm-sticky-top{position:sticky; top:0; z-index:5; background:var(--pdw-bg); padding-top:10px; margin:0 -16px; padding-left:16px; padding-right:16px;
    border-bottom:1px solid var(--pdw-border); padding-bottom:10px}
  .pm-top-actions{display:flex; gap:8px; margin-bottom:10px}
  .pm-mini-btn{flex:1; padding:11px 8px; border-radius:9px; border:1px solid var(--pdw-border-gold); background:var(--pdw-bg2);
    color:var(--pdw-gold-lt); font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit}
  .pm-mini-primary{background:linear-gradient(135deg,var(--pdw-gold) 0%, #B08F3A 100%); color:#15223f; border:none}
  .pm-search-input{width:100%; padding:10px 12px; font-size:16px; border-radius:9px; border:1px solid var(--pdw-border);
    background:var(--pdw-bg3); color:var(--pdw-text); font-family:inherit; margin-bottom:10px}
  .pm-search-input::placeholder{color:var(--pdw-text-dim)}
  .pm-fchip-row{display:flex; gap:7px; flex-wrap:wrap}
  .pm-fchip{padding:7px 12px; border-radius:20px; border:1px solid var(--pdw-border); background:var(--pdw-bg2);
    color:var(--pdw-text-muted); font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; white-space:nowrap}
  .pm-fchip-active{background:var(--pdw-gold); color:#15223f; border-color:var(--pdw-gold)}
</style>
</head>
<body>
<div class="pm-wrap" id="pm-root">
  <div class="pm-loading">Loading…</div>
</div>

<script>
(function(){
  var SHEETS_URL = window.SHEETS_URL;
  var REG_TAB = 'ptw_register', REG_ID = 'Permit ID';
  var root = document.getElementById('pm-root');

  var PTW_WORK_TYPES = [
    'Hot work','Cold work','Confined spaces','Working at height','Lifting',
    'Painting','Civil work','Pipeline works (LPG / Oil)','Electrical Repairs'
  ];

  var _reg = null, _issuers = null, _users = null, _me = '';
  // Rev.84 (Issam, voice, 2026-11-19) — the four checklist types that
  // have a mobile create flow so far (checklist-mobile.html); matches
  // permitNeeds*() on ptw-register.html exactly so a permit shows the
  // same checklist requirements here as it does on the full site.
  var _hw = null, _elec = null, _loto = null, _cs = null;
  var _crane = null, _scaffold = null, _harness = null, _paint = null, _civil = null, _pipe = null;
  function permitNeedsConfinedSpace(rec){ return /confined/i.test(String(rec['Work Involved']||'')); }
  function permitNeedsLoto(rec){
    if (String(rec['Service Isolation']||'').trim()) return true;
    return /electrical/i.test(String(rec['Work Involved']||''));
  }
  function permitNeedsHotWork(rec){ return /hot work/i.test(String(rec['Work Involved']||'')); }
  function permitNeedsElectrical(rec){ return /electrical/i.test(String(rec['Work Involved']||'')); }
  // Rev.85 (Issam, voice, 2026-11-20) — the six remaining checklist
  // types, matching ptw-register.html's own permitNeeds* exactly,
  // including Crane/Scaffold's shared "Height Access Method" split
  // and Harness applying to height work regardless of which method.
  function permitNeedsCrane(rec){
    var work = String(rec['Work Involved']||'');
    if (/lifting/i.test(work)) return true;
    return /height/i.test(work) && String(rec['Height Access Method']||'').trim() === 'Crane';
  }
  function permitNeedsScaffold(rec){
    var work = String(rec['Work Involved']||'');
    return /height/i.test(work) && String(rec['Height Access Method']||'').trim() === 'Scaffolding';
  }
  function permitNeedsHarness(rec){ return /height/i.test(String(rec['Work Involved']||'')); }
  function permitNeedsPainting(rec){ return /paint/i.test(String(rec['Work Involved']||'')); }
  function permitNeedsCivilWork(rec){ return /civil/i.test(String(rec['Work Involved']||'')); }
  function permitNeedsPipeline(rec){ return /pipeline/i.test(String(rec['Work Involved']||'')); }

  function colIdx(headers, name){
    var out = -1;
    (headers||[]).forEach(function(h,i){ if(String(h).trim().toLowerCase()===String(name).toLowerCase()) out = i; });
    return out;
  }
  function recFromRow(headers, row){ var o={}; headers.forEach(function(h,i){ o[h]=row[i]; }); return o; }
  function esc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  // "1234 - Khaled Hassan" -> "Khaled Hassan" (same convention as the
  // desktop register's issuerDisplayNameFromField_).
  function displayNameFromField(v){
    var s = String(v||'').trim();
    var m = s.match(/^\s*[\w-]+\s*-\s*(.+)$/);
    return (m ? m[1] : s).trim();
  }
  function namesMatch(a, b){
    a = displayNameFromField(a).toLowerCase(); b = String(b||'').trim().toLowerCase();
    return !!a && !!b && a === b;
  }

  function fetchTab(tab){
    return fetch(SHEETS_URL + '?tab=' + tab + '&action=read').then(function(r){ return r.json(); })
      .then(function(data){ return (data && data.headers && data.rows) ? data : {headers:[],rows:[]}; })
      .catch(function(){ return {headers:[],rows:[]}; });
  }
  function loadAll(cb){
    // Rev.90 (Issam, voice, 2026-11-22) — this was fetching a tab
    // literally named 'issuers', which doesn't exist; the real
    // Authorized Issuers roster sheet is 'ptw_authorized_issuers'
    // (confirmed against ptw-register.html's own TABLES.issuers
    // config). That's why the Permit Issuer dropdown on New Permit —
    // and matchIssuerToMe_()/_amAuthorizedIssuer, which both depend on
    // this same fetch — came up empty.
    Promise.all([fetchTab(REG_TAB), fetchTab('ptw_authorized_issuers'), fetchTab('users'),
      fetchTab('hotwork_checklist'), fetchTab('electrical_checklist'), fetchTab('loto_register'), fetchTab('cs_entry'),
      fetchTab('crane_checklist'), fetchTab('scaffold_inspection'), fetchTab('harness_fall_protection'),
      fetchTab('painting_checklist'), fetchTab('civil_work_checklist'), fetchTab('pipeline_checklist')
    ]).then(function(r){
      _reg = r[0]; _issuers = r[1]; _users = r[2];
      _hw = r[3]; _elec = r[4]; _loto = r[5]; _cs = r[6];
      _crane = r[7]; _scaffold = r[8]; _harness = r[9];
      _paint = r[10]; _civil = r[11]; _pipe = r[12];
      _amAuthorizedIssuer = !!matchIssuerToMe_();
      cb();
    });
  }
  function findLinkedRow_(tabData, permitId, idColName, ownIdCol){
    if (!tabData || !tabData.headers || !tabData.rows) return null;
    var numIdx = colIdx(tabData.headers, idColName||'PTW Number');
    var statusIdx = colIdx(tabData.headers, 'Record Status');
    var ownIdx = ownIdCol ? colIdx(tabData.headers, ownIdCol) : -1;
    var found = null;
    tabData.rows.forEach(function(row){
      if (statusIdx>=0 && String(row[statusIdx]||'').trim().toLowerCase()==='removed') return;
      if (numIdx>=0 && String(row[numIdx]||'').trim() === String(permitId).trim()){
        found = { row: row, headers: tabData.headers, id: ownIdx>=0 ? String(row[ownIdx]||'').trim() : '' };
      }
    });
    return found;
  }
  function fieldVal_(found, name){
    if (!found) return '';
    var idx = colIdx(found.headers, name);
    return idx>=0 ? String(found.row[idx]||'').trim() : '';
  }
  // Rev.84 — LOTO "ready" mirrors ptw-register.html's own
  // lotoJobIsReady_ exactly: Open or Closed, with every pre-task check
  // confirmed. This is what gates the Confined Space chip below, same
  // rule as the desktop page's own LOTO-before-Confined-Space lock.
  var LOTO_PRE_TASK_CHECKS = ['Equipment Shutdown Safely','All Energy Sources Isolated','Locks and Tags Applied',
    'Stored Energy Released or Restrained','Zero-Energy Condition Verified',
    'Absence-of-Voltage Test Completed','Work Area Confirmed Safe and PTW Conditions Satisfied'];
  function lotoReady_(found){
    if (!found) return false;
    var status = fieldVal_(found, 'Status').toLowerCase();
    if (status !== 'open' && status !== 'closed') return false;
    return LOTO_PRE_TASK_CHECKS.every(function(f){ return fieldVal_(found, f).toLowerCase() === 'yes'; });
  }
  // Rev.84 — one compact chip row per permit card, covering the four
  // checklist types with a mobile create flow so far. Chips link into
  // checklist-mobile.html, never duplicate its logic; a Confined Space
  // chip is shown disabled, matching the desktop lock, when this
  // permit also needs a LOTO job and that job isn't ready yet.
  function checklistChipsHtml(rec){
    var permitId = rec['Permit ID'];
    var chips = [];
    if (permitNeedsHotWork(rec)){
      var f = findLinkedRow_(_hw, permitId, 'PTW Number');
      chips.push(chip_('Hot Work', f, 'hotwork', permitId));
    }
    if (permitNeedsElectrical(rec)){
      var f2 = findLinkedRow_(_elec, permitId, 'PTW Number');
      var ready2 = f2 && fieldVal_(f2,'Result') === 'Cleared';
      chips.push(chip_('Electrical', f2, 'electrical', permitId, ready2));
    }
    var lotoFound = null, lReady = false;
    if (permitNeedsLoto(rec)){
      lotoFound = findLinkedRow_(_loto, permitId, 'PTW Number', 'LOTO ID');
      lReady = lotoReady_(lotoFound);
      chips.push(chip_('LOTO', lotoFound, 'loto', permitId, lReady));
    }
    if (permitNeedsConfinedSpace(rec)){
      var needsLotoHere = permitNeedsLoto(rec);
      var locked = needsLotoHere && !lReady && !findLinkedRow_(_cs, permitId, 'PTW Number');
      if (locked){
        chips.push('<span class="pm-chip pm-chip-locked" title="Complete the LOTO Job first">🔒 Confined Space</span>');
      } else {
        var extra = (lotoFound && lotoFound.id) ? '&lotoId=' + encodeURIComponent(lotoFound.id) : '';
        var f3 = findLinkedRow_(_cs, permitId, 'PTW Number');
        chips.push(chip_('Confined Space', f3, 'cs', permitId, null, extra));
      }
    }
    if (permitNeedsCrane(rec)){
      var fCr = findLinkedRow_(_crane, permitId, 'PTW Number');
      chips.push(chip_('Crane', fCr, 'crane', permitId, fCr && fieldVal_(fCr,'Inspection Result')==='Accept Crane'));
    }
    if (permitNeedsScaffold(rec)){
      var fSc = findLinkedRow_(_scaffold, permitId, 'Permit Number');
      chips.push(chip_('Scaffold', fSc, 'scaffold', permitId, fSc && /green/i.test(fieldVal_(fSc,'Tag Status'))));
    }
    if (permitNeedsHarness(rec)){
      var fHa = findLinkedRow_(_harness, permitId, 'PTW Number');
      chips.push(chip_('Harness', fHa, 'harness', permitId, fHa && fieldVal_(fHa,'Overall Result')==='Satisfactory'));
    }
    if (permitNeedsPainting(rec)){
      var fPt = findLinkedRow_(_paint, permitId, 'PTW Number');
      chips.push(chip_('Painting', fPt, 'painting', permitId, fPt && fieldVal_(fPt,'Result')==='Cleared'));
    }
    if (permitNeedsCivilWork(rec)){
      var fCv = findLinkedRow_(_civil, permitId, 'PTW Number');
      chips.push(chip_('Civil Work', fCv, 'civilwork', permitId, fCv && fieldVal_(fCv,'Result')==='Cleared'));
    }
    if (permitNeedsPipeline(rec)){
      var fPl = findLinkedRow_(_pipe, permitId, 'PTW Number');
      chips.push(chip_('Pipeline', fPl, 'pipeline', permitId, fPl && fieldVal_(fPl,'Result')==='Cleared'));
    }
    return chips.length ? '<div class="pm-chip-row">' + chips.join('') + '</div>' : '';
  }
  function chip_(label, found, type, permitId, readyOverride, extraQS){
    var done = readyOverride !== undefined && readyOverride !== null ? readyOverride : !!found;
    var cls = done ? 'pm-chip-done' : 'pm-chip-todo';
    var text = done ? ('✓ ' + label) : ('+ ' + label);
    return '<a class="pm-chip ' + cls + '" href="checklist-mobile.html?type=' + type + '&permitId=' + encodeURIComponent(permitId) + (extraQS||'') + '" target="_blank">' + esc(text) + '</a>';
  }

  // Same multi-word AND search + date normalisation as
  // ptw-register.html's own search box (Rev.79) — kept identical so
  // typing "19-11-2026 Khaled" finds the same permits here as there.
  function splitSearchTerms_(raw){
    return String(raw||'').trim().toLowerCase().split(/\s+/).filter(Boolean).map(function(term){
      var m = term.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
      if (!m) return term;
      var dd = m[1].padStart(2,'0'), mm = m[2].padStart(2,'0'), yyyy = m[3];
      return yyyy + '-' + mm + '-' + dd;
    });
  }
  function regRecords(){
    var statusIdx = colIdx(_reg.headers, 'Record Status');
    return _reg.rows.filter(function(r){
      return statusIdx < 0 || String(r[statusIdx]||'').trim().toLowerCase() !== 'removed';
    }).map(function(r){ return recFromRow(_reg.headers, r); });
  }
  function myPermits(){
    return regRecords().filter(function(rec){
      return namesMatch(rec['Permit Issuer - Name'], _me) || namesMatch(rec['Permit Receiver - Name'], _me);
    }).sort(function(a,b){ return String(b['Permit ID']||'').localeCompare(String(a['Permit ID']||'')); });
  }
  function awaitingMyApproval(){
    return regRecords().filter(function(rec){
      var status = String(rec['Status']||'').trim();
      if (status === 'Awaiting Area Manager') return namesMatch(rec['Unit Manager'], _me) || String(rec['Unit Manager']||'').trim().toLowerCase() === _me.toLowerCase();
      if (status === 'Awaiting Controller') return namesMatch(rec['Permit Controller'], _me) || String(rec['Permit Controller']||'').trim().toLowerCase() === _me.toLowerCase();
      return false;
    }).sort(function(a,b){ return String(b['Permit ID']||'').localeCompare(String(a['Permit ID']||'')); });
  }

  var STATUS_BADGE = {
    'Awaiting Receiver Signature': ['pm-b-amber','Awaiting Signature'],
    'Awaiting Toolbox Talk': ['pm-b-amber','Awaiting Toolbox Talk'],
    'Waiting': ['pm-b-amber','Awaiting Checklist'],
    'Awaiting Area Manager': ['pm-b-blue','Awaiting Area Manager'],
    'Awaiting Controller': ['pm-b-blue','Awaiting Controller'],
    'Active': ['pm-b-green','Active'],
    'Closed': ['pm-b-grey','Closed'],
    'Cancelled': ['pm-b-red','Cancelled'],
    'Renewed': ['pm-b-grey','Renewed']
  };
  function badgeHtml(status){
    var b = STATUS_BADGE[status] || ['pm-b-grey', status || '—'];
    return '<span class="pm-badge ' + b[0] + '">' + esc(b[1]) + '</span>';
  }
  // Rev.87/88/89 (Issam, voice, 2026-11-22) — whether a permit is
  // "yours to act on" right now, not to be confused with the permit's
  // own Active/Closed workflow Status badge above. Returns a role
  // string, or null if it isn't yours at all:
  //  - 'issuer': this permit's own issuer — always active.
  //  - 'other-issuer': any OTHER authorized issuer. A permit isn't
  //    locked to whoever first raised it — another safety person can
  //    take it over after the pre-validation and continue it (raise
  //    the remaining checklists, etc.) — so being on the Authorized
  //    Issuers roster at all makes it active, same as the original
  //    issuer, just with the ordinary "Open Permit" label rather than
  //    a role-specific one (they aren't the Receiver/Manager/
  //    Controller, so those labels would be misleading on them).
  //  - 'receiver': only at the stage that's actually theirs — signing
  //    at the start, the toolbox talk, or signing again at closing
  //    (no separate Status exists for closing, so Active counts too).
  //  - 'manager' / 'controller': only at their own approval stage.
  var _amAuthorizedIssuer = null; // computed once per load, see loadAll()
  function myRoleOnPermit_(rec){
    if (namesMatch(rec['Permit Issuer - Name'], _me)) return 'issuer';
    var status = String(rec['Status']||'').trim();
    if ((status === 'Awaiting Receiver Signature' || status === 'Awaiting Toolbox Talk' || status === 'Active') && namesMatch(rec['Permit Receiver - Name'], _me)) return 'receiver';
    if (status === 'Awaiting Area Manager' && namesMatch(rec['Unit Manager'], _me)) return 'manager';
    if (status === 'Awaiting Controller' && namesMatch(rec['Permit Controller'], _me)) return 'controller';
    if (_amAuthorizedIssuer) return 'other-issuer';
    return null;
  }
  // One primary action per card — always the same deep link into the
  // desktop register's own edit view, which already shows the right
  // resume/approve button for whatever stage the permit is at. The
  // mobile page's job is just to get the right permit in front of the
  // right person with one tap; the tested approval/signature logic
  // itself lives in ptw-register.html, not duplicated here.
  function actionLabel(rec, role){
    var status = String(rec['Status']||'').trim();
    if (role === 'manager' && status === 'Awaiting Area Manager') return 'Approve as Area Manager';
    if (role === 'controller' && status === 'Awaiting Controller') return 'Approve as Controller';
    if (role === 'receiver'){
      if (status === 'Awaiting Receiver Signature') return 'Sign as Receiver';
      if (status === 'Awaiting Toolbox Talk') return 'Record Toolbox Talk';
      if (status === 'Active') return 'Sign Closing (when ready)';

    if (status === 'Waiting') return 'Open Checklist';
    return 'Open Permit';

  function cardHtml(rec){
    var id = esc(rec['Permit ID']);

  // Rev.86 (Issam, voice, 2026-11-21) — the landing screen is now the
  // full permit list itself (same idea as the desktop register's own
  // table), not three big buttons: a sticky search + filter + New
  // Permit bar on top, the list filling the rest of the screen below
  // it. The three destinations the big buttons used to open (My
  // Permits, Awaiting My Approval, and "everything") are now filter
  // chips on that same bar instead of separate pages, per Issam's own
  // call — left to me whether "everything" shows by default, so it
  // does, newest first, with the chips just narrowing it.
  var _listFilter = 'all';
  var _listSearch = '';
  // Rev.86 — every cell in the row, same as ptw-register.html's own
  // search (Rev.79): "ALL must match, each against any cell in the
  // row (not necessarily the same cell)". A fixed, curated field list
  // would silently miss things like the permit's Date.
  function matchesSearch_(rec, terms){
    if (!terms.length) return true;
    var hay = Object.keys(rec).map(function(k){ return String(rec[k]||'').toLowerCase(); }).join(' | ');
    return terms.every(function(t){ return hay.indexOf(t) > -1; });
  }
  function filteredPermits_(){
    var base = _listFilter === 'mine' ? myPermits() : (_listFilter === 'approvals' ? awaitingMyApproval() : regRecords().sort(function(a,b){ return String(b['Permit ID']||'').localeCompare(String(a['Permit ID']||'')); }));
    var terms = splitSearchTerms_(_listSearch);
    return base.filter(function(r){ return matchesSearch_(r, terms); });
  }
  // Rev.91 (Issam, voice, 2026-11-22) — suggestions for free-text
  // fields on New Permit, built from what's actually been typed
  // before (this register's own past Area/Location/Receiver values),
  // not a fixed list — so it grows with real use instead of needing
  // maintenance. A plain HTML <datalist> keeps this native: the
  // field still accepts anything typed, the suggestions just appear
  // as the person types.
  function buildDatalist_(listId, field){
    var counts = {};
    regRecords().forEach(function(rec){
      var v = String(rec[field]||'').trim();
      if (v) counts[v] = (counts[v]||0) + 1;
    });
    var values = Object.keys(counts).sort(function(a,b){ return counts[b]-counts[a]; }).slice(0, 20);
    return '<datalist id="' + listId + '">' + values.map(function(v){ return '<option value="' + esc(v) + '">'; }).join('') + '</datalist>';
  }
  function filterChipHtml_(key, label, count){
    var active = _listFilter === key;
    return '<button type="button" class="pm-fchip' + (active?' pm-fchip-active':'') + '" onclick="PM.setListFilter(\'' + key + '\')">' + esc(label) + (count!=null ? ' (' + count + ')' : '') + '</button>';
  }

    var mine = myPermits().length, approvals = awaitingMyApproval().length, all = regRecords().length;

      + '<div class="pm-fchip-row">'

  var _new = { area:'', location:'', workInvolved:'', heightAccessMethod:'', description:'', issuer:'', receiver:'', unitManager:'', unitManagerEmail:'', controller:'', controllerEmail:'' };

  function issuerOptionsHtml(){
    var hIdx = colIdx(_issuers.headers, 'Employee ID'), nIdx = colIdx(_issuers.headers, 'Name');
    var sIdx = colIdx(_issuers.headers, 'Record Status');
    var opts = '<option value="">— select —</option>';
    _issuers.rows.forEach(function(r){
      if (sIdx>=0 && String(r[sIdx]||'').trim().toLowerCase()==='removed') return;
      var id = hIdx>=0 ? String(r[hIdx]||'').trim() : '', name = nIdx>=0 ? String(r[nIdx]||'').trim() : '';
      if (!name) return;
      var composite = id ? (id + ' - ' + name) : name;
      opts += '<option value="' + esc(composite) + '"' + (composite===_new.issuer?' selected':'') + '>' + esc(composite) + '</option>';
    });
    return opts;
  }
  // Rev.83 (Issam, 2026-11-19) — the Permit Issuer dropdown always
  // started on "— select —", with nothing pointing it at whoever was
  // actually filling in the form, so people had to find their own
  // name in the list by hand. This looks the logged-in user up
  // against the Authorized Issuers roster (same list the dropdown
  // itself is built from) and returns their "ID - Name" composite if
  // found, or '' if they aren't on that roster at all — which is then
  // reported as its own, visible state rather than silently left on
  // "— select —" with no explanation.
  function matchIssuerToMe_(){
    if (!_issuers || !_issuers.rows) return '';
    var nIdx = colIdx(_issuers.headers, 'Name'), hIdx = colIdx(_issuers.headers, 'Employee ID');
    var sIdx = colIdx(_issuers.headers, 'Record Status');
    var meLower = String(_me||'').trim().toLowerCase();
    if (!meLower) return '';
    var match = null;
    _issuers.rows.forEach(function(r){
      if (sIdx>=0 && String(r[sIdx]||'').trim().toLowerCase()==='removed') return;
      var name = nIdx>=0 ? String(r[nIdx]||'').trim() : '';
      if (name.toLowerCase() === meLower) match = r;
    });
    if (!match) return '';
    var id = hIdx>=0 ? String(match[hIdx]||'').trim() : '';
    var name = nIdx>=0 ? String(match[nIdx]||'').trim() : '';
    return id ? (id + ' - ' + name) : name;
  }
  function roleOptionsHtml(filterFn, selectedName){
    var nameIdx = colIdx(_users.headers, 'Full Name'), name2Idx = colIdx(_users.headers, 'Name');
    var emailIdx = colIdx(_users.headers, 'Email'), roleIdx = colIdx(_users.headers, 'Role'), titleIdx = colIdx(_users.headers, 'Job Title');
    var statusIdx = colIdx(_users.headers, 'Account Status');
    var seen = {}; var opts = '<option value="" data-email="">— select —</option>';
    _users.rows.forEach(function(r){
      if (statusIdx>=0){ var st = String(r[statusIdx]||'active').trim().toLowerCase(); if (st && st!=='active') return; }
      var name = (nameIdx>=0 && r[nameIdx]) || (name2Idx>=0 && r[name2Idx]) || '';
      name = String(name).trim();
      var email = emailIdx>=0 ? String(r[emailIdx]||'').trim() : '';
      var role = roleIdx>=0 ? String(r[roleIdx]||'').trim() : '';
      var title = titleIdx>=0 ? String(r[titleIdx]||'').trim() : '';
      if (!name || !email || seen[name.toLowerCase()]) return;
      if (!filterFn(role, title)) return;
      seen[name.toLowerCase()] = true;
      opts += '<option value="' + esc(name) + '" data-email="' + esc(email) + '"' + (name.toLowerCase()===String(selectedName||'').toLowerCase()?' selected':'') + '>' + esc(name) + ' (' + esc(email) + ')</option>';
    });
    return opts;
  }
  function isManager(role, title){ return /manager/i.test(role) || /manager/i.test(title) || /superadmin|admin/i.test(role); }
  function isSafety(role, title){ return /safety|hse/i.test(role) || /safety|hse|controller/i.test(title) || /superadmin|admin/i.test(role); }

      + buildDatalist_('pm-dl-receiver', 'Permit Receiver - Name')
      + '<div class="pm-field"><label>Unit / Area Manager <span style="color:var(--pdw-red)">*</span></label><select id="pm-f-um">' + roleOptionsHtml(isManager, _new.unitManager) + '</select></div>'

  function nextSequentialId(){
    var idIdx = colIdx(_reg.headers, REG_ID);
    if (idIdx < 0) return 'PTW-0001';
    var maxN = 0;
    _reg.rows.forEach(function(r){
      var v = String(r[idIdx]||'').trim();
      if (v.toLowerCase().indexOf('ptw-') !== 0) return;
      var n = parseInt(v.slice(4), 10);
      if (!isNaN(n) && n > maxN) maxN = n;

  function toDatetimeLocalValue(d){
    function pad(n){ return String(n).padStart(2,'0'); }
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());

      _new.description = document.getElementById('pm-f-desc').value.trim();
      var needsHam = _new.workInvolved === 'Working at height';
      if (!_new.area || !_new.workInvolved || (needsHam && !_new.heightAccessMethod)){ document.getElementById('pm-err1').style.display = 'block'; return; }
      renderNew2();
    },
    toStep3: function(){
      captureStep2Values_();
      if (!_new.issuer || !_new.receiver || !_new.unitManager || !_new.controller){ document.getElementById('pm-err2').style.display = 'block'; return; }
      renderNew3();
    },
    backFromStep2: function(){
      captureStep2Values_();
      renderNew1();
    },
    createPermit: function(){
      var btn = document.getElementById('pm-create-btn');
      btn.disabled = true; btn.textContent = 'Creating…';
      var id = nextSequentialId();
      var now = new Date();
      var validTo = new Date(now.getTime() + 12*60*60*1000);
      var values = {
        'Permit ID': id,
        'Date': now.toISOString().slice(0,10),
        'Permit Created At': now.toLocaleString(),
        'Area': _new.area,
        'Location': _new.location,
        'Work Involved': _new.workInvolved,
        'Height Access Method': _new.heightAccessMethod,
        'Description of Work': _new.description,
        'Permit Issuer - Name': _new.issuer,
        'Permit Receiver - Name': _new.receiver,
        'Unit Manager': _new.unitManager,
        'Unit Manager Email': _new.unitManagerEmail,
        'Permit Controller': _new.controller,
        'Permit Controller Email': _new.controllerEmail,
        'Permit Valid From': toDatetimeLocalValue(now),
        'Permit Valid To': toDatetimeLocalValue(validTo),
        'Status': 'Awaiting Receiver Signature',
        'Record Status': 'Active'
      };
      postJSON('write', {tab: REG_TAB}, [values]).then(function(res){
        if (res && res.status === 'error'){
          alert('Could not create the permit: ' + (res.message||'unknown error'));
          btn.disabled = false; btn.textContent = 'Create Permit';
          return;
        }
        window.open('ptw-register.html?permitId=' + encodeURIComponent(id), '_blank');
        PM.go('home');
      }).catch(function(){
        alert('Could not reach the server — check your connection and try again.');
        btn.disabled = false; btn.textContent = 'Create Permit';
      });
    }
  };

  function allowed(s){ return !!s; }
  function blockPage(){
    document.body.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0D1B35;color:#fff;text-align:center;padding:40px">'
      +'<div><div style="font-size:15px;font-weight:600;margin-bottom:8px;color:#E06060">Access Restricted</div>'
      +'<div style="font-size:12px;color:rgba(255,255,255,.6);max-width:300px;margin:0 auto 18px">Please sign in to use the Permit to Work page.</div>'
      +'<a href="index.html" style="color:#C9A84C;font-size:12px;text-decoration:none;border:1px solid rgba(201,168,76,.4);padding:7px 16px;border-radius:6px">Return to Portal</a></div></div>';
  }
  if (typeof IMS_AUTH === 'undefined'){ blockPage(); }
  else {
    IMS_AUTH.init({ onReady: function(session){
      if (!allowed(session)){ blockPage(); return; }
      _me = (IMS_AUTH.getCurrentUserName && IMS_AUTH.getCurrentUserName()) || '';
      loadAll(function(){ renderMainList(); });
    }});
  }
})();
</script>
</body>
</html>
