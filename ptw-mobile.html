<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Permit to Work — SAGCO IMS</title>
<script src="auth.js"></script>
<script src="data.js"></script>
<style>
  :root{
    --pdw-bg:#0D1B35; --pdw-bg2:#142140; --pdw-bg3:#1a2a50;
    --pdw-gold:#C9A84C; --pdw-gold-lt:#E8C97A;
    --pdw-text:rgba(255,255,255,.92); --pdw-text-muted:rgba(255,255,255,.55);
    --pdw-text-dim:rgba(255,255,255,.35); --pdw-border:rgba(255,255,255,.08);
    --pdw-border-gold:rgba(201,168,76,.35);
    --pdw-blue:#5B9BD5; --pdw-red:#F0685C; --pdw-amb:#E8B339; --pdw-grn:#4FCB9E;
  }
  *{box-sizing:border-box}
  body{background:var(--pdw-bg); color:var(--pdw-text); margin:0; min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;}
  .pm-wrap{max-width:480px; margin:0 auto; padding:16px 16px 40px}
  .pm-header{display:flex; align-items:center; justify-content:space-between; padding:6px 2px 16px}
  .pm-header h1{font-size:16px; margin:0; color:var(--pdw-gold-lt); font-weight:700}
  .pm-header .pm-sub{font-size:10.5px; color:var(--pdw-text-muted); margin-top:2px}
  .pm-full-link{font-size:10.5px; color:var(--pdw-gold-lt); text-decoration:none; border:1px solid var(--pdw-border-gold);
    padding:5px 9px; border-radius:6px; white-space:nowrap}
  .pm-home-btn{display:flex; align-items:center; gap:14px; width:100%; background:var(--pdw-bg2); border:1px solid var(--pdw-border);
    border-radius:14px; padding:18px 16px; margin-bottom:12px; color:inherit; text-align:left; font-family:inherit; cursor:pointer}
  .pm-home-btn .pm-icon{font-size:28px; flex:0 0 auto}
  .pm-home-btn .pm-label{font-size:15px; font-weight:700}
  .pm-home-btn .pm-count{font-size:11.5px; color:var(--pdw-text-muted); margin-top:2px}
  .pm-home-btn.pm-primary{background:linear-gradient(135deg,var(--pdw-gold) 0%, #B08F3A 100%); color:#15223f; border:none}
  .pm-home-btn.pm-primary .pm-count{color:rgba(21,34,63,.65)}
  .pm-back{display:inline-flex; align-items:center; gap:5px; color:var(--pdw-gold-lt); font-size:12px; font-weight:600;
    text-decoration:none; background:none; border:none; padding:6px 0 14px; cursor:pointer; font-family:inherit}
  .pm-list-title{font-size:15px; font-weight:700; margin:0 0 4px}
  .pm-list-empty{font-size:12.5px; color:var(--pdw-text-muted); padding:30px 10px; text-align:center}
  .pm-card{background:var(--pdw-bg2); border:1px solid var(--pdw-border); border-radius:12px; padding:14px; margin-bottom:10px; cursor:pointer}
  .pm-card-viewonly{opacity:.78}
  .pm-card-justcreated{border:1px solid var(--pdw-gold); animation:pmNewGlow 2.4s ease-out 2}
  .pm-new-badge{display:inline-block; font-size:10px; font-weight:700; color:#15223f; background:var(--pdw-gold);
    padding:3px 8px; border-radius:20px; margin-bottom:8px}
  @keyframes pmNewGlow{ 0%{box-shadow:0 0 0 0 rgba(201,168,76,.55)} 100%{box-shadow:0 0 0 10px rgba(201,168,76,0)} }
  .pm-card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px}
  .pm-card-id{font-size:13.5px; font-weight:700}
  .pm-badge{font-size:10px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap}
  .pm-b-amber{background:rgba(232,179,57,.18); color:var(--pdw-amb)}
  .pm-b-blue{background:rgba(91,155,213,.18); color:var(--pdw-blue)}
  .pm-b-green{background:rgba(79,203,158,.18); color:var(--pdw-grn)}
  .pm-b-red{background:rgba(240,104,92,.18); color:var(--pdw-red)}
  .pm-b-grey{background:rgba(255,255,255,.08); color:var(--pdw-text-muted)}
  .pm-card-meta{font-size:12px; color:var(--pdw-text-muted); margin-top:6px; line-height:1.5}
  .pm-card-meta b{color:var(--pdw-text); font-weight:600}
  .pm-card-action{display:block; width:100%; margin-top:10px; padding:10px; border-radius:8px; border:none;
    font-size:13px; font-weight:700; text-align:center; cursor:pointer; font-family:inherit; text-decoration:none}
  .pm-act-main{background:var(--pdw-gold); color:#15223f}
  .pm-act-view{background:var(--pdw-bg3); color:var(--pdw-gold-lt); border:1px solid var(--pdw-border-gold)}
  .pm-pack-link{display:block; width:100%; margin-top:8px; padding:9px; border-radius:8px; text-align:center;
    font-size:12.5px; font-weight:700; text-decoration:none; background:var(--pdw-bg3); color:var(--pdw-gold-lt);
    border:1px solid var(--pdw-border-gold)}
  /* Rev.98 (Issam, voice, 2026-11-23) — tapping the status badge opens
     a short, dedicated form right here on the mobile page, for every
     approval stage — never a trip to the desktop register. Only the
     badge itself becomes a button when it's this person's own turn;
     everyone else still sees the plain, non-interactive badge. */
  .pm-badge-tap{border:none; cursor:pointer; font-family:inherit; position:relative}
  .pm-badge-tap::after{content:'›'; margin-left:3px; font-weight:900}
  .pm-modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:flex-end;
    justify-content:center; z-index:500}
  .pm-modal{background:var(--pdw-bg2); border:1px solid var(--pdw-border-gold); border-radius:16px 16px 0 0;
    padding:20px 16px 24px; width:100%; max-width:480px; max-height:88vh; overflow-y:auto}
  .pm-modal h3{margin:0 0 4px; font-size:15px; color:var(--pdw-gold-lt)}
  .pm-modal-sub{font-size:12px; color:var(--pdw-text-muted); margin-bottom:14px; line-height:1.5}
  .pm-modal-nav{display:flex; gap:10px; margin-top:16px}
  .pm-modal-nav button{flex:1; padding:12px; border-radius:9px; border:none; font-size:13.5px; font-weight:700;
    cursor:pointer; font-family:inherit}
  .pm-modal-confirm{background:var(--pdw-grn); color:#0d3321}
  .pm-modal-confirm:disabled{opacity:.4; cursor:not-allowed}
  .pm-modal-cancel{background:var(--pdw-bg3); color:var(--pdw-text); border:1px solid var(--pdw-border) !important}
  .pm-sig-canvas{width:100%; background:#fff; border:2px solid var(--pdw-border-gold); border-radius:8px;
    touch-action:none; cursor:crosshair; display:block}
  .pm-tbt-row{display:flex; gap:6px; align-items:center; margin-bottom:8px; padding:8px; border-radius:8px;
    border:1px solid var(--pdw-border); background:var(--pdw-bg3)}
  .pm-tbt-row input{flex:1 1 38%; min-width:0; background:var(--pdw-bg); border:1px solid var(--pdw-border);
    color:inherit; border-radius:6px; padding:8px; font-size:13px; font-family:inherit}
  .pm-tbt-row.pm-tbt-dup{border-color:var(--pdw-red)}
  .pm-tbt-dup-note{font-size:10.5px; color:var(--pdw-red); margin:-4px 0 8px 4px}
  .pm-tbt-sign-btn{white-space:nowrap; padding:8px 10px; border-radius:7px; border:none; font-size:12px;
    font-weight:700; cursor:pointer; font-family:inherit}
  .pm-tbt-signed{background:var(--pdw-grn); color:#0d3321}
  .pm-tbt-unsigned{background:var(--pdw-bg); color:var(--pdw-text); border:1px solid var(--pdw-border-gold)}
  .pm-tbt-remove{padding:8px 10px; border-radius:7px; border:none; background:var(--pdw-red); color:#fff;
    font-size:12px; font-weight:700; cursor:pointer}
  .pm-tbt-add{width:100%; padding:10px; border-radius:8px; border:1px dashed var(--pdw-border-gold);
    background:transparent; color:var(--pdw-gold-lt); font-size:13px; font-weight:700; cursor:pointer;
    font-family:inherit; margin-top:4px}
  .pm-close-blockers{padding:10px 12px; background:rgba(240,104,92,.12); border-left:3px solid var(--pdw-red);
    border-radius:0 8px 8px 0; font-size:12px; margin-bottom:10px; white-space:pre-line}
  .pm-step-dots{display:flex; gap:6px; justify-content:center; margin-bottom:16px}
  .pm-dot{width:8px; height:8px; border-radius:50%; background:var(--pdw-border)}
  .pm-dot.pm-active{background:var(--pdw-gold)}
  .pm-field{margin-bottom:14px}
  .pm-field label{display:block; font-size:12px; font-weight:600; margin-bottom:5px; color:var(--pdw-text-muted)}
  .pm-field input,.pm-field select,.pm-field textarea{width:100%; padding:11px 12px; font-size:14px; border-radius:8px;
    border:1px solid var(--pdw-border); background:var(--pdw-bg3); color:inherit; font-family:inherit}
  .pm-field input::placeholder,.pm-field textarea::placeholder{color:var(--pdw-text-dim)}
  .pm-step-nav{display:flex; gap:10px; margin-top:8px}
  .pm-step-nav button{flex:1; padding:13px; border-radius:9px; border:none; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit}
  .pm-btn-next{background:var(--pdw-gold); color:#15223f}
  .pm-btn-back{background:var(--pdw-bg2); color:var(--pdw-text); border:1px solid var(--pdw-border) !important}
  .pm-review-row{display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--pdw-border); font-size:13px}
  .pm-review-row span:first-child{color:var(--pdw-text-muted)}
  .pm-review-row span:last-child{font-weight:600; text-align:right}
  .pm-err{font-size:12px; color:var(--pdw-red); margin-top:6px; display:none}
  .pm-loading{text-align:center; padding:60px 10px; color:var(--pdw-text-muted); font-size:13px}
  .pm-chip-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
  .pm-chip{font-size:11px; font-weight:700; padding:6px 10px; border-radius:20px; text-decoration:none; white-space:nowrap}
  .pm-chip-done{background:rgba(79,203,158,.16); color:var(--pdw-grn); border:1px solid rgba(79,203,158,.4)}
  .pm-chip-todo{background:rgba(232,179,57,.16); color:var(--pdw-amb); border:1px solid rgba(232,179,57,.4)}
  .pm-chip-locked{background:rgba(255,255,255,.06); color:var(--pdw-text-dim); border:1px solid var(--pdw-border); cursor:not-allowed}
  /* Rev.100 (Issam, voice, 2026-11-23) — a visibly different colour
     from both done (green) and todo (amber): this permit is Active,
     and Hot Work's Execution/Post/Closure or LOTO's Reinstatement is
     still outstanding, which is also what's holding the permit back
     from being closed. */
  .pm-chip-continue{background:rgba(240,104,92,.18); color:var(--pdw-red); border:1px solid rgba(240,104,92,.5); font-weight:800}
  .pm-type-row{display:flex; align-items:center; gap:14px; width:100%; background:var(--pdw-bg2); border:1px solid var(--pdw-border);
    border-radius:14px; padding:16px; margin-bottom:10px; color:inherit; text-decoration:none; text-align:left; font-family:inherit; cursor:pointer}
  .pm-type-row .pm-icon{font-size:22px}
  .pm-type-row .pm-label{font-size:14px; font-weight:700}
  .pm-type-row .pm-meta{font-size:11px; color:var(--pdw-text-muted); margin-top:2px}
  /* Rev.86 — sticky search/filter/action bar for the full-screen
     permit list landing view. */
  .pm-sticky-top{position:sticky; top:0; z-index:5; background:var(--pdw-bg); padding-top:10px; margin:0 -16px; padding-left:16px; padding-right:16px;
    border-bottom:1px solid var(--pdw-border); padding-bottom:10px}
  .pm-top-actions{display:flex; gap:8px; margin-bottom:10px}
  .pm-mini-btn{flex:1; padding:11px 8px; border-radius:9px; border:1px solid var(--pdw-border-gold); background:var(--pdw-bg2);
    color:var(--pdw-gold-lt); font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit}
  .pm-mini-primary{background:linear-gradient(135deg,var(--pdw-gold) 0%, #B08F3A 100%); color:#15223f; border:none}
  .pm-search-input{width:100%; padding:10px 12px; font-size:16px; border-radius:9px; border:1px solid var(--pdw-border);
    background:var(--pdw-bg3); color:var(--pdw-text); font-family:inherit; margin-bottom:10px}
  .pm-search-input::placeholder{color:var(--pdw-text-dim)}
  .pm-fchip-row{display:flex; gap:7px; flex-wrap:wrap}
  .pm-fchip{padding:7px 12px; border-radius:20px; border:1px solid var(--pdw-border); background:var(--pdw-bg2);
    color:var(--pdw-text-muted); font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; white-space:nowrap}
  .pm-fchip-active{background:var(--pdw-gold); color:#15223f; border-color:var(--pdw-gold)}
  .pm-cb-grid{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .pm-cb-chip{padding:9px 13px; border-radius:20px; border:1px solid var(--pdw-border); background:var(--pdw-bg3);
    color:var(--pdw-text-muted); font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit}
  .pm-cb-chip-on{background:rgba(201,168,76,.22); color:var(--pdw-gold-lt); border-color:var(--pdw-gold)}
  .pm-cb-other{width:100%; margin-top:6px; padding:9px 10px; font-size:14px; border-radius:8px;
    border:1px solid var(--pdw-border-gold); background:var(--pdw-bg3); color:var(--pdw-text); font-family:inherit}
  .pm-cb-section-title{font-size:13px; font-weight:700; color:var(--pdw-gold-lt); margin:4px 0 8px}
</style>
</head>
<body>
<div class="pm-wrap" id="pm-root">
  <div class="pm-loading">Loading…</div>
</div>
<div id="pm-modal-root"></div>

<script>
(function(){
  var SHEETS_URL = window.SHEETS_URL;
  var REG_TAB = 'ptw_register', REG_ID = 'Permit ID';
  var root = document.getElementById('pm-root');

  var PTW_WORK_TYPES = [
    'Hot work','Cold work','Confined spaces','Working at height','Lifting',
    'Painting','Civil work','Pipeline works (LPG / Oil)','Electrical Repairs'
  ];
  // Rev.93 (Issam, voice, 2026-11-22) — same five checkbox-group
  // fields as the desktop register's own HSE-FRM-01 (English labels
  // only here — the desktop form's Arabic column isn't duplicated on
  // mobile), stored the identical way: a semicolon-joined string per
  // field, with a free "Others:" detail saved to its own "<Field> -
  // Other" companion column. Exact same label lists as PTW_EQUIPMENT /
  // PTW_HAZARDS / PTW_SAFETY_PRECAUTIONS / PTW_PPE / PTW_ISOLATION in
  // ptw-register.html.
  var PTW_EQUIPMENT = ['Welding m/c','Grinding m/c','Drilling m/c','Ladder','Gas cutting','Forklift','Scaffolding','Hand tools','Man lift','Crane','Chemicals','Others:'];
  var PTW_HAZARDS = ['Fire','High temperature/pressure','Electrical shock','Oxygen deficiency','Gas/chemical release','Slips & Trips','Others:'];
  var PTW_SAFETY_PRECAUTIONS = ['Eliminate flammable liquids/vapors','Remove or cover combustible materials','Cover the wall or floor openings','Floors swept & clean','Safety tags & locks','Fire extinguishers','Electrical isolation','Safe welding equipment','Fall protection','Warning signs','Safety attendant','Others:'];
  var PTW_PPE = ['Safety shoes','Welding mask','Hand gloves','Gum boots','Dust mask','Hard helmet','Ear protection','Chemical Mask','Goggles','Safety Harness','Breathing apparatus','Others:'];
  var PTW_ISOLATION = ['Electrical energy','Mechanical energy','Thermal energy','Gases','Hydraulic energy','Pneumatic energy'];

  var _reg = null, _issuers = null, _users = null, _me = '';
  // Rev.84 (Issam, voice, 2026-11-19) — the four checklist types that
  // have a mobile create flow so far (checklist-mobile.html); matches
  // permitNeeds*() on ptw-register.html exactly so a permit shows the
  // same checklist requirements here as it does on the full site.
  var _hw = null, _elec = null, _loto = null, _cs = null;
  var _crane = null, _scaffold = null, _harness = null, _paint = null, _civil = null, _pipe = null;
  function permitNeedsConfinedSpace(rec){ return /confined/i.test(String(rec['Work Involved']||'')); }
  function permitNeedsLoto(rec){
    if (String(rec['Service Isolation']||'').trim()) return true;
    return /electrical/i.test(String(rec['Work Involved']||''));
  }
  function permitNeedsHotWork(rec){ return /hot work/i.test(String(rec['Work Involved']||'')); }
  function permitNeedsElectrical(rec){ return /electrical/i.test(String(rec['Work Involved']||'')); }
  // Rev.85 (Issam, voice, 2026-11-20) — the six remaining checklist
  // types, matching ptw-register.html's own permitNeeds* exactly,
  // including Crane/Scaffold's shared "Height Access Method" split
  // and Harness applying to height work regardless of which method.
  function permitNeedsCrane(rec){
    var work = String(rec['Work Involved']||'');
    if (/lifting/i.test(work)) return true;
    return /height/i.test(work) && String(rec['Height Access Method']||'').trim() === 'Crane';
  }
  function permitNeedsScaffold(rec){
    var work = String(rec['Work Involved']||'');
    return /height/i.test(work) && String(rec['Height Access Method']||'').trim() === 'Scaffolding';
  }
  function permitNeedsHarness(rec){ return /height/i.test(String(rec['Work Involved']||'')); }
  function permitNeedsPainting(rec){ return /paint/i.test(String(rec['Work Involved']||'')); }
  function permitNeedsCivilWork(rec){ return /civil/i.test(String(rec['Work Involved']||'')); }
  function permitNeedsPipeline(rec){ return /pipeline/i.test(String(rec['Work Involved']||'')); }
  // Rev.98 (Issam, voice, 2026-11-23) — same list as ptw-register.html's
  // own HOT_WORK_PRE_ITEMS; keep both (and hot-work.html's,
  // google-apps-script.js's) in step if this ever changes.
  var HOT_WORK_PRE_ITEMS = [
    'Job Site Inspected For Flammables (Y/N/NA)','Work Area Free Of Explosive Atmospheres (Y/N/NA)','Hazardous Gas Assessment Conducted (Y/N/NA)',
    'Fire Extinguishers Available (Y/N/NA)','Firewatch Assigned And Equipped (Y/N/NA)','Sprinkler Systems Operational (Y/N/NA)','Fixed Fire Suppression Not Impaired (Y/N/NA)',
    'Combustibles Removed Or Shielded (Y/N/NA)','Fire-Resistant Blankets Or Shields Used (Y/N/NA)','Floor And Wall Openings Covered (Y/N/NA)','Work Area Within 35ft Cleared (Y/N/NA)','Flammable Containers Moved To Safe Distance (Y/N/NA)','Area Adequately Ventilated (Y/N/NA)',
    'Workers Trained In Hot Work Procedures (Y/N/NA)','Workers Provided Proper PPE (Y/N/NA)','Hearing Protection Available (Y/N/NA)','Respirators Provided If Needed (Y/N/NA)'
  ];

  function colIdx(headers, name){
    var out = -1;
    (headers||[]).forEach(function(h,i){ if(String(h).trim().toLowerCase()===String(name).toLowerCase()) out = i; });
    return out;
  }
  function recFromRow(headers, row){ var o={}; headers.forEach(function(h,i){ o[h]=row[i]; }); return o; }
  function esc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  // "1234 - Khaled Hassan" -> "Khaled Hassan" (same convention as the
  // desktop register's issuerDisplayNameFromField_).
  function displayNameFromField(v){
    var s = String(v||'').trim();
    var m = s.match(/^\s*[\w-]+\s*-\s*(.+)$/);
    return (m ? m[1] : s).trim();
  }
  function namesMatch(a, b){
    a = displayNameFromField(a).toLowerCase(); b = String(b||'').trim().toLowerCase();
    return !!a && !!b && a === b;
  }

  function fetchTab(tab){
    return fetch(SHEETS_URL + '?tab=' + tab + '&action=read').then(function(r){ return r.json(); })
      .then(function(data){ return (data && data.headers && data.rows) ? data : {headers:[],rows:[]}; })
      .catch(function(){ return {headers:[],rows:[]}; });
  }
  function loadAll(cb){
    // Rev.90 (Issam, voice, 2026-11-22) — this was fetching a tab
    // literally named 'issuers', which doesn't exist; the real
    // Authorized Issuers roster sheet is 'ptw_authorized_issuers'
    // (confirmed against ptw-register.html's own TABLES.issuers
    // config). That's why the Permit Issuer dropdown on New Permit —
    // and matchIssuerToMe_()/_amAuthorizedIssuer, which both depend on
    // this same fetch — came up empty.
    Promise.all([fetchTab(REG_TAB), fetchTab('ptw_authorized_issuers'), fetchTab('users'),
      fetchTab('hotwork_checklist'), fetchTab('electrical_checklist'), fetchTab('loto_register'), fetchTab('cs_entry'),
      fetchTab('crane_checklist'), fetchTab('scaffold_inspection'), fetchTab('harness_fall_protection'),
      fetchTab('painting_checklist'), fetchTab('civil_work_checklist'), fetchTab('pipeline_checklist')
    ]).then(function(r){
      _reg = r[0]; _issuers = r[1]; _users = r[2];
      _hw = r[3]; _elec = r[4]; _loto = r[5]; _cs = r[6];
      _crane = r[7]; _scaffold = r[8]; _harness = r[9];
      _paint = r[10]; _civil = r[11]; _pipe = r[12];
      // Rev.96 (Issam, voice, 2026-11-23) — the super admin account
      // counts as an authorized issuer as an exception, even when it
      // isn't itself listed on the ptw_authorized_issuers roster, so
      // it can take over any permit the same way another authorized
      // safety person can.
      var _mySessionRole = (typeof IMS_AUTH !== 'undefined' && IMS_AUTH.getRole) ? IMS_AUTH.getRole() : '';
      _amAuthorizedIssuer = !!matchIssuerToMe_() || _mySessionRole === 'superadmin';
      cb();
    });
  }
  function findLinkedRow_(tabData, permitId, idColName, ownIdCol){
    if (!tabData || !tabData.headers || !tabData.rows) return null;
    var numIdx = colIdx(tabData.headers, idColName||'PTW Number');
    var statusIdx = colIdx(tabData.headers, 'Record Status');
    var ownIdx = ownIdCol ? colIdx(tabData.headers, ownIdCol) : -1;
    var found = null;
    tabData.rows.forEach(function(row){
      if (statusIdx>=0 && String(row[statusIdx]||'').trim().toLowerCase()==='removed') return;
      if (numIdx>=0 && String(row[numIdx]||'').trim() === String(permitId).trim()){
        found = { row: row, headers: tabData.headers, id: ownIdx>=0 ? String(row[ownIdx]||'').trim() : '' };
      }
    });
    return found;
  }
  function fieldVal_(found, name){
    if (!found) return '';
    var idx = colIdx(found.headers, name);
    return idx>=0 ? String(found.row[idx]||'').trim() : '';
  }

  // Rev.84 — one compact chip row per permit card, covering the four

  function checklistChipsHtml(rec){

      // chip — and the permit can't be closed until the job is
      // actually Closed, so this gets its own colour too.
      var lotoClosed = lotoFound && fieldVal_(lotoFound,'Status') === 'Closed';
      if (String(rec['Status']||'').trim() === 'Active' && lReady && !lotoClosed){
        chips.push('<a class="pm-chip pm-chip-continue" href="checklist-mobile.html?type=loto_continue&permitId=' + encodeURIComponent(permitId) + '&lotoId=' + encodeURIComponent(lotoFound.id) + '" target="_blank">▶ Continue LOTO Reinstatement</a>');
      } else {

  function chip_(label, found, type, permitId, readyOverride, extraQS){

  // Rev.98 (Issam, voice, 2026-11-23) — tapping the status badge opens
  // a short, dedicated form right here, for whichever approval stage
  // is actually this person's own turn. Never a trip to the desktop
  // register — same fields, same columns, same gating as desktop,
  // just a lighter mobile layout, and landing back on this same list
  // (same filter/search) once saved.
  function approvalStage_(rec, role){
    var status = String(rec['Status']||'').trim();
    if (role === 'manager' && status === 'Awaiting Area Manager') return 'areaManager';
    if (role === 'controller' && status === 'Awaiting Controller') return 'controller';
    // Rev.101 (Issam, voice, 2026-11-23) — closing is now three steps
    // in order: the issuer initiates it (the checklist-completion
    // gate runs here), the receiver signs, then the Controller
    // approves and the permit actually becomes Closed.
    if (role === 'controller' && status === 'Awaiting Controller Closure') return 'controllerCloseApprove';
    if ((role === 'issuer' || role === 'other-issuer') && status === 'Active') return 'closeInitiate';
    if (role === 'receiver'){
      if (status === 'Awaiting Receiver Signature') return 'receiverSign';
      if (status === 'Awaiting Toolbox Talk') return 'toolboxTalk';
      if (status === 'Awaiting Closing Signature') return 'closingSign';
    }
    return null;
  }
  function afterApprovalSaved_(){

  // Ported from ptw-register.html's own openSignaturePad_ — same
  // drawn (not typed) signature capture, saved as a small PNG data
  // URL, just restyled to this page's pm- classes and modal root.
  function openSignaturePad_(title, subtitle, onSign, onCancel){
    var root = document.getElementById('pm-modal-root');
    var canvasW = Math.min(420, window.innerWidth - 48);
    var canvasH = 160;
    root.innerHTML = '<div class="pm-modal-bg"><div class="pm-modal">'
      + '<h3>' + esc(title) + '</h3>'
      + (subtitle ? '<div class="pm-modal-sub">' + esc(subtitle) + '</div>' : '')
      + '<div style="font-size:11px;color:var(--pdw-text-muted);margin-bottom:6px">Sign below with your finger or stylus.</div>'
      + '<canvas id="pm-sig-canvas" width="' + canvasW + '" height="' + canvasH + '" class="pm-sig-canvas" style="max-width:' + canvasW + 'px;height:' + canvasH + 'px"></canvas>'
      + '<div class="pm-modal-nav">'
        + '<button type="button" class="pm-modal-nav pm-modal-cancel" id="pm-sig-cancel" style="flex:1">Cancel</button>'
        + '<button type="button" class="pm-modal-nav pm-modal-cancel" id="pm-sig-clear" style="flex:1">Clear</button>'
        + '<button type="button" class="pm-modal-nav pm-modal-confirm" id="pm-sig-confirm" style="flex:1.4" disabled>Confirm Signature</button>'
      + '</div></div></div>';
    var canvas = document.getElementById('pm-sig-canvas');
    var ctx = canvas.getContext('2d');
    ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.strokeStyle = '#111';
    var drawing = false, hasDrawn = false, lastX = 0, lastY = 0;
    var confirmBtn = document.getElementById('pm-sig-confirm');
    function posFromEvent(e){
      var rect = canvas.getBoundingClientRect();
      var scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
      var cx = e.touches ? e.touches[0].clientX : e.clientX;
      var cy = e.touches ? e.touches[0].clientY : e.clientY;
      return { x:(cx-rect.left)*scaleX, y:(cy-rect.top)*scaleY };
    }
    function start(e){ e.preventDefault(); drawing = true; var p = posFromEvent(e); lastX = p.x; lastY = p.y; }
    function move(e){
      if (!drawing) return; e.preventDefault();
      var p = posFromEvent(e);
      ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
      lastX = p.x; lastY = p.y;
      if (!hasDrawn){ hasDrawn = true; confirmBtn.disabled = false; }
    }
    function end(){ drawing = false; }
    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start, { passive:false });
    canvas.addEventListener('touchmove', move, { passive:false });
    canvas.addEventListener('touchend', end);
    document.getElementById('pm-sig-clear').onclick = function(){
      ctx.clearRect(0,0,canvas.width,canvas.height); hasDrawn = false; confirmBtn.disabled = true;
    };
    document.getElementById('pm-sig-cancel').onclick = function(){ root.innerHTML = ''; if (onCancel) onCancel(); };
    confirmBtn.onclick = function(){
      if (!hasDrawn) return;
      var dataUrl = canvas.toDataURL('image/png');
      root.innerHTML = '';
      onSign(dataUrl);
    };
  }
  // 1. Receiver's first signature — mirrors

  // 2. Toolbox Talk — mirrors ptw-register.html's own
  // promptToolboxTalk_ exactly: a name, an ID/badge number and a
  // drawn signature per attendee, duplicates blocked, each attendee
  // also written to its own toolbox_talk_attendees row, and the same
  // ladder decision (another checklist still outstanding sends it
  // back to Waiting, otherwise straight on to Area Manager).
  function openToolboxTalkModal_(permitId, rec){
    var attendees = [];
    function normName(s){ return String(s||'').trim().toLowerCase(); }
    function duplicateIndexes(){
      var dup = {};
      attendees.forEach(function(a,i){
        var n = normName(a.name), d = normName(a.idNum);
        attendees.forEach(function(b,j){
          if (i === j) return;
          if (n && n === normName(b.name)){ dup[i]=true; dup[j]=true; }
          if (d && d === normName(b.idNum)){ dup[i]=true; dup[j]=true; }
        });
      });
      return dup;
    }
    function isComplete(){
      if (!attendees.length) return false;
      var dup = duplicateIndexes();
      return attendees.every(function(a,i){ return a.name.trim() && a.idNum.trim() && a.sigDataUrl && !dup[i]; });
    }

      var root = document.getElementById('pm-modal-root');

          + '<input type="text" data-i="'+i+'" data-f="name" value="'+esc(a.name)+'" placeholder="Full name">'
          + '<input type="text" data-i="'+i+'" data-f="idNum" value="'+esc(a.idNum)+'" placeholder="ID / Badge #">'
          + (a.sigDataUrl
            ? '<button type="button" class="pm-tbt-sign-btn pm-tbt-signed" data-i="'+i+'">✓ Signed</button>'
            : '<button type="button" class="pm-tbt-sign-btn pm-tbt-unsigned" data-i="'+i+'">Sign</button>')
          + '<button type="button" class="pm-tbt-remove" data-i="'+i+'">✕</button>'
          + '</div>'
          + (isDup ? '<div class="pm-tbt-dup-note">This name or ID matches another attendee already in the list.</div>' : '');
      }).join('');
      var complete = isComplete();
      root.innerHTML = '<div class="pm-modal-bg"><div class="pm-modal">'
        + '<h3>Toolbox Talk — ' + esc(permitId) + '</h3>'
        + '<div class="pm-modal-sub">Add every attendee with their name, ID/badge number, and signature. Duplicate names or IDs are blocked. This becomes the permit\'s official Number of Workers.</div>'
        + '<div id="pm-tbt-rows">' + (rowsHtml || '<div style="font-size:12px;opacity:.6;padding:8px 0">No attendees yet.</div>') + '</div>'
        + '<button type="button" class="pm-tbt-add" id="pm-tbt-add">+ Add Attendee</button>'
        + '<div style="font-size:11px;margin-top:8px;opacity:.7">' + attendees.length + (attendees.length===1?' attendee':' attendees') + '</div>'
        + '<div class="pm-modal-nav">'
          + '<button type="button" class="pm-modal-cancel" id="pm-tbt-cancel">Cancel</button>'
          + '<button type="button" class="pm-modal-confirm" id="pm-tbt-confirm" ' + (complete?'':'disabled') + '>Record Toolbox Talk</button>'
        + '</div></div></div>';
      root.querySelectorAll('input[data-f]').forEach(function(inp){
        inp.addEventListener('input', function(){
          var i = parseInt(inp.getAttribute('data-i'),10);
          attendees[i][inp.getAttribute('data-f')] = inp.value;
          var dupNow = duplicateIndexes();
          root.querySelectorAll('.pm-tbt-row').forEach(function(rowEl, idx){ rowEl.classList.toggle('pm-tbt-dup', !!dupNow[idx]); });
          var cb = document.getElementById('pm-tbt-confirm');
          cb.disabled = !isComplete();
        });
      });
      root.querySelectorAll('.pm-tbt-unsigned, .pm-tbt-signed').forEach(function(btn){
        btn.onclick = function(){
          var i = parseInt(btn.getAttribute('data-i'),10);
          var who = attendees[i].name || 'Attendee';
          openSignaturePad_(
            'Attendee Signature — ' + who,
            'Please sign to confirm attendance at this toolbox talk.',
            function(dataUrl){ attendees[i].sigDataUrl = dataUrl; attendees[i].signedAt = new Date().toLocaleString(); render(); },
            function(){ render(); }
          );
        };
      });
      root.querySelectorAll('.pm-tbt-remove').forEach(function(btn){
        btn.onclick = function(){ var i = parseInt(btn.getAttribute('data-i'),10); attendees.splice(i,1); render(); };
      });
      document.getElementById('pm-tbt-add').onclick = function(){ attendees.push({name:'',idNum:'',sigDataUrl:'',signedAt:''}); render(); };
      document.getElementById('pm-tbt-cancel').onclick = function(){ root.innerHTML = ''; };

        if (!isComplete()) return;

        var tbtDate = new Date().toLocaleString();
        var payload = { 'Toolbox Talk Attendees': names.join(', '), 'Toolbox Talk Date': tbtDate, 'Number of Workers': String(attendees.length) };
        payload['Status'] = checklistWaitingNames_mobile_(rec).length ? 'Waiting' : 'Awaiting Area Manager';

      if (!name) return;
      var composite = id ? (id + ' - ' + name) : name;
      opts += '<option value="' + esc(composite) + '"' + (composite===_new.issuer?' selected':'') + '>' + esc(composite) + '</option>';
    });
    return opts;
  }
  // Rev.83 (Issam, 2026-11-19) — the Permit Issuer dropdown always
  // started on "— select —", with nothing pointing it at whoever was
  // actually filling in the form, so people had to find their own
  // name in the list by hand. This looks the logged-in user up
  // against the Authorized Issuers roster (same list the dropdown
  // itself is built from) and returns their "ID - Name" composite if
  // found, or '' if they aren't on that roster at all — which is then
  // reported as its own, visible state rather than silently left on
  // "— select —" with no explanation.
  function matchIssuerToMe_(){
    if (!_issuers || !_issuers.rows) return '';
    var nIdx = colIdx(_issuers.headers, 'Name'), hIdx = colIdx(_issuers.headers, 'Employee ID');
    var sIdx = colIdx(_issuers.headers, 'Record Status');
    var meLower = String(_me||'').trim().toLowerCase();
    if (!meLower) return '';
    var match = null;
    _issuers.rows.forEach(function(r){
      if (sIdx>=0 && String(r[sIdx]||'').trim().toLowerCase()==='removed') return;
      var name = nIdx>=0 ? String(r[nIdx]||'').trim() : '';
      if (name.toLowerCase() === meLower) match = r;
    });
    if (!match) return '';
    var id = hIdx>=0 ? String(match[hIdx]||'').trim() : '';
    var name = nIdx>=0 ? String(match[nIdx]||'').trim() : '';
    return id ? (id + ' - ' + name) : name;
  }
  function roleOptionsHtml(filterFn, selectedName){
    var nameIdx = colIdx(_users.headers, 'Full Name'), name2Idx = colIdx(_users.headers, 'Name');
    var emailIdx = colIdx(_users.headers, 'Email'), roleIdx = colIdx(_users.headers, 'Role'), titleIdx = colIdx(_users.headers, 'Job Title');
    var statusIdx = colIdx(_users.headers, 'Account Status');
    var seen = {}; var opts = '<option value="" data-email="">— select —</option>';
    _users.rows.forEach(function(r){
      if (statusIdx>=0){ var st = String(r[statusIdx]||'active').trim().toLowerCase(); if (st && st!=='active') return; }
      var name = (nameIdx>=0 && r[nameIdx]) || (name2Idx>=0 && r[name2Idx]) || '';
      name = String(name).trim();
      var email = emailIdx>=0 ? String(r[emailIdx]||'').trim() : '';
      var role = roleIdx>=0 ? String(r[roleIdx]||'').trim() : '';
      var title = titleIdx>=0 ? String(r[titleIdx]||'').trim() : '';
      if (!name || !email || seen[name.toLowerCase()]) return;
      if (!filterFn(role, title)) return;
      seen[name.toLowerCase()] = true;
      opts += '<option value="' + esc(name) + '" data-email="' + esc(email) + '"' + (name.toLowerCase()===String(selectedName||'').toLowerCase()?' selected':'') + '>' + esc(name) + ' (' + esc(email) + ')</option>';
    });
    return opts;
  }
  function isManager(role, title){ return /manager/i.test(role) || /manager/i.test(title) || /superadmin|admin/i.test(role); }
  function isSafety(role, title){ return /safety|hse/i.test(role) || /safety|hse|controller/i.test(title) || /superadmin|admin/i.test(role); }

  function renderNew1(){
    root.innerHTML = header() + '<button type="button" class="pm-back" onclick="PM.go(\'home\')">← Cancel</button>'
      + dots(0)
      + '<div class="pm-field"><label>Area <span style="color:var(--pdw-red)">*</span></label><input id="pm-f-area" list="pm-dl-area" value="' + esc(_new.area) + '" placeholder="e.g. Unit 4"></div>'
      + buildDatalist_('pm-dl-area', 'Area')
      + '<div class="pm-field"><label>Location</label><input id="pm-f-location" list="pm-dl-location" value="' + esc(_new.location) + '" placeholder="e.g. Batch House, Switchgear Room"></div>'
      + buildDatalist_('pm-dl-location', 'Location')
      + '<div class="pm-field"><label>Work Involved <span style="color:var(--pdw-red)">*</span></label><select id="pm-f-work" onchange="PM.onWorkInvolvedChange(this.value)">'
        + '<option value="">— select —</option>'
        + PTW_WORK_TYPES.map(function(w){ return '<option value="'+esc(w)+'"'+(w===_new.workInvolved?' selected':'')+'>'+esc(w)+'</option>'; }).join('')
      + '</select></div>'
      // Rev.92 (Issam, voice, 2026-11-22) — only shown for Working at
      // height, same as the desktop register's own field: it decides
      // whether the Crane Inspection or the Scaffold Inspection chip
      // is required (Harness applies to height work either way, so
      // isn't affected by this choice).
      + '<div class="pm-field" id="pm-f-ham-wrap" style="display:' + (_new.workInvolved === 'Working at height' ? 'block' : 'none') + '">'
        + '<label>Height Access Method <span style="color:var(--pdw-red)">*</span></label>'
        + '<select id="pm-f-ham">'
          + ['', 'Crane', 'Scaffolding'].map(function(o){ return '<option value="'+o+'"'+(o===_new.heightAccessMethod?' selected':'')+'>'+(o||'— select —')+'</option>'; }).join('')
        + '</select></div>'
      + '<div class="pm-field"><label>Name of Project / Job</label><input id="pm-f-project" value="' + esc(_new.projectName) + '" placeholder="Optional"></div>'
      + '<div class="pm-field"><label>Contracting Company</label><input id="pm-f-contractor" value="' + esc(_new.contractingCompany) + '" placeholder="Optional — if any"></div>'
      + '<div class="pm-field"><label>Description of Work</label><textarea id="pm-f-desc" rows="3" placeholder="Brief description">' + esc(_new.description) + '</textarea></div>'
      + '<div class="pm-err" id="pm-err1">Please fill in Area, Work Involved, and Height Access Method.</div>'
      + '<div class="pm-step-nav"><button type="button" class="pm-btn-next" onclick="PM.toStepEquip()">Next →</button></div>';
  }
  // Rev.93 (Issam, voice, 2026-11-22) — Equipment & Tools, Potential
  // Hazards, Safety Precautions and PPE Required, the same single
  // "Equipment, Hazards & Precautions" grouping the desktop modal
  // uses, as one scrollable mobile step rather than four separate
  // ones (consistent with how LOTO's five isolation points or Hot
  // Work's sections already read as one step with several groups).
  function renderNewEquip(){
    root.innerHTML = header() + '<button type="button" class="pm-back" onclick="PM.backFromEquip()">← Back</button>'
      + dots(1)
      + '<div class="pm-list-title" style="margin-bottom:10px">Equipment, Hazards &amp; Precautions</div>'
      + '<div class="pm-cb-section-title">Equipment &amp; Tools</div>' + cbChipsHtml_('Equipment & Tools', PTW_EQUIPMENT)
      + '<div class="pm-cb-section-title">Potential Hazards</div>' + cbChipsHtml_('Potential Hazards', PTW_HAZARDS)
      + '<div class="pm-cb-section-title">Safety Precautions</div>' + cbChipsHtml_('Safety Precautions', PTW_SAFETY_PRECAUTIONS)
      + '<div class="pm-cb-section-title">PPE Required</div>' + cbChipsHtml_('PPE Required', PTW_PPE)
      + '<div class="pm-err" id="pm-err-equip">Please specify what "Others" means for the ticked group(s) above.</div>'
      + '<div class="pm-step-nav"><button type="button" class="pm-btn-back" onclick="PM.backFromEquip()">← Back</button><button type="button" class="pm-btn-next" onclick="PM.toStepIsolation()">Next →</button></div>';
  }
  function renderNewIsolation(){
    root.innerHTML = header() + '<button type="button" class="pm-back" onclick="PM.backFromIsolation()">← Back</button>'
      + dots(2)
      + '<div class="pm-list-title" style="margin-bottom:4px">Service Isolation</div>'
      + '<div style="font-size:11.5px;color:var(--pdw-text-muted);margin-bottom:14px">Tick any energy source that needs isolating before work starts. Ticking any one of these also raises a LOTO Job for this permit.</div>'
      + cbChipsHtml_('Service Isolation', PTW_ISOLATION)
      + '<div class="pm-step-nav"><button type="button" class="pm-btn-back" onclick="PM.backFromIsolation()">← Back</button><button type="button" class="pm-btn-next" onclick="PM.toStep2()">Next →</button></div>';
  }
  // The "Others:" detail text for whichever group(s) are on this
  // screen — read at step-advance time, same pattern Area/Location
  // already use, since a plain text input doesn't need a live
  // listener to stay in sync with _new.
  function captureOtherFields_(){
    document.querySelectorAll('.pm-cb-other').forEach(function(inp){
      _new.cbOther[inp.getAttribute('data-othergroup')] = inp.value.trim();
    });
  }
  function missingOtherDetail_(){
    var missing = [];
    Object.keys(_new.cb).forEach(function(g){
      if (_new.cb[g].indexOf('Others:') > -1 && !String(_new.cbOther[g]||'').trim()) missing.push(g);
    });
    return missing;
  }
  function renderNew2(){
    // Rev.83 — only attempts the auto-match while the field is still
    // genuinely unset, so it never overwrites an issuer the person
    // already picked themselves (including on a Back/Next round trip
    // through this step, or a deliberate pick of someone else's name
    // during training).
    var issuerNotOnRoster = false;
    if (!_new.issuer){
      var matched = matchIssuerToMe_();
      if (matched) _new.issuer = matched;
      else issuerNotOnRoster = true;
    }
    var issuerNote = issuerNotOnRoster
      ? '<div style="font-size:11px;color:var(--pdw-amb);margin:-8px 0 12px">You (' + esc(_me) + ') are not on the Authorized Issuers list — pick the correct issuer below, or ask your IMS Coordinator to add you.</div>'
      : '';
    root.innerHTML = header() + '<button type="button" class="pm-back" onclick="PM.backFromStep2()">← Back</button>'
      + dots(3)
      + '<div class="pm-field"><label>Permit Issuer <span style="color:var(--pdw-red)">*</span></label><select id="pm-f-issuer">' + issuerOptionsHtml() + '</select></div>'
      + issuerNote
      + '<div class="pm-field"><label>Permit Receiver (name) <span style="color:var(--pdw-red)">*</span></label><input id="pm-f-receiver" list="pm-dl-receiver" value="' + esc(_new.receiver) + '" placeholder="Full name"></div>'
      + buildDatalist_('pm-dl-receiver', 'Permit Receiver - Name')
      + '<div class="pm-field"><label>Unit / Area Manager <span style="color:var(--pdw-red)">*</span></label><select id="pm-f-um">' + roleOptionsHtml(isManager, _new.unitManager) + '</select></div>'
      + '<div class="pm-field"><label>Permit Controller (Safety) <span style="color:var(--pdw-red)">*</span></label><select id="pm-f-ctrl">' + roleOptionsHtml(isSafety, _new.controller) + '</select></div>'
      + '<div class="pm-err" id="pm-err2">Please fill in every required field above.</div>'
      + '<div class="pm-step-nav"><button type="button" class="pm-btn-back" onclick="PM.backFromStep2()">← Back</button><button type="button" class="pm-btn-next" onclick="PM.toStep3()">Review →</button></div>';
  }
  // Rev.83 (Issam, 2026-11-19) — whatever is on screen is saved into
  // _new before leaving this step, exactly like toStep3() already
  // does going forward. Without this, going Back from Step 2 and then
  // Next again silently reverted every field here (issuer included)
  // to what it was when the step was first rendered — so a deliberate
  // pick, like choosing someone else's name while training, was lost
  // on a simple Back/Next round trip.
  function captureStep2Values_(){
    _new.issuer = document.getElementById('pm-f-issuer').value;
    _new.receiver = document.getElementById('pm-f-receiver').value.trim();
    var umSel = document.getElementById('pm-f-um'), ctrlSel = document.getElementById('pm-f-ctrl');
    _new.unitManager = umSel.value;
    _new.unitManagerEmail = umSel.selectedOptions[0] ? umSel.selectedOptions[0].getAttribute('data-email') : '';
    _new.controller = ctrlSel.value;
    _new.controllerEmail = ctrlSel.selectedOptions[0] ? ctrlSel.selectedOptions[0].getAttribute('data-email') : '';
  }
  function renderNew3(){
    var rows = [
      ['Area', _new.area], ['Location', _new.location || '—'], ['Work Involved', _new.workInvolved]
    ];
    if (_new.heightAccessMethod) rows.push(['Height Access Method', _new.heightAccessMethod]);
    if (_new.projectName) rows.push(['Name of Project / Job', _new.projectName]);
    if (_new.contractingCompany) rows.push(['Contracting Company', _new.contractingCompany]);
    rows.push(['Description', _new.description || '—']);
    ['Equipment & Tools','Potential Hazards','Safety Precautions','PPE Required','Service Isolation'].forEach(function(g){
      var picked = _new.cb[g].slice();
      var othersIdx = picked.indexOf('Others:');
      if (othersIdx > -1) picked[othersIdx] = 'Others: ' + (_new.cbOther[g]||'');
      if (picked.length) rows.push([g, picked.join(', ')]);
    });
    rows = rows.concat([
      ['Issuer', _new.issuer], ['Receiver', _new.receiver],
      ['Unit Manager', _new.unitManager], ['Controller', _new.controller]
    ]);
    root.innerHTML = header() + '<button type="button" class="pm-back" onclick="PM.backToPeople()">← Back</button>'
      + dots(4)
      + '<div class="pm-list-title" style="margin-bottom:8px">Review</div>'
      + rows.map(function(r){ return '<div class="pm-review-row"><span>'+esc(r[0])+'</span><span>'+esc(r[1])+'</span></div>'; }).join('')
      + '<div style="font-size:11px;color:var(--pdw-text-muted);margin-top:10px">The permit will be created with a 12-hour validity window starting now, and will immediately ask the Receiver to sign.</div>'
      + '<div class="pm-step-nav" style="margin-top:14px"><button type="button" class="pm-btn-back" onclick="PM.backToPeople()">← Back</button><button type="button" class="pm-btn-next" id="pm-create-btn" onclick="PM.createPermit()">Create Permit</button></div>';
  }
  function dots(activeIdx){
    var html = '<div class="pm-step-dots">';
    for (var i=0;i<5;i++) html += '<div class="pm-dot' + (i===activeIdx?' pm-active':'') + '"></div>';
    return html + '</div>';
  }

  function nextSequentialId(){
    var idIdx = colIdx(_reg.headers, REG_ID);
    if (idIdx < 0) return 'PTW-0001';
    var maxN = 0;
    _reg.rows.forEach(function(r){
      var v = String(r[idIdx]||'').trim();
      if (v.toLowerCase().indexOf('ptw-') !== 0) return;
      var n = parseInt(v.slice(4), 10);
      if (!isNaN(n) && n > maxN) maxN = n;
    });
    var nextN = maxN + 1;
    var numStr = String(nextN);
    while (numStr.length < 4) numStr = '0' + numStr;
    return 'PTW-' + numStr;
  }
  function toDatetimeLocalValue(d){
    function pad(n){ return String(n).padStart(2,'0'); }
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function postJSON(action, params, body){
    var qs = Object.keys(params).map(function(k){ return k+'='+encodeURIComponent(params[k]); }).join('&');
    return fetch(SHEETS_URL + '?action=' + action + '&' + qs, { method:'POST', body: JSON.stringify(body) }).then(function(r){ return r.json(); });
  }

  window.PM = {
    go: function(view){
      if (view === 'home') renderMainList();
      else if (view === 'mine') renderList('mine');
      else if (view === 'approvals') renderList('approvals');
      else if (view === 'new1') renderNew1();
      else if (view === 'checklists') renderChecklistPicker();
    },
    setListFilter: function(key){ _justCreatedId = ''; _listFilter = key; renderMainList(); },
    scrollToJustCreated: function(){
      var el = document.getElementById('pm-just-created');
      if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
    },
    // Rev.87/98 — tapping anywhere on a card opens the permit; tapping
    // an actual link or button inside it (the action button, a
    // checklist chip, the tappable status badge) lets that element's
    // own handler run instead, so this never double-opens or hijacks
    // a chip's or badge's own destination.
    cardTap: function(ev, url){
      if (ev.target.closest('a') || ev.target.closest('button')) return;
      window.open(url, '_blank');
    },
    openApproval: function(permitId){
      var rec = regRecords().find(function(r){ return String(r['Permit ID']) === String(permitId); });
      if (!rec) return;
      var stage = approvalStage_(rec, myRoleOnPermit_(rec));
      if (!stage) return;
      if (stage === 'receiverSign') openReceiverSignModal_(permitId, rec);
      else if (stage === 'toolboxTalk') openToolboxTalkModal_(permitId, rec);
      else if (stage === 'areaManager') openAreaManagerModal_(permitId, rec);
      else if (stage === 'controller') openControllerModal_(permitId, rec);
      else if (stage === 'closeInitiate') openCloseInitiateModal_(permitId, rec);
      else if (stage === 'closingSign') openClosingSignModal_(permitId, rec);
      else if (stage === 'controllerCloseApprove') openControllerCloseApproveModal_(permitId, rec);
    },
    onSearchInput: function(val){
      // only the list below redraws — '#pm-search' itself is never
      // touched, so typing keeps its focus and cursor naturally.
      _justCreatedId = '';
      _listSearch = val;
      renderListBody_();
    },
    pickChecklistType: function(key){
      window._pmCkType = key;
      document.querySelectorAll('.pm-type-row').forEach(function(el){ el.style.opacity = '.5'; });
      document.getElementById('pm-ck-permit-field').style.display = 'block';
      document.getElementById('pm-ck-go-row').style.display = 'flex';
      document.getElementById('pm-ck-permit').focus();
    },
    goToChecklist: function(){
      var pid = document.getElementById('pm-ck-permit').value.trim();
      if (!pid){ alert('Enter the Permit ID this checklist is for.'); return; }
      window.open('checklist-mobile.html?type=' + encodeURIComponent(window._pmCkType) + '&permitId=' + encodeURIComponent(pid), '_blank');
    },
    onWorkInvolvedChange: function(val){
      var wrap = document.getElementById('pm-f-ham-wrap');
      if (wrap) wrap.style.display = (val === 'Working at height') ? 'block' : 'none';
    },
    toStepEquip: function(){
      _new.area = document.getElementById('pm-f-area').value.trim();
      _new.location = document.getElementById('pm-f-location').value.trim();
      _new.workInvolved = document.getElementById('pm-f-work').value;
      var hamEl = document.getElementById('pm-f-ham');
      _new.heightAccessMethod = (_new.workInvolved === 'Working at height' && hamEl) ? hamEl.value : '';
      _new.projectName = document.getElementById('pm-f-project').value.trim();
      _new.contractingCompany = document.getElementById('pm-f-contractor').value.trim();
      _new.description = document.getElementById('pm-f-desc').value.trim();
      var needsHam = _new.workInvolved === 'Working at height';
      if (!_new.area || !_new.workInvolved || (needsHam && !_new.heightAccessMethod)){ document.getElementById('pm-err1').style.display = 'block'; return; }
      renderNewEquip();
    },
    toggleCbChip: function(btn){
      var group = btn.getAttribute('data-group'), val = btn.getAttribute('data-val');
      var arr = _new.cb[group];
      var idx = arr.indexOf(val);
      var nowOn;
      if (idx > -1){ arr.splice(idx,1); nowOn = false; } else { arr.push(val); nowOn = true; }
      btn.classList.toggle('pm-cb-chip-on', nowOn);
      if (/^others:?$/i.test(val.trim())){
        var otherInput = document.getElementById('pm-other-' + group.replace(/[^a-zA-Z0-9]/g,''));
        if (otherInput) otherInput.style.display = nowOn ? 'block' : 'none';
      }
    },
    backFromEquip: function(){ captureOtherFields_(); renderNew1(); },
    toStepIsolation: function(){
      captureOtherFields_();
      var missing = missingOtherDetail_();
      var errEl = document.getElementById('pm-err-equip');
      if (missing.length){ errEl.style.display = 'block'; return; }
      renderNewIsolation();
    },
    backFromIsolation: function(){ renderNewEquip(); },
    toStep2: function(){ renderNew2(); },
    // Rev.93 — fixes a pre-existing dead click: the Review screen's
    // "← Back" called PM.go('new2'), but 'new2' was never a route go()
    // recognised, so that button did nothing at all before this fix.
    backToPeople: function(){ renderNew2(); },
    toStep3: function(){
      captureStep2Values_();
      if (!_new.issuer || !_new.receiver || !_new.unitManager || !_new.controller){ document.getElementById('pm-err2').style.display = 'block'; return; }
      renderNew3();
    },
    backFromStep2: function(){
      captureStep2Values_();
      renderNewIsolation();
    },
    createPermit: function(){
      var btn = document.getElementById('pm-create-btn');
      btn.disabled = true; btn.textContent = 'Creating…';
      var id = nextSequentialId();
      var now = new Date();
      var validTo = new Date(now.getTime() + 12*60*60*1000);
      var values = {
        'Permit ID': id,
        'Date': now.toISOString().slice(0,10),
        'Permit Created At': now.toLocaleString(),
        'Area': _new.area,
        'Location': _new.location,
        'Work Involved': _new.workInvolved,
        'Height Access Method': _new.heightAccessMethod,
        'Name of Project / Job': _new.projectName,
        'Contracting Company': _new.contractingCompany,
        'Description of Work': _new.description,
        'Equipment & Tools': _new.cb['Equipment & Tools'].join('; '),
        'Equipment & Tools - Other': _new.cbOther['Equipment & Tools'],
        'Potential Hazards': _new.cb['Potential Hazards'].join('; '),
        'Potential Hazards - Other': _new.cbOther['Potential Hazards'],
        'Safety Precautions': _new.cb['Safety Precautions'].join('; '),
        'Safety Precautions - Other': _new.cbOther['Safety Precautions'],
        'PPE Required': _new.cb['PPE Required'].join('; '),
        'PPE Required - Other': _new.cbOther['PPE Required'],
        'Service Isolation': _new.cb['Service Isolation'].join('; '),
        'Permit Issuer - Name': _new.issuer,
        'Permit Receiver - Name': _new.receiver,
        'Unit Manager': _new.unitManager,
        'Unit Manager Email': _new.unitManagerEmail,
        'Permit Controller': _new.controller,
        'Permit Controller Email': _new.controllerEmail,
        'Permit Valid From': toDatetimeLocalValue(now),
        'Permit Valid To': toDatetimeLocalValue(validTo),
        'Status': 'Awaiting Receiver Signature',
        'Record Status': 'Active'
      };
      postJSON('write', {tab: REG_TAB}, [values]).then(function(res){
        if (res && res.status === 'error'){
          alert('Could not create the permit: ' + (res.message||'unknown error'));
          btn.disabled = false; btn.textContent = 'Create Permit';
          return;
        }
        // Rev.94 — back to the list itself, not off to the desktop
        // register in a new tab: reload so the new permit is actually
        // in the data (it didn't exist yet when this session's data
        // was first fetched), land on "All" with no search so nothing
        // hides it, and highlight + scroll to it so its next step is
        // immediately visible.
        _justCreatedId = id;
        _listFilter = 'all';
        _listSearch = '';
        loadAll(function(){
          renderMainList();
          PM.scrollToJustCreated();
        });
      }).catch(function(){
        alert('Could not reach the server — check your connection and try again.');
        btn.disabled = false; btn.textContent = 'Create Permit';
      });
    }
  };

  function allowed(s){ return !!s; }
  function blockPage(){
    document.body.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0D1B35;color:#fff;text-align:center;padding:40px">'
      +'<div><div style="font-size:15px;font-weight:600;margin-bottom:8px;color:#E06060">Access Restricted</div>'
      +'<div style="font-size:12px;color:rgba(255,255,255,.6);max-width:300px;margin:0 auto 18px">Please sign in to use the Permit to Work page.</div>'
      +'<a href="index.html" style="color:#C9A84C;font-size:12px;text-decoration:none;border:1px solid rgba(201,168,76,.4);padding:7px 16px;border-radius:6px">Return to Portal</a></div></div>';
  }
  if (typeof IMS_AUTH === 'undefined'){ blockPage(); }
  else {
    IMS_AUTH.init({ onReady: function(session){
      if (!allowed(session)){ blockPage(); return; }
      _me = (IMS_AUTH.getCurrentUserName && IMS_AUTH.getCurrentUserName()) || '';
      loadAll(function(){ renderMainList(); });
    }});
  }
})();
</script>
</body>
