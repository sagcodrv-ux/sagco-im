<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAGCO IMS — Annual Activities Calendar</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="auth.js"></script>
<script src="data.js"></script>
<script src="nav.js"></script>
<style>
.kd-wrap{
  --kd-bg:#080D20; --kd-card:#141D35; --kd-card2:#192440; --kd-border:#293653;
  --kd-text:#F1F5FF; --kd-text-lt:#8996B2;
  --kd-purple:#8855F7; --kd-cyan:#36C9E8; --kd-teal:#16C7A5; --kd-green:#42D9A0; --kd-blue:#438DF5;
  --kd-red:#F45B69; --kd-amber:#F5A623;
  background:var(--kd-bg); color:var(--kd-text); font-family:'Inter',Arial,sans-serif;
  margin:-24px; padding:24px; min-height:100vh;
}
.kd-wrap *{box-sizing:border-box}
.kd-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;margin-bottom:18px}
.kd-title{font-size:20px;font-weight:800;letter-spacing:-.2px}
.kd-subtitle{font-size:12px;color:var(--kd-text-lt);margin-top:4px}
.kd-sync{font-size:10px;color:var(--kd-text-lt);display:flex;align-items:center;gap:6px}
.kd-sync-dot{width:6px;height:6px;border-radius:50%;background:var(--kd-green);animation:kd-pulse 2s infinite}
@keyframes kd-pulse{0%,100%{opacity:1}50%{opacity:.3}}
.kd-edit-badge{font-size:9.5px;font-weight:700;padding:4px 10px;border-radius:14px;display:flex;align-items:center;gap:5px}
.kd-edit-on{background:rgba(66,217,160,.15);color:var(--kd-green)}
.kd-edit-off{background:rgba(137,150,178,.15);color:var(--kd-text-lt)}

.cal-legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.cal-chip{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--kd-text-lt);
  background:var(--kd-card2);border:1px solid var(--kd-border);border-radius:20px;padding:5px 12px;cursor:pointer;transition:all .15s}
.cal-chip:hover{border-color:var(--kd-purple)}
.cal-chip.active{color:var(--kd-text);border-color:var(--kd-purple)}
.cal-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

.cal-grid-wrap{background:var(--kd-card);border:1px solid var(--kd-border);border-radius:14px;overflow-x:auto;margin-bottom:18px}
.cal-grid{display:grid;grid-template-columns:36px repeat(12,minmax(78px,1fr));min-width:1100px}
.cal-cell{border-bottom:1px solid var(--kd-border);border-right:1px solid var(--kd-border);
  padding:4px 5px;min-height:34px;position:relative;transition:background .1s}
.cal-cell.cal-dropzone.cal-dragover{background:rgba(136,85,247,.18)}
.cal-cell.cal-dropzone.cal-invalid{background:rgba(244,91,105,.18)}
.cal-head{position:sticky;top:0;background:var(--kd-card2);font-size:10px;font-weight:700;
  text-align:center;padding:8px 4px;color:var(--kd-text-lt);text-transform:uppercase;letter-spacing:.4px;z-index:2}
.cal-daynum{font-size:9px;color:var(--kd-text-lt);text-align:center;background:var(--kd-card2)}
.cal-event{font-size:8.5px;font-weight:600;border-radius:4px;padding:2px 4px;margin-bottom:2px;
  color:#0A0E1F;line-height:1.3;cursor:pointer}
.cal-event.cal-draggable{cursor:grab}
.cal-event.cal-draggable:active{cursor:grabbing}
.cal-event.cal-dragging{opacity:.4}
.cal-cell.gf-hidden .cal-event{display:none}

.tbc-panel{background:var(--kd-card);border:1px solid var(--kd-border);border-radius:14px;padding:18px}
.tbc-panel-title{font-size:12px;font-weight:700;margin-bottom:12px}
.tbc-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--kd-border)}
.tbc-row:last-child{border-bottom:none}
.tbc-name{font-size:11.5px;font-weight:600}
.tbc-note{font-size:10px;color:var(--kd-text-lt);margin-top:2px}
.tbc-month{font-size:10px;color:var(--kd-amber);font-weight:700;flex-shrink:0}

.kd-modal-overlay{display:none;position:fixed;inset:0;background:rgba(4,7,20,.72);z-index:9000;align-items:center;justify-content:center;padding:20px}
.kd-modal-overlay.open{display:flex}
.kd-modal{background:var(--kd-card);border:1px solid var(--kd-border);border-radius:16px;max-width:440px;width:100%;padding:22px;font-family:'Inter',Arial,sans-serif;color:var(--kd-text)}
.kd-modal-close{float:right;background:var(--kd-card2);border:1px solid var(--kd-border);color:var(--kd-text-lt);width:26px;height:26px;border-radius:8px;cursor:pointer}

.kd-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--kd-card2);border:1px solid var(--kd-border);color:var(--kd-text);
  padding:11px 20px;border-radius:10px;font-size:12px;font-weight:600;z-index:9500;
  opacity:0;transition:all .25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.kd-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.kd-toast.kd-toast-ok{border-color:var(--kd-green)}
.kd-toast.kd-toast-err{border-color:var(--kd-red)}
</style>
</head>
<body>
<div class="main"><div id="tb"></div><div class="content">
<div class="kd-wrap">

  <div class="kd-header">
    <div>
      <div class="kd-title">Annual Activities Calendar — 2026</div>
      <div class="kd-subtitle">All IMS-wide recurring and one-off activities in one view · sourced live from each register</div>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="kd-edit-badge" id="kd-edit-badge">Checking permissions…</span>
      <div class="kd-sync"><span class="kd-sync-dot"></span><span id="kd-sync-text">Connecting to live data…</span></div>
    </div>
  </div>

  <div class="cal-legend" id="cal-legend"></div>

  <div class="cal-grid-wrap">
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <div class="tbc-panel">
    <div class="tbc-panel-title">⏳ Confirmed but date-TBC / pending from register owners</div>
    <div id="tbc-list"></div>
  </div>

</div>
</div></div>

<div class="kd-modal-overlay" id="kd-modal-overlay">
  <div class="kd-modal" id="kd-modal-body"></div>
</div>
<div class="kd-toast" id="kd-toast"></div>

<script>
initPage('ims-calendar.html');
document.getElementById('tb').innerHTML = renderTopbar('Annual Activities Calendar','IMS-wide · Live from Audit, Training, Calibration, ESG, Governance registers');
IMS_AUTH.injectUserBar();
</script>

<script>
var SEED = {"events": [{"id": "CAL-01", "name": "T\u00dcV Austria Stage 1 Audit", "category": "certification", "month": 8, "day": 25, "endDay": 26, "status": "Completed", "note": "Stage 1 completed 25\u201326 Aug 2026"}, {"id": "CAL-02", "name": "T\u00dcV Austria Stage 2 Audit", "category": "certification", "month": 9, "day": 22, "endDay": 26, "status": "Completed", "note": "Stage 2 window 22\u201326 Sep 2026"}, {"id": "CAL-03", "name": "WG-03 Meeting #6 (OH Surveillance)", "category": "meeting", "month": 9, "day": 8, "endDay": null, "status": "Completed", "note": "Working Group 3 governance meeting"}, {"id": "CAL-04", "name": "Management Review MR-2026-01", "category": "mgmtreview", "month": 9, "day": 19, "endDay": null, "status": "Completed", "note": "Hard gate input for Stage 2"}], "tbc": [{"name": "EcoVadis Silver Submission", "category": "esg", "month": 11, "note": "Exact submission day not yet confirmed"}, {"name": "Internal Audit Programme \u2014 10 planned audits", "category": "audit", "month": null, "note": "Scheduling in progress \u2014 exact dates owned by Audit Programme (Sh.20)"}, {"name": "Annual Training Plan", "category": "training", "month": null, "note": "Exact dates owned by Training Register (Sh.16)"}, {"name": "Calibration Due Dates (WBGT, Audiometry)", "category": "calibration", "month": null, "note": "Pending Procurement \u2014 exact dates owned by Calibration Register (Sh.54)"}]};

var CATEGORIES = {
  certification: { label: 'Certification / Audit (External)', color: '#8855F7' },
  audit:         { label: 'Internal Audit',                    color: '#36C9E8' },
  mgmtreview:    { label: 'Management Review',                 color: '#438DF5' },
  meeting:       { label: 'Governance Meeting',                color: '#F5A623' },
  training:      { label: 'Training',                          color: '#16C7A5' },
  calibration:   { label: 'Calibration',                       color: '#42D9A0' },
  esg:           { label: 'ESG / EcoVadis',                    color: '#F45B69' }
};

var MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
var DAYS_IN_MONTH = [31,28,31,30,31,30,31,31,30,31,30,31];

var STATE = { events: SEED.events, tbc: SEED.tbc, activeCategory: 'all', canEdit: false, dragEventId: null };

/* ── Permission check — role 'editor' and above (IMS Manager's actual
   assigned role, shared with SHEE Head / QA Manager / Energy Manager) ── */
function checkEditPermission() {
  try {
    var role = IMS_AUTH.getRole();
    STATE.canEdit = IMS_AUTH.roleAtLeast(role, 'editor');
  } catch (e) { STATE.canEdit = false; }
  var badge = document.getElementById('kd-edit-badge');
  if (STATE.canEdit) {
    badge.className = 'kd-edit-badge kd-edit-on'; badge.textContent = '✏️ Edit mode — drag events to reschedule';
  } else {
    badge.className = 'kd-edit-badge kd-edit-off'; badge.textContent = '👁 Read-only — sign in as Editor or above to reschedule';
  }
}

function showToast(msg, isError) {
  var t = document.getElementById('kd-toast');
  t.textContent = msg;
  t.className = 'kd-toast show ' + (isError ? 'kd-toast-err' : 'kd-toast-ok');
  setTimeout(function () { t.className = 'kd-toast'; }, 3200);
}

function renderLegend() {
  var html = '<div class="cal-chip active" data-cat="all">All categories</div>';
  Object.keys(CATEGORIES).forEach(function (key) {
    var c = CATEGORIES[key];
    html += '<div class="cal-chip" data-cat="'+key+'"><span class="cal-dot" style="background:'+c.color+'"></span>'+c.label+'</div>';
  });
  document.getElementById('cal-legend').innerHTML = html;
  document.querySelectorAll('.cal-chip').forEach(function (chip) {
    chip.addEventListener('click', function () {
      document.querySelectorAll('.cal-chip').forEach(function (c) { c.classList.remove('active'); });
      chip.classList.add('active');
      STATE.activeCategory = chip.getAttribute('data-cat');
      renderGrid();
    });
  });
}

function eventsFor(month, day) {
  return STATE.events.filter(function (e) {
    if (STATE.activeCategory !== 'all' && e.category !== STATE.activeCategory) return false;
    if (e.month !== month) return false;
    var end = e.endDay || e.day;
    return day >= e.day && day <= end;
  });
}

function renderGrid() {
  var grid = document.getElementById('cal-grid');
  var html = '<div class="cal-cell cal-head"></div>';
  MONTHS.forEach(function (m) { html += '<div class="cal-cell cal-head">'+m+'</div>'; });

  for (var day = 1; day <= 31; day++) {
    html += '<div class="cal-cell cal-daynum">'+day+'</div>';
    for (var m = 1; m <= 12; m++) {
      if (day > DAYS_IN_MONTH[m-1]) { html += '<div class="cal-cell" style="background:var(--kd-bg);opacity:.3"></div>'; continue; }
      var evs = eventsFor(m, day);
      var cellHtml = evs.map(function (e) {
        var color = CATEGORIES[e.category] ? CATEGORIES[e.category].color : '#8996B2';
        var dragAttr = STATE.canEdit ? ' draggable="true" ondragstart="onDragStart(event,\''+e.id+'\')" ondragend="onDragEnd(event)"' : '';
        var cls = 'cal-event' + (STATE.canEdit ? ' cal-draggable' : '');
        return '<div class="'+cls+'" style="background:'+color+'"'+dragAttr+' onclick="openEvent(\''+e.id+'\')" title="'+e.name+'">'+e.name+'</div>';
      }).join('');
      html += '<div class="cal-cell cal-dropzone" data-month="'+m+'" data-day="'+day+'">'+cellHtml+'</div>';
    }
  }
  grid.innerHTML = html;
  if (STATE.canEdit) wireDropzones();
}

function onDragStart(ev, eventId) {
  STATE.dragEventId = eventId;
  ev.target.classList.add('cal-dragging');
  ev.dataTransfer.effectAllowed = 'move';
}
function onDragEnd(ev) { ev.target.classList.remove('cal-dragging'); }

function wireDropzones() {
  document.querySelectorAll('.cal-dropzone').forEach(function (zone) {
    zone.addEventListener('dragover', function (ev) {
      ev.preventDefault();
      var month = parseInt(zone.getAttribute('data-month'), 10);
      var day = parseInt(zone.getAttribute('data-day'), 10);
      var valid = day <= DAYS_IN_MONTH[month-1];
      zone.classList.add('cal-dragover');
      zone.classList.toggle('cal-invalid', !valid);
    });
    zone.addEventListener('dragleave', function () {
      zone.classList.remove('cal-dragover','cal-invalid');
    });
    zone.addEventListener('drop', function (ev) {
      ev.preventDefault();
      zone.classList.remove('cal-dragover','cal-invalid');
      var newMonth = parseInt(zone.getAttribute('data-month'), 10);
      var newDay = parseInt(zone.getAttribute('data-day'), 10);
      if (newDay > DAYS_IN_MONTH[newMonth-1]) { showToast('That date doesn\'t exist — move cancelled', true); return; }
      handleReschedule(STATE.dragEventId, newMonth, newDay);
    });
  });
}

function handleReschedule(eventId, newMonth, newDay) {
  var ev = STATE.events.filter(function (e) { return e.id === eventId; })[0];
  if (!ev) return;
  var oldMonth = ev.month, oldDay = ev.day;
  if (oldMonth === newMonth && oldDay === newDay) return; /* dropped back on itself */

  var duration = ev.endDay ? (ev.endDay - ev.day) : 0;
  var newEndDay = ev.endDay ? (newDay + duration) : null;
  if (newEndDay && newEndDay > DAYS_IN_MONTH[newMonth-1]) {
    showToast('Move would push the end date past the end of the month — cancelled', true);
    return;
  }

  /* Optimistic UI update */
  ev.month = newMonth; ev.day = newDay; if (ev.endDay) ev.endDay = newEndDay;
  renderGrid();

  if (typeof SHEETS_URL === 'undefined' || !SHEETS_URL) {
    showToast('Moved locally — no live sheet connection to save to', true);
    return;
  }

  var updates = { 'Month': String(newMonth), 'Day': String(newDay) };
  if (newEndDay) updates['End Day'] = String(newEndDay);

  fetch(SHEETS_URL + '?action=update&tab=ims_calendar&idCol=' + encodeURIComponent('Event ID') + '&id=' + encodeURIComponent(eventId), {
    method: 'POST',
    body: JSON.stringify(updates)
  })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (res && res.status === 'ok') {
        showToast('"' + ev.name + '" moved to ' + MONTHS[newMonth-1] + ' ' + newDay + ' — saved to sheet');
      } else {
        ev.month = oldMonth; ev.day = oldDay; ev.endDay = ev.endDay ? (oldDay + duration) : null;
        renderGrid();
        showToast('Could not save — ' + (res && res.message ? res.message : 'unknown error') + '. Move reverted.', true);
      }
    })
    .catch(function () {
      ev.month = oldMonth; ev.day = oldDay; ev.endDay = ev.endDay ? (oldDay + duration) : null;
      renderGrid();
      showToast('Connection failed — move reverted', true);
    });
}

function renderTbc() {
  var html = STATE.tbc.map(function (e) {
    var monthLabel = e.month ? MONTHS[e.month-1] + ' 2026' : 'Date TBC';
    return '<div class="tbc-row"><div><div class="tbc-name">'+e.name+'</div><div class="tbc-note">'+e.note+'</div></div><div class="tbc-month">'+monthLabel+'</div></div>';
  }).join('');
  document.getElementById('tbc-list').innerHTML = html || '<div class="tbc-note">Nothing pending.</div>';
}

function openEvent(eventId) {
  var e = STATE.events.filter(function (x) { return x.id === eventId; })[0];
  if (!e) return;
  var cat = CATEGORIES[e.category];
  var dateLabel = MONTHS[e.month-1] + ' ' + e.day + (e.endDay ? '–' + e.endDay : '') + ', 2026';
  document.getElementById('kd-modal-body').innerHTML =
    '<button class="kd-modal-close" onclick="closeEvent()">✕</button>'
    + '<div style="font-size:16px;font-weight:800;margin-bottom:6px">'+e.name+'</div>'
    + '<div style="font-size:11px;color:#8996B2;margin-bottom:14px">'+dateLabel+'</div>'
    + '<div style="display:inline-block;background:'+cat.color+';color:#0A0E1F;font-size:10px;font-weight:700;padding:3px 10px;border-radius:10px;margin-bottom:12px">'+cat.label+'</div>'
    + '<div style="font-size:12px;line-height:1.6">'+e.note+'</div>'
    + '<div style="font-size:11px;color:#8996B2;margin-top:10px">Status: '+e.status+'</div>'
    + (STATE.canEdit ? '<div style="font-size:10px;color:#8996B2;margin-top:14px;font-style:italic">Tip: close this and drag the event on the grid to reschedule it.</div>' : '');
  document.getElementById('kd-modal-overlay').classList.add('open');
}
function closeEvent() { document.getElementById('kd-modal-overlay').classList.remove('open'); }
document.getElementById('kd-modal-overlay').addEventListener('click', function (e) { if (e.target === this) closeEvent(); });

checkEditPermission();
renderLegend();
renderGrid();
renderTbc();

/* ── Live fetch: overlay real events from the ims_calendar sheet tab ──
   Falls back to the seed data above (only confirmed real dates) if that
   tab doesn't exist yet or returns nothing — never fabricates events. */
setTimeout(function () {
  if (typeof SHEETS_URL === 'undefined' || !SHEETS_URL) {
    document.getElementById('kd-sync-text').textContent = 'No data connection configured — showing confirmed dates only';
    return;
  }
  fetch(SHEETS_URL + '?action=read&tab=ims_calendar')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data || !data.rows || !data.rows.length) {
        document.getElementById('kd-sync-text').textContent = 'ims_calendar tab not yet created — showing confirmed dates only';
        return;
      }
      var hdr = data.headers;
      function col(name) {
        var n = name.toLowerCase();
        for (var i=0;i<hdr.length;i++) if (String(hdr[i]||'').toLowerCase().trim()===n) return i;
        return -1;
      }
      var idCol = col('Event ID'), nameCol = col('Event Name'), catCol = col('Category'), monthCol = col('Month'),
          dayCol = col('Day'), endCol = col('End Day'), statCol = col('Status'), noteCol = col('Notes');

      var liveEvents = data.rows.map(function (row) {
        var month = parseInt(row[monthCol], 10), day = parseInt(row[dayCol], 10);
        if (!month || !day) return null; /* skip rows with no confirmed day — never guess */
        return {
          id: idCol>=0 ? String(row[idCol]||'').trim() : ('ROW-'+Math.random()),
          name: String(row[nameCol]||'').trim(),
          category: String(row[catCol]||'').trim().toLowerCase(),
          month: month, day: day,
          endDay: endCol>=0 ? (parseInt(row[endCol],10) || null) : null,
          status: statCol>=0 ? String(row[statCol]||'').trim() : '',
          note: noteCol>=0 ? String(row[noteCol]||'').trim() : ''
        };
      }).filter(Boolean);

      if (liveEvents.length) {
        STATE.events = liveEvents;
        renderGrid();
      }
      document.getElementById('kd-sync-text').textContent = 'Live — synced ' + new Date().toLocaleTimeString();
    })
    .catch(function () {
      document.getElementById('kd-sync-text').textContent = 'Connection unavailable — showing confirmed dates only';
    });
}, 400);
</script>
</body>
</html>
