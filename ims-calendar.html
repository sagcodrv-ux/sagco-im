<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAGCO IMS — Annual Activities Calendar</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="auth.js"></script>
<script src="data.js"></script>
<script src="nav.js"></script>
<style>
.kd-wrap{
  --kd-bg:#080D20; --kd-card:#141D35; --kd-card2:#192440; --kd-border:#293653;
  --kd-text:#F1F5FF; --kd-text-lt:#8996B2; --kd-placeholder:#5A6C8A;
  --kd-purple:#8855F7; --kd-cyan:#36C9E8; --kd-teal:#16C7A5; --kd-green:#42D9A0; --kd-blue:#438DF5;
  --kd-red:#F45B69; --kd-amber:#F5A623;
  background:var(--kd-bg); color:var(--kd-text); font-family:'Inter',Arial,sans-serif;
  margin:-24px; padding:24px; min-height:100vh;
}
.kd-wrap *{box-sizing:border-box}
.kd-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;margin-bottom:14px}
.kd-title{font-size:20px;font-weight:800;letter-spacing:-.2px}
.kd-subtitle{font-size:12px;color:var(--kd-text-lt);margin-top:4px}
.kd-sync{font-size:10px;color:var(--kd-text-lt);display:flex;align-items:center;gap:6px}
.kd-sync-dot{width:6px;height:6px;border-radius:50%;background:var(--kd-green);animation:kd-pulse 2s infinite}
@keyframes kd-pulse{0%,100%{opacity:1}50%{opacity:.3}}
.kd-edit-badge{font-size:9.5px;font-weight:700;padding:4px 10px;border-radius:14px;display:flex;align-items:center;gap:5px}
.kd-edit-on{background:rgba(66,217,160,.15);color:var(--kd-green)}
.kd-edit-off{background:rgba(137,150,178,.15);color:var(--kd-text-lt)}

.kd-toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.kd-year-group{display:flex;align-items:center;gap:8px}
.kd-select{background:var(--kd-card2);border:1px solid var(--kd-border);color:var(--kd-text);
  font-family:inherit;font-size:13px;font-weight:700;padding:8px 12px;border-radius:8px;cursor:pointer}
.kd-select option{background:var(--kd-card2);color:var(--kd-text)}
.kd-btn{background:var(--kd-purple);color:#fff;border:none;font-family:inherit;font-size:11.5px;font-weight:700;
  padding:9px 16px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:opacity .15s}
.kd-btn:hover{opacity:.88}
.kd-btn-ghost{background:var(--kd-card2);color:var(--kd-text);border:1px solid var(--kd-border)}
.kd-btn-danger{background:rgba(244,91,105,.15);color:var(--kd-red);border:1px solid var(--kd-red)}
.kd-btn-danger:hover{background:rgba(244,91,105,.28);opacity:1}
.kd-btn:disabled{opacity:.35;cursor:not-allowed}

.cal-legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.cal-chip{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--kd-text-lt);
  background:var(--kd-card2);border:1px solid var(--kd-border);border-radius:20px;padding:5px 12px;cursor:pointer;transition:all .15s}
.cal-chip:hover{border-color:var(--kd-purple)}
.cal-chip.active{color:var(--kd-text);border-color:var(--kd-purple)}
.cal-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cal-chip-toggle{margin-left:auto}

.cal-grid-wrap{background:var(--kd-card);border:1px solid var(--kd-border);border-radius:14px;overflow-x:auto;margin-bottom:18px}
.cal-grid{display:grid;grid-template-columns:36px repeat(12,minmax(78px,1fr));min-width:1100px}
.cal-cell{border-bottom:1px solid var(--kd-border);border-right:1px solid var(--kd-border);
  padding:4px 5px;min-height:34px;position:relative;transition:background .1s}
.cal-cell.cal-dropzone.cal-dragover{background:rgba(136,85,247,.18)}
.cal-cell.cal-dropzone.cal-invalid{background:rgba(244,91,105,.18)}
.cal-head{position:sticky;top:0;background:var(--kd-card2);font-size:10px;font-weight:700;
  text-align:center;padding:8px 4px;color:var(--kd-text-lt);text-transform:uppercase;letter-spacing:.4px;z-index:2}
.cal-daynum{font-size:9px;color:var(--kd-text-lt);text-align:center;background:var(--kd-card2)}
.cal-event{font-size:8.5px;font-weight:600;border-radius:4px;padding:2px 4px;margin-bottom:2px;
  color:#0A0E1F;line-height:1.3;cursor:pointer}
.cal-event.cal-cancelled{opacity:.45;text-decoration:line-through}
.cal-event.cal-draggable{cursor:grab}
.cal-event.cal-draggable:active{cursor:grabbing}
.cal-event.cal-dragging{opacity:.4}
.cal-cell.gf-hidden .cal-event{display:none}

.tbc-panel{background:var(--kd-card);border:1px solid var(--kd-border);border-radius:14px;padding:18px}
.tbc-panel-title{font-size:12px;font-weight:700;margin-bottom:12px}
.tbc-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--kd-border)}
.tbc-row:last-child{border-bottom:none}
.tbc-name{font-size:11.5px;font-weight:600}
.tbc-note{font-size:10px;color:var(--kd-text-lt);margin-top:2px}
.tbc-month{font-size:10px;color:var(--kd-amber);font-weight:700;flex-shrink:0}

.kd-modal-overlay{display:none;position:fixed;inset:0;background:rgba(4,7,20,.72);z-index:9000;align-items:center;justify-content:center;padding:20px}
.kd-modal-overlay.open{display:flex}
.kd-modal{background:var(--kd-card);border:1px solid var(--kd-border);border-radius:16px;max-width:460px;width:100%;
  max-height:88vh;overflow-y:auto;padding:22px;font-family:'Inter',Arial,sans-serif;color:var(--kd-text)}
.kd-modal-close{float:right;background:var(--kd-card2);border:1px solid var(--kd-border);color:var(--kd-text-lt);width:26px;height:26px;border-radius:8px;cursor:pointer}
.kd-form-row{margin-bottom:14px}
.kd-form-row label{display:block;font-size:10.5px;font-weight:700;color:#AEB9D4;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.kd-form-row label .req{color:var(--kd-red);margin-left:3px}
.kd-form-row-split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kd-input,.kd-form-select,.kd-textarea{width:100%;background:var(--kd-card2);border:1.5px solid var(--kd-border);
  color:var(--kd-text);font-family:inherit;font-size:12.5px;padding:10px 12px;border-radius:8px;transition:border-color .15s,background .15s}
.kd-input::placeholder,.kd-textarea::placeholder{color:var(--kd-placeholder)}
.kd-input:focus,.kd-form-select:focus,.kd-textarea:focus{outline:none;border-color:var(--kd-purple);background:#1c2748}
.kd-form-select option{background:#1c2748;color:var(--kd-text)}
.kd-textarea{resize:vertical;min-height:60px}
.kd-form-error{font-size:11px;color:var(--kd-red);margin-top:10px;display:none}
.kd-form-actions{display:flex;gap:8px;margin-top:16px}
.kd-form-actions .kd-btn{flex:1;justify-content:center}
.kd-modal-title{font-size:16px;font-weight:800;margin-bottom:16px}

.kd-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--kd-card2);border:1px solid var(--kd-border);color:var(--kd-text);
  padding:11px 20px;border-radius:10px;font-size:12px;font-weight:600;z-index:9500;
  opacity:0;transition:all .25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.kd-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.kd-toast.kd-toast-ok{border-color:var(--kd-green)}
.kd-toast.kd-toast-err{border-color:var(--kd-red)}
</style>
</head>
<body>
<div class="main"><div id="tb"></div><div class="content">
<div class="kd-wrap">

  <div class="kd-header">
    <div>
      <div class="kd-title">Annual Activities Calendar</div>
      <div class="kd-subtitle">All IMS-wide recurring and one-off activities in one view · sourced live from each register</div>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="kd-edit-badge" id="kd-edit-badge">Checking permissions…</span>
      <div class="kd-sync"><span class="kd-sync-dot"></span><span id="kd-sync-text">Connecting to live data…</span></div>
    </div>
  </div>

  <div class="kd-toolbar">
    <div class="kd-year-group">
      <select class="kd-select" id="kd-year-select"></select>
      <button class="kd-btn kd-btn-ghost" id="kd-add-year-btn" title="Add a future year to the list">+ Add Year</button>
    </div>
    <button class="kd-btn" id="kd-add-event-btn" style="display:none">+ Add Event</button>
  </div>

  <div class="cal-legend" id="cal-legend"></div>

  <div class="cal-grid-wrap">
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <div class="tbc-panel">
    <div class="tbc-panel-title">⏳ Confirmed but date-TBC / pending from register owners</div>
    <div id="tbc-list"></div>
  </div>

</div>
</div></div>

<div class="kd-modal-overlay" id="kd-modal-overlay">
  <div class="kd-modal" id="kd-modal-body"></div>
</div>
<div class="kd-toast" id="kd-toast"></div>

<script>
initPage('ims-calendar.html');
document.getElementById('tb').innerHTML = renderTopbar('Annual Activities Calendar','IMS-wide · Live from Audit, Training, Calibration, ESG, Governance registers');
IMS_AUTH.injectUserBar();
</script>

<script>
var SEED = {"events": [{"id": "CAL-01", "name": "T\u00dcV Austria Stage 1 Audit", "category": "certification", "year": 2026, "startMonth": 8, "startDay": 25, "endMonth": 8, "endDay": 26, "status": "Completed", "note": "Stage 1 completed 25\u201326 Aug 2026"}, {"id": "CAL-02", "name": "T\u00dcV Austria Stage 2 Audit", "category": "certification", "year": 2026, "startMonth": 9, "startDay": 22, "endMonth": 9, "endDay": 26, "status": "Completed", "note": "Stage 2 window 22\u201326 Sep 2026"}, {"id": "CAL-03", "name": "WG-03 Meeting #6 (OH Surveillance)", "category": "meeting", "year": 2026, "startMonth": 9, "startDay": 8, "endMonth": 9, "endDay": 8, "status": "Completed", "note": "Working Group 3 governance meeting"}, {"id": "CAL-04", "name": "Management Review MR-2026-01", "category": "mgmtreview", "year": 2026, "startMonth": 9, "startDay": 19, "endMonth": 9, "endDay": 19, "status": "Completed", "note": "Hard gate input for Stage 2"}], "tbc": [{"name": "EcoVadis Silver Submission", "category": "esg", "year": 2026, "month": 11, "note": "Exact submission day not yet confirmed"}, {"name": "Internal Audit Programme \u2014 10 planned audits", "category": "audit", "year": 2026, "month": null, "note": "Scheduling in progress \u2014 exact dates owned by Audit Programme (Sh.20)"}, {"name": "Annual Training Plan", "category": "training", "year": 2026, "month": null, "note": "Exact dates owned by Training Register (Sh.16)"}, {"name": "Calibration Due Dates (WBGT, Audiometry)", "category": "calibration", "year": 2026, "month": null, "note": "Pending Procurement \u2014 exact dates owned by Calibration Register (Sh.54)"}]};

var CATEGORIES = {
  certification: { label: 'Certification / Audit (External)', color: '#8855F7' },
  audit:         { label: 'Internal Audit',                    color: '#36C9E8' },
  mgmtreview:    { label: 'Management Review',                 color: '#438DF5' },
  meeting:       { label: 'Governance Meeting',                color: '#F5A623' },
  training:      { label: 'Training',                          color: '#16C7A5' },
  calibration:   { label: 'Calibration',                       color: '#42D9A0' },
  esg:           { label: 'ESG / EcoVadis',                    color: '#F45B69' }
};
var STATUSES = ['Planned','Confirmed','In Progress','Completed','Cancelled'];
var MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
var MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var CURRENT_YEAR = 2026;

var STATE = {
  events: SEED.events, tbc: SEED.tbc,
  activeCategory: 'all', canEdit: false, dragEventId: null,
  selectedYear: CURRENT_YEAR,
  availableYears: [2025,2026,2027,2028],
  showCancelled: false
};

function daysInMonth(year, month) { return new Date(year, month, 0).getDate(); }
function ordinal(year, month, day) { return Math.floor((new Date(year, month-1, day) - new Date(year,0,1)) / 86400000); }

function checkEditPermission() {
  try { STATE.canEdit = IMS_AUTH.roleAtLeast(IMS_AUTH.getRole(), 'editor'); } catch (e) { STATE.canEdit = false; }
  var badge = document.getElementById('kd-edit-badge');
  if (STATE.canEdit) {
    badge.className = 'kd-edit-badge kd-edit-on'; badge.textContent = '✏️ Edit mode — drag, add, edit or cancel events';
    document.getElementById('kd-add-event-btn').style.display = 'flex';
  } else {
    badge.className = 'kd-edit-badge kd-edit-off'; badge.textContent = '👁 Read-only — sign in as Editor or above to edit';
  }
}

function showToast(msg, isError) {
  var t = document.getElementById('kd-toast');
  t.textContent = msg;
  t.className = 'kd-toast show ' + (isError ? 'kd-toast-err' : 'kd-toast-ok');
  setTimeout(function () { t.className = 'kd-toast'; }, 3200);
}

function renderYearSelect() {
  var sel = document.getElementById('kd-year-select');
  var years = STATE.availableYears.slice().sort(function(a,b){return a-b;});
  sel.innerHTML = years.map(function (y) { return '<option value="'+y+'"'+(y===STATE.selectedYear?' selected':'')+'>'+y+' Calendar</option>'; }).join('');
  sel.onchange = function () { STATE.selectedYear = parseInt(this.value, 10); renderGrid(); renderTbc(); };
}
document.getElementById('kd-add-year-btn').addEventListener('click', function () {
  var input = prompt('Add a new year to the calendar (e.g. 2029):');
  if (!input) return;
  var y = parseInt(input, 10);
  if (!y || y < 2020 || y > 2100) { showToast('Enter a valid 4-digit year', true); return; }
  if (STATE.availableYears.indexOf(y) === -1) STATE.availableYears.push(y);
  STATE.selectedYear = y;
  renderYearSelect(); renderGrid(); renderTbc();
  showToast('Year '+y+' added — start adding events to it with "+ Add Event"');
});

function renderLegend() {
  var html = '<div class="cal-chip active" data-cat="all">All categories</div>';
  Object.keys(CATEGORIES).forEach(function (key) {
    var c = CATEGORIES[key];
    html += '<div class="cal-chip" data-cat="'+key+'"><span class="cal-dot" style="background:'+c.color+'"></span>'+c.label+'</div>';
  });
  html += '<label class="cal-chip cal-chip-toggle" style="cursor:pointer"><input type="checkbox" id="cal-show-cancelled" style="margin-right:6px">Show cancelled</label>';
  document.getElementById('cal-legend').innerHTML = html;
  document.querySelectorAll('.cal-chip[data-cat]').forEach(function (chip) {
    chip.addEventListener('click', function () {
      document.querySelectorAll('.cal-chip[data-cat]').forEach(function (c) { c.classList.remove('active'); });
      chip.classList.add('active');
      STATE.activeCategory = chip.getAttribute('data-cat');
      renderGrid();
    });
  });
  document.getElementById('cal-show-cancelled').addEventListener('change', function () {
    STATE.showCancelled = this.checked;
    renderGrid();
  });
}

function eventsFor(month, day) {
  var targetOrd = ordinal(STATE.selectedYear, month, day);
  return STATE.events.filter(function (e) {
    if (e.year !== STATE.selectedYear) return false;
    if (e.status === 'Cancelled' && !STATE.showCancelled) return false;
    if (STATE.activeCategory !== 'all' && e.category !== STATE.activeCategory) return false;
    var startOrd = ordinal(e.year, e.startMonth, e.startDay);
    var endOrd = ordinal(e.year, e.endMonth || e.startMonth, e.endDay || e.startDay);
    return targetOrd >= startOrd && targetOrd <= endOrd;
  });
}

function renderGrid() {
  var grid = document.getElementById('cal-grid');
  var year = STATE.selectedYear;
  var html = '<div class="cal-cell cal-head"></div>';
  MONTHS.forEach(function (m) { html += '<div class="cal-cell cal-head">'+m+'</div>'; });

  for (var day = 1; day <= 31; day++) {
    html += '<div class="cal-cell cal-daynum">'+day+'</div>';
    for (var m = 1; m <= 12; m++) {
      if (day > daysInMonth(year, m)) { html += '<div class="cal-cell" style="background:var(--kd-bg);opacity:.3"></div>'; continue; }
      var evs = eventsFor(m, day);
      var cellHtml = evs.map(function (e) {
        var color = CATEGORIES[e.category] ? CATEGORIES[e.category].color : '#8996B2';
        var dragAttr = (STATE.canEdit && e.status !== 'Cancelled') ? ' draggable="true" ondragstart="onDragStart(event,\''+e.id+'\')" ondragend="onDragEnd(event)"' : '';
        var cls = 'cal-event' + (STATE.canEdit && e.status!=='Cancelled' ? ' cal-draggable' : '') + (e.status==='Cancelled' ? ' cal-cancelled' : '');
        return '<div class="'+cls+'" style="background:'+color+'"'+dragAttr+' onclick="openEvent(\''+e.id+'\')" title="'+e.name+'">'+e.name+'</div>';
      }).join('');
      html += '<div class="cal-cell cal-dropzone" data-month="'+m+'" data-day="'+day+'">'+cellHtml+'</div>';
    }
  }
  grid.innerHTML = html;
  if (STATE.canEdit) wireDropzones();
}

function onDragStart(ev, eventId) { STATE.dragEventId = eventId; ev.target.classList.add('cal-dragging'); ev.dataTransfer.effectAllowed = 'move'; }
function onDragEnd(ev) { ev.target.classList.remove('cal-dragging'); }

function wireDropzones() {
  document.querySelectorAll('.cal-dropzone').forEach(function (zone) {
    zone.addEventListener('dragover', function (ev) { ev.preventDefault(); zone.classList.add('cal-dragover'); });
    zone.addEventListener('dragleave', function () { zone.classList.remove('cal-dragover','cal-invalid'); });
    zone.addEventListener('drop', function (ev) {
      ev.preventDefault();
      zone.classList.remove('cal-dragover','cal-invalid');
      handleReschedule(STATE.dragEventId, parseInt(zone.getAttribute('data-month'),10), parseInt(zone.getAttribute('data-day'),10));
    });
  });
}

function saveFieldsToSheet(eventId, fieldMap, onDone) {
  if (typeof SHEETS_URL === 'undefined' || !SHEETS_URL) { onDone(false, 'no connection'); return; }
  fetch(SHEETS_URL + '?action=update&tab=ims_calendar&idCol=' + encodeURIComponent('Event ID') + '&id=' + encodeURIComponent(eventId), { method:'POST', body: JSON.stringify(fieldMap) })
    .then(function (r) { return r.json(); })
    .then(function (res) { onDone(res && res.status === 'ok', res && res.message); })
    .catch(function () { onDone(false, 'connection failed'); });
}

function handleReschedule(eventId, newMonth, newDay) {
  var ev = STATE.events.filter(function (e) { return e.id === eventId; })[0];
  if (!ev) return;
  var year = ev.year;
  var oldStartOrd = ordinal(year, ev.startMonth, ev.startDay);
  var oldEndOrd = ordinal(year, ev.endMonth || ev.startMonth, ev.endDay || ev.startDay);
  var newStartOrd = ordinal(year, newMonth, newDay);
  if (newStartOrd === oldStartOrd) return;
  var newEndOrd = oldEndOrd + (newStartOrd - oldStartOrd);
  var newStart = new Date(year,0,1); newStart.setDate(newStart.getDate()+newStartOrd);
  var newEnd = new Date(year,0,1); newEnd.setDate(newEnd.getDate()+newEndOrd);
  if (newStart.getFullYear() !== year || newEnd.getFullYear() !== year) { showToast('Move would push this event outside '+year+' — cancelled.', true); return; }

  var oldVals = { startMonth: ev.startMonth, startDay: ev.startDay, endMonth: ev.endMonth, endDay: ev.endDay };
  ev.startMonth = newStart.getMonth()+1; ev.startDay = newStart.getDate();
  ev.endMonth = newEnd.getMonth()+1; ev.endDay = newEnd.getDate();
  renderGrid();

  saveFieldsToSheet(eventId, { 'Start Month': String(ev.startMonth), 'Start Day': String(ev.startDay), 'End Month': String(ev.endMonth), 'End Day': String(ev.endDay) }, function (ok) {
    if (ok) showToast('"'+ev.name+'" moved to '+MONTHS[ev.startMonth-1]+' '+ev.startDay+' — saved');
    else { Object.assign(ev, oldVals); renderGrid(); showToast('Could not save — move reverted', true); }
  });
}

function renderTbc() {
  var items = STATE.tbc.filter(function (e) { return e.year === STATE.selectedYear; });
  var html = items.map(function (e) {
    var monthLabel = e.month ? MONTHS[e.month-1] + ' ' + e.year : 'Date TBC';
    return '<div class="tbc-row"><div><div class="tbc-name">'+e.name+'</div><div class="tbc-note">'+e.note+'</div></div><div class="tbc-month">'+monthLabel+'</div></div>';
  }).join('');
  document.getElementById('tbc-list').innerHTML = html || '<div class="tbc-note">Nothing pending for '+STATE.selectedYear+'.</div>';
}

/* ── View / Edit / Cancel an existing event ──────────────────── */
function openEvent(eventId) {
  var e = STATE.events.filter(function (x) { return x.id === eventId; })[0];
  if (!e) return;
  var cat = CATEGORIES[e.category] || { label: e.category, color: '#8996B2' };
  var dateLabel = MONTH_NAMES[e.startMonth-1]+' '+e.startDay
    + ((e.endMonth!==e.startMonth || e.endDay!==e.startDay) ? ' – '+MONTH_NAMES[e.endMonth-1]+' '+e.endDay : '') + ', '+e.year;
  var actionsHtml = '';
  if (STATE.canEdit) {
    actionsHtml = '<div class="kd-form-actions">'
      + '<button class="kd-btn kd-btn-ghost" onclick="openEditEventForm(\''+e.id+'\')">✏️ Edit</button>'
      + (e.status === 'Cancelled'
          ? '<button class="kd-btn kd-btn-ghost" onclick="uncancelEvent(\''+e.id+'\')">↩ Restore</button>'
          : '<button class="kd-btn kd-btn-danger" onclick="confirmCancelEvent(\''+e.id+'\')">🗑 Cancel Event</button>')
      + '</div>';
  }
  document.getElementById('kd-modal-body').innerHTML =
    '<button class="kd-modal-close" onclick="closeEvent()">✕</button>'
    + '<div class="kd-modal-title" style="margin-bottom:4px">'+e.name+'</div>'
    + '<div style="font-size:11px;color:#8996B2;margin-bottom:14px">'+dateLabel+'</div>'
    + '<div style="display:inline-block;background:'+cat.color+';color:#0A0E1F;font-size:10px;font-weight:700;padding:3px 10px;border-radius:10px;margin-bottom:12px">'+cat.label+'</div>'
    + '<div style="font-size:12px;line-height:1.6">'+e.note+'</div>'
    + '<div style="font-size:11px;color:#8996B2;margin-top:10px">Status: '+e.status+'</div>'
    + actionsHtml;
  document.getElementById('kd-modal-overlay').classList.add('open');
}
function closeEvent() { document.getElementById('kd-modal-overlay').classList.remove('open'); }
document.getElementById('kd-modal-overlay').addEventListener('click', function (e) { if (e.target === this) closeEvent(); });

function confirmCancelEvent(eventId) {
  var e = STATE.events.filter(function (x) { return x.id === eventId; })[0];
  if (!e) return;
  var ok = confirm('Cancel "'+e.name+'"?\n\nThis marks it Cancelled and hides it from the calendar by default. It stays in the sheet as a record — nothing is permanently deleted.');
  if (!ok) return;
  var oldStatus = e.status;
  e.status = 'Cancelled';
  closeEvent(); renderGrid();
  saveFieldsToSheet(eventId, { 'Status': 'Cancelled' }, function (saved) {
    if (saved) showToast('"'+e.name+'" cancelled');
    else { e.status = oldStatus; renderGrid(); showToast('Could not save the cancellation — reverted', true); }
  });
}
function uncancelEvent(eventId) {
  var e = STATE.events.filter(function (x) { return x.id === eventId; })[0];
  if (!e) return;
  e.status = 'Confirmed';
  closeEvent(); renderGrid();
  saveFieldsToSheet(eventId, { 'Status': 'Confirmed' }, function (saved) {
    if (saved) showToast('"'+e.name+'" restored');
    else showToast('Restored locally, but could not save to the sheet', true);
  });
}

/* ── Add / Edit form (shared layout) ─────────────────────────── */
function nextEventId() {
  var maxN = 0;
  STATE.events.forEach(function (e) { var m = String(e.id).match(/(\d+)$/); if (m) maxN = Math.max(maxN, parseInt(m[1],10)); });
  return 'CAL-' + String(maxN + 1).padStart(2, '0');
}
function monthOptions(selected) { return MONTH_NAMES.map(function (name, i) { return '<option value="'+(i+1)+'"'+((i+1)===selected?' selected':'')+'>'+name+'</option>'; }).join(''); }
function dayOptions(year, month, selected) { var n = daysInMonth(year, month); var html=''; for (var d=1; d<=n; d++) html += '<option value="'+d+'"'+(d===selected?' selected':'')+'>'+d+'</option>'; return html; }
function categoryOptions(selected) { return Object.keys(CATEGORIES).map(function (k) { return '<option value="'+k+'"'+(k===selected?' selected':'')+'>'+CATEGORIES[k].label+'</option>'; }).join(''); }
function statusOptions(selected) { return STATUSES.map(function (s) { return '<option value="'+s+'"'+(s===selected?' selected':'')+'>'+s+'</option>'; }).join(''); }

document.getElementById('kd-add-event-btn').addEventListener('click', function () { openEventForm(null); });
function openEditEventForm(eventId) { openEventForm(eventId); }

function openEventForm(eventId) {
  var isEdit = !!eventId;
  var e = isEdit ? STATE.events.filter(function (x) { return x.id === eventId; })[0] : null;
  var year = STATE.selectedYear;
  var defaultMonth = e ? e.startMonth : (new Date().getMonth()+1);
  var defaultDay = e ? e.startDay : new Date().getDate();
  var defaultEndMonth = e ? e.endMonth : defaultMonth;
  var defaultEndDay = e ? e.endDay : defaultDay;

  document.getElementById('kd-modal-body').innerHTML =
    '<button class="kd-modal-close" onclick="closeEvent()">✕</button>'
    + '<div class="kd-modal-title">'+(isEdit ? 'Edit Event' : 'Add Event')+' — '+year+'</div>'
    + '<div class="kd-form-row"><label>Event Name<span class="req">*</span></label><input class="kd-input" id="af-name" placeholder="e.g. Q3 Internal Audit" value="'+(e?e.name:'')+'"></div>'
    + '<div class="kd-form-row"><label>Category<span class="req">*</span></label><select class="kd-form-select" id="af-category">'+categoryOptions(e?e.category:null)+'</select></div>'
    + '<div class="kd-form-row"><label>Start Date<span class="req">*</span></label><div class="kd-form-row-split">'
    +   '<select class="kd-form-select" id="af-start-month" onchange="onAddFormMonthChange(\'start\')">'+monthOptions(defaultMonth)+'</select>'
    +   '<select class="kd-form-select" id="af-start-day"></select>'
    + '</div></div>'
    + '<div class="kd-form-row"><label>End Date (same as start = single-day event)</label><div class="kd-form-row-split">'
    +   '<select class="kd-form-select" id="af-end-month" onchange="onAddFormMonthChange(\'end\')">'+monthOptions(defaultEndMonth)+'</select>'
    +   '<select class="kd-form-select" id="af-end-day"></select>'
    + '</div></div>'
    + '<div class="kd-form-row"><label>Status</label><select class="kd-form-select" id="af-status">'+statusOptions(e?e.status:'Planned')+'</select></div>'
    + '<div class="kd-form-row"><label>Notes</label><textarea class="kd-textarea" id="af-notes" placeholder="Any extra detail — owner, doc reference, etc.">'+(e?e.note:'')+'</textarea></div>'
    + '<div class="kd-form-error" id="af-error"></div>'
    + '<div class="kd-form-actions"><button class="kd-btn" onclick="submitEventForm('+(isEdit?"'"+eventId+"'":'null')+')">'+(isEdit?'Save Changes':'Save Event')+'</button></div>';

  populateDayOptions('start', defaultDay); populateDayOptions('end', defaultEndDay);
  document.getElementById('kd-modal-overlay').classList.add('open');
}

function populateDayOptions(which, selectedDay) {
  var monthSel = document.getElementById('af-'+which+'-month');
  var daySel = document.getElementById('af-'+which+'-day');
  daySel.innerHTML = dayOptions(STATE.selectedYear, parseInt(monthSel.value,10), selectedDay || new Date().getDate());
}
function onAddFormMonthChange(which) { populateDayOptions(which); }

function submitEventForm(eventId) {
  var name = document.getElementById('af-name').value.trim();
  var category = document.getElementById('af-category').value;
  var startMonth = parseInt(document.getElementById('af-start-month').value,10);
  var startDay = parseInt(document.getElementById('af-start-day').value,10);
  var endMonth = parseInt(document.getElementById('af-end-month').value,10);
  var endDay = parseInt(document.getElementById('af-end-day').value,10);
  var status = document.getElementById('af-status').value;
  var notes = document.getElementById('af-notes').value.trim();
  var errEl = document.getElementById('af-error');
  var year = STATE.selectedYear;

  if (!name) { errEl.textContent = 'Event name is required.'; errEl.style.display = 'block'; return; }
  if (ordinal(year, endMonth, endDay) < ordinal(year, startMonth, startDay)) { errEl.textContent = 'End date can\'t be before the start date.'; errEl.style.display = 'block'; return; }
  errEl.style.display = 'none';

  if (eventId) {
    var e = STATE.events.filter(function (x) { return x.id === eventId; })[0];
    var oldVals = Object.assign({}, e);
    e.name=name; e.category=category; e.startMonth=startMonth; e.startDay=startDay; e.endMonth=endMonth; e.endDay=endDay; e.status=status; e.note=notes||'—';
    closeEvent(); renderGrid();
    saveFieldsToSheet(eventId, {
      'Event Name': name, 'Category': category, 'Start Month': String(startMonth), 'Start Day': String(startDay),
      'End Month': String(endMonth), 'End Day': String(endDay), 'Status': status, 'Notes': e.note
    }, function (ok) {
      if (ok) showToast('"'+name+'" updated');
      else { Object.assign(e, oldVals); renderGrid(); showToast('Could not save changes — reverted', true); }
    });
  } else {
    var newEvent = { id: nextEventId(), name:name, category:category, year:year, startMonth:startMonth, startDay:startDay, endMonth:endMonth, endDay:endDay, status:status, note: notes||'—' };
    STATE.events.push(newEvent);
    closeEvent(); renderGrid();
    showToast('"'+name+'" added to the '+year+' calendar');
    if (typeof SHEETS_URL === 'undefined' || !SHEETS_URL) { showToast('Saved locally only — no live sheet connection', true); return; }
    var row = { 'Event ID':newEvent.id,'Event Name':newEvent.name,'Category':newEvent.category,'Year':String(newEvent.year),
      'Start Month':String(newEvent.startMonth),'Start Day':String(newEvent.startDay),'End Month':String(newEvent.endMonth),'End Day':String(newEvent.endDay),
      'Status':newEvent.status,'Notes':newEvent.note };
    fetch(SHEETS_URL + '?action=write&tab=ims_calendar', { method:'POST', body: JSON.stringify([row]) })
      .then(function (r) { return r.json(); })
      .then(function (res) { if (!(res && res.status==='ok')) showToast('Warning: could not confirm the save reached the sheet', true); })
      .catch(function () { showToast('Warning: could not confirm the save reached the sheet', true); });
  }
}

/* ── Init ──────────────────────────────────────────────────── */
checkEditPermission();
renderYearSelect();
renderLegend();
renderGrid();
renderTbc();

setTimeout(function () {
  if (typeof SHEETS_URL === 'undefined' || !SHEETS_URL) { document.getElementById('kd-sync-text').textContent = 'No data connection configured — showing confirmed dates only'; return; }
  fetch(SHEETS_URL + '?action=read&tab=ims_calendar')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data || !data.rows || !data.rows.length) { document.getElementById('kd-sync-text').textContent = 'ims_calendar tab not yet created — showing confirmed dates only'; return; }
      var hdr = data.headers;
      function col(name) { var n=name.toLowerCase(); for (var i=0;i<hdr.length;i++) if (String(hdr[i]||'').toLowerCase().trim()===n) return i; return -1; }
      var idCol=col('Event ID'), nameCol=col('Event Name'), catCol=col('Category'), yearCol=col('Year'),
          smCol=col('Start Month'), sdCol=col('Start Day'), emCol=col('End Month'), edCol=col('End Day'), statCol=col('Status'), noteCol=col('Notes');
      var liveEvents = data.rows.map(function (row) {
        var year=parseInt(row[yearCol],10), sm=parseInt(row[smCol],10), sd=parseInt(row[sdCol],10);
        if (!year || !sm || !sd) return null;
        return { id: idCol>=0?String(row[idCol]||'').trim():('ROW-'+Math.random()), name:String(row[nameCol]||'').trim(),
          category:String(row[catCol]||'').trim().toLowerCase(), year:year, startMonth:sm, startDay:sd,
          endMonth: emCol>=0?(parseInt(row[emCol],10)||sm):sm, endDay: edCol>=0?(parseInt(row[edCol],10)||sd):sd,
          status: statCol>=0?String(row[statCol]||'').trim():'', note: noteCol>=0?String(row[noteCol]||'').trim():'' };
      }).filter(Boolean);
      if (liveEvents.length) {
        STATE.events = liveEvents;
        liveEvents.forEach(function (e) { if (STATE.availableYears.indexOf(e.year)===-1) STATE.availableYears.push(e.year); });
        renderYearSelect(); renderGrid();
      }
      document.getElementById('kd-sync-text').textContent = 'Live — synced ' + new Date().toLocaleTimeString();
    })
    .catch(function () { document.getElementById('kd-sync-text').textContent = 'Connection unavailable — showing confirmed dates only'; });
}, 400);
</script>
