<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Security Operations Hub — SAGCO IMS</title>
<script src="auth.js"></script>
<script src="data.js"></script>
<script src="jsQR.js"></script>
<style>
  /* Same palette, card, modal and step-wizard classes as ptw-mobile.html
     (Issam, voice, 2026-11-23 — "all pages on the security hub should
     have the same format and layout as the PTW mobile version"), so
     this page reads as one consistent product with it. */
  :root{
    --pdw-bg:#0D1B35; --pdw-bg2:#142140; --pdw-bg3:#1a2a50;
    --pdw-gold:#C9A84C; --pdw-gold-lt:#E8C97A;
    --pdw-text:rgba(255,255,255,.92); --pdw-text-muted:rgba(255,255,255,.55);
    --pdw-text-dim:rgba(255,255,255,.35); --pdw-border:rgba(255,255,255,.08);
    --pdw-border-gold:rgba(201,168,76,.35);
    --pdw-blue:#5B9BD5; --pdw-red:#F0685C; --pdw-amb:#E8B339; --pdw-grn:#4FCB9E;
  }
  *{box-sizing:border-box}
  body{background:var(--pdw-bg); color:var(--pdw-text); margin:0; min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;}
  .pm-wrap{max-width:480px; margin:0 auto; padding:16px 16px 40px}
  .pm-header{display:flex; align-items:center; justify-content:space-between; padding:6px 2px 16px}
  .pm-header h1{font-size:16px; margin:0; color:var(--pdw-gold-lt); font-weight:700}
  .pm-header .pm-sub{font-size:10.5px; color:var(--pdw-text-muted); margin-top:2px}
  .pm-home-btn{display:flex; align-items:center; gap:14px; width:100%; background:var(--pdw-bg2); border:1px solid var(--pdw-border);
    border-radius:14px; padding:18px 16px; margin-bottom:12px; color:inherit; text-align:left; font-family:inherit; cursor:pointer}
  .pm-home-btn .pm-icon{font-size:28px; flex:0 0 auto}
  .pm-home-btn .pm-label{font-size:15px; font-weight:700}
  .pm-home-btn .pm-count{font-size:11.5px; color:var(--pdw-text-muted); margin-top:2px}
  .pm-home-btn.pm-primary{background:linear-gradient(135deg,var(--pdw-gold) 0%, #B08F3A 100%); color:#15223f; border:none}
  .pm-home-btn.pm-primary .pm-count{color:rgba(21,34,63,.65)}
  .pm-back{display:inline-flex; align-items:center; gap:5px; color:var(--pdw-gold-lt); font-size:12px; font-weight:600;
    text-decoration:none; background:none; border:none; padding:6px 0 14px; cursor:pointer; font-family:inherit}
  .pm-list-title{font-size:15px; font-weight:700; margin:0 0 4px}
  .pm-card{background:var(--pdw-bg2); border:1px solid var(--pdw-border); border-radius:12px; padding:14px; margin-bottom:10px}
  .pm-card-meta{font-size:12px; color:var(--pdw-text-muted); margin-top:6px; line-height:1.5}
  .pm-card-meta b{color:var(--pdw-text); font-weight:600}
  .pm-badge{font-size:10px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap}
  .pm-b-amber{background:rgba(232,179,57,.18); color:var(--pdw-amb)}
  .pm-b-blue{background:rgba(91,155,213,.18); color:var(--pdw-blue)}
  .pm-b-green{background:rgba(79,203,158,.18); color:var(--pdw-grn)}
  .pm-b-red{background:rgba(240,104,92,.18); color:var(--pdw-red)}
  .pm-b-grey{background:rgba(255,255,255,.08); color:var(--pdw-text-muted)}
  .pm-banner{margin:0 0 14px; padding:12px 14px; border-radius:10px; font-size:12.5px; line-height:1.5}
  .pm-banner-red{background:rgba(240,104,92,.14); border:1px solid var(--pdw-red); color:var(--pdw-text)}
  .pm-banner-grn{background:rgba(79,203,158,.14); border:1px solid var(--pdw-grn); color:var(--pdw-text)}
  .pm-status-pill{display:inline-flex; align-items:center; gap:6px; padding:10px 16px; border-radius:10px; font-weight:800; font-size:14px}
  .pm-status-pill.green{background:rgba(79,203,158,.18); color:var(--pdw-grn); border:2px solid var(--pdw-grn)}
  .pm-status-pill.amber{background:rgba(232,179,57,.18); color:var(--pdw-amb); border:2px solid var(--pdw-amb)}
  .pm-status-pill.red{background:rgba(240,104,92,.18); color:var(--pdw-red); border:2px solid var(--pdw-red)}
  .pm-modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:flex-end;
    justify-content:center; z-index:500}
  .pm-modal{background:var(--pdw-bg2); border:1px solid var(--pdw-border-gold); border-radius:16px 16px 0 0;
    padding:20px 16px 24px; width:100%; max-width:480px; max-height:88vh; overflow-y:auto}
  .pm-modal h3{margin:0 0 4px; font-size:15px; color:var(--pdw-gold-lt)}
  .pm-modal-sub{font-size:12px; color:var(--pdw-text-muted); margin-bottom:14px; line-height:1.5}
  .pm-step-dots{display:flex; gap:6px; justify-content:center; margin-bottom:16px}
  .pm-dot{width:8px; height:8px; border-radius:50%; background:var(--pdw-border)}
  .pm-dot.pm-active{background:var(--pdw-gold)}
  .pm-field{margin-bottom:14px}
  .pm-field label{display:block; font-size:12px; font-weight:600; margin-bottom:5px; color:var(--pdw-text-muted)}
  .pm-field input,.pm-field select,.pm-field textarea{width:100%; padding:11px 12px; font-size:14px; border-radius:8px;
    border:1px solid var(--pdw-border); background:var(--pdw-bg3); color:inherit; font-family:inherit}
  .pm-field input::placeholder,.pm-field textarea::placeholder{color:var(--pdw-text-dim)}
  .pm-step-nav{display:flex; gap:10px; margin-top:8px}
  .pm-step-nav button{flex:1; padding:13px; border-radius:9px; border:none; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit}
  .pm-btn-next{background:var(--pdw-gold); color:#15223f}
  .pm-btn-back{background:var(--pdw-bg2); color:var(--pdw-text); border:1px solid var(--pdw-border) !important}
  .pm-btn-next:disabled{opacity:.4; cursor:not-allowed}
  .pm-err{font-size:12px; color:var(--pdw-red); margin-top:6px}
  .pm-loading{text-align:center; padding:60px 10px; color:var(--pdw-text-muted); font-size:13px}
  .pm-item-row{display:flex; justify-content:space-between; align-items:center; gap:10px; background:var(--pdw-bg3);
    border:1px solid var(--pdw-border); border-radius:8px; padding:9px 12px; font-size:12px; margin-bottom:8px}
  .pm-item-row label.pm-item-label{flex:1; font-weight:600}
  .pm-item-row select{width:110px; flex-shrink:0; padding:8px; font-size:12px; border-radius:7px; border:1px solid var(--pdw-border); background:var(--pdw-bg); color:inherit}
  .pm-esc-btn{flex:1; padding:7px 8px; border-radius:7px; border:1px solid var(--pdw-border-gold); background:transparent;
    color:var(--pdw-gold-lt); font-size:10.5px; font-weight:700; cursor:pointer; font-family:inherit}
  .pm-esc-btn.pm-esc-v{border-color:var(--pdw-red); color:var(--pdw-red)}
  .pm-sec-hd{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--pdw-gold-lt);
    margin:14px 0 8px; padding-top:10px; border-top:1px solid var(--pdw-border)}
  .pm-sec-hd:first-child{border-top:none; padding-top:0; margin-top:0}
  .pm-scan-video-wrap{position:relative; display:inline-block; max-width:320px; width:100%}
  .pm-scan-video-wrap video{width:100%; border-radius:8px; display:block}
  .pm-scan-frame{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:62%; aspect-ratio:1/1; border:3px solid var(--pdw-gold); border-radius:12px; pointer-events:none}
  .pm-scan-status{margin-top:10px; font-size:12px; color:var(--pdw-text-muted)}
  .pm-scan-status.found{color:var(--pdw-grn); font-weight:700}
  .pm-person-card{border:2px solid var(--pdw-border-gold); border-radius:14px; padding:16px; background:var(--pdw-bg3); text-align:center; margin-bottom:10px}
  .pm-person-card .pm-pname{font-size:16px; font-weight:800}
  .pm-person-card .pm-pmeta{font-size:11px; color:var(--pdw-text-muted); margin:2px 0}
  .pm-idbox{margin:10px 0; padding:12px 14px; background:var(--pdw-bg3); border:2px solid var(--pdw-gold); border-radius:10px; text-align:center}
  .pm-idbox .pm-idlbl{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--pdw-text-muted); margin-bottom:4px}
  .pm-idbox .pm-idval{font-size:26px; font-weight:800; color:var(--pdw-gold-lt); letter-spacing:.5px}
  .pm-yn-pick{display:flex; gap:10px}
  .pm-yn-pick label{flex:1; display:flex; align-items:center; gap:6px; padding:11px; border-radius:8px; border:1px solid var(--pdw-border);
    background:var(--pdw-bg3); font-size:13px; cursor:pointer}
  /* Rev.1 (Issam, voice, 2026-11-24) — "fully Arabic and English":
     [dir=rtl] is set on <html> by setLang(); flex rows (display:flex,
     flex-direction defaults to row) mirror automatically under RTL,
     and text-align's initial value is "start" so it mirrors too —
     the one explicit text-align:left above is the sole exception. */
  [dir="rtl"] .pm-home-btn{ text-align:right }
  .pm-lang-btn{ background:var(--pdw-bg2); border:1px solid var(--pdw-border-gold); color:var(--pdw-gold-lt);
    font-size:11px; font-weight:700; padding:6px 10px; border-radius:6px; cursor:pointer; font-family:inherit; white-space:nowrap}
</style>
</head>
<body>
<div class="pm-wrap" id="pm-root">
  <div class="pm-loading">Loading…</div>
</div>

  function inductionState(person){
    if (!person || person['Induction Status'] !== 'Inducted' || !person['Induction Date']) return { state:'none' };
    var d = daysBetween(person['Induction Date'], todayStr());
    if (d > INDUCTION_VALID_DAYS) return { state:'expired', daysOver: d-INDUCTION_VALID_DAYS };
    if (d > INDUCTION_VALID_DAYS - INDUCTION_EXPIRING_WINDOW_DAYS) return { state:'expiring', daysLeft: INDUCTION_VALID_DAYS-d };

  // the past 7 days — distinct from the desktop page's own PPE
  // Status field, which (deliberately, there) has no such window.
  function ppeIssuedWithinWeek(person){
    if (!person || String(person['PPE Status']||'').trim() !== 'Issued' || !person['PPE Issued Date']) return false;

    if (!rows.length) return null;

      var ts = new Date((r['Date']||todayStr()) + 'T' + ((r['Patrol Time']||'00:00').length===5 ? r['Patrol Time'] : '00:00') + ':00');

    withTs.sort(function(a,b){ return b.ts - a.ts; });
    return withTs[0];

  function tickScan(){
    var video = document.getElementById('pm-scan-video'), canvas = document.getElementById('pm-scan-canvas');
    if (!video || !canvas) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA){
      var vw = video.videoWidth, vh = video.videoHeight;
      var side = Math.round(Math.min(vw, vh) * 0.62);
      var sx = Math.round((vw-side)/2), sy = Math.round((vh-side)/2);
      canvas.width = side; canvas.height = side;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(video, sx, sy, side, side, 0, 0, side, side);
      var imageData = ctx.getImageData(0,0,side,side);
      var code = jsQR(imageData.data, imageData.width, imageData.height);
      if (code && code.data){
        var statusEl = document.getElementById('pm-scan-status');
        if (statusEl){ statusEl.textContent = t('qrFound'); statusEl.classList.add('found'); }

  // Rev.2 (Issam, voice, 2026-11-24) — "the date and time should be
  // automatically stamped… once saving, it will be updated with the
  // saved time": step 0 shows a live, locked read-out of the current
  // date/time (not an editable field — nothing for the guard to pick
  // or backdate), and savePatrol below re-reads the clock at the
  // moment Save is pressed and writes THAT moment, so a round opened
  // at 9:50 and saved at 10:20 is recorded as 10:20.
  // Rev.3 (Issam, voice, 2026-11-24) — "what is the need of the
  // shift… hide the shifter": the Shift field is no longer shown to
  // the guard at all. It's still written to the sheet (the desktop
  // security-patrol-log.html register has a Shift column other
  // reports may filter by), computed silently from the save-time
  // clock via computeShift() below, using the SAME two-value Day/Night
  // taxonomy the desktop page's own dropdown already uses (not a
  // three-way Morning/Evening/Night split) so old and new rows stay
  // comparable. Day = 06:00–18:00, Night = 18:00–06:00 — Issam never
  // confirmed exact shift hours before asking for the field to be
  // hidden, so these are a reasonable default pending his correction.
  function computeShift(timeStr){
    var h = parseInt(String(timeStr||'0').split(':')[0], 10);
    if (isNaN(h)) h = 0;
    return (h >= 6 && h < 18) ? 'Day' : 'Night';
  }
  // Rev.4 (Issam, voice, 2026-11-24) — "no need to highlight a field
  // related to corrective action… what we need is the ability to
  // state observations, add many of them, and escalate each one" —
  // superseded by a further decision in the same call: observations
  // save into the EXISTING Observation Register (observations-register.html)
  // instead of going straight to Action, so Safety can triage first
  // (evaluate risk, then route to Action, Incident, or a Violation —
  // exactly the same review step every other observation already
  // gets there). So this form itself no longer escalates anywhere —
  // it only captures the observation, with photos/a document, and an
  // Urgent flag for anything that can't wait for that review.
  function compressImageFile_(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error('read failed')); };
      reader.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error('decode failed')); };
        img.onload = function(){
          var maxW = 1280;
          var scale = Math.min(1, maxW / img.width);
          var w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve({ name: (file.name||'photo').replace(/\.[^.]+$/, '') + '.jpg', mime:'image/jpeg', dataUrl: canvas.toDataURL('image/jpeg', 0.7) });
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
  function readFileAsDataUrl_(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error('read failed')); };
      reader.onload = function(){ resolve({ name:file.name, mime:file.type||'application/octet-stream', dataUrl:reader.result }); };
      reader.readAsDataURL(file);
    });
  }
  function uploadObsFile_(caseId, fileEntry, attachmentType){
    var comma = fileEntry.dataUrl.indexOf(',');
    var base64 = comma >= 0 ? fileEntry.dataUrl.slice(comma+1) : fileEntry.dataUrl;
    return postJSON('uploadFileToDrive', {}, {
      docId: caseId, fileName: fileEntry.name, mimeType: fileEntry.mime, base64Data: base64,
      uploadedBy: _me, attachmentType: attachmentType
    });
  }
  function nextObsCaseIdFactory_(){
    var max = 0;
    _obsPatrolRows.forEach(function(r){
      var m = /^PTL-(\d+)$/.exec(String(r['Case ID']||''));
      if (m) max = Math.max(max, parseInt(m[1],10));
    });
    return function(){ max++; return OBS_PATROL_ID_PREFIX + '-' + String(max).padStart(4,'0'); };
  }

  // Rev.4 — the round itself always saves Closed now: there is no
  // corrective-action concept left on the patrol round, so nothing
  // about IT is ever "open". Follow-up on any individual observation
  // is tracked entirely in the Observation Register from here on.
  function savePatrol(state, nextBtn, err){
    var anyNo = Object.keys(state.items).some(function(k){ return state.items[k]==='No'; });
    var now = new Date();
    var saveDate = now.toISOString().slice(0,10);
    var saveTime = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
    var patrolId = nextPatrolId();
    var values = {
      'Patrol ID': patrolId, 'Date': saveDate, 'Shift': computeShift(saveTime), 'Patrol Time': saveTime,
      'Area / Route Covered': state.area, 'Guard Name': _me,
      'Overall Result': anyNo ? PATROL_FAIL : PATROL_PASS,
      'Reported By': _me, 'Remarks': state.remarks,
      'Status': 'Closed', 'Record Status':'Active'
    };
    PATROL_ITEMS.forEach(function(it,i){ values[it] = state.items[i]; });
    if (nextBtn){ nextBtn.disabled = true; nextBtn.textContent = state.observations.length ? t('uploadingObs') : t('saveBtn'); }
    postJSON('write', {tab: PATROL_TAB}, [values]).then(function(res){
      if (res && res.status === 'error'){ if (err) err.textContent = t('saveFailed') + ' ' + (res.message||t('unknownErr')); if (nextBtn) nextBtn.disabled = false; return; }
      if (!state.observations.length){
        document.getElementById('pm-modal-root').innerHTML = '';
        loadAll(function(){ renderPatrol(); });
        return;
      }
      saveObservations_(state, patrolId).then(function(){
        document.getElementById('pm-modal-root').innerHTML = '';
        loadAll(function(){ renderPatrol(); });
      }).catch(function(){
        if (err) err.textContent = t('noServer');
        if (nextBtn) nextBtn.disabled = false;
      });
    }).catch(function(){ if (err) err.textContent = t('noServer'); if (nextBtn) nextBtn.disabled = false; });
  }

  // Writes each added observation to obs_patrol (one row per
  // observation), uploading its photos/document to Drive first and
  // storing the resulting links on the row. Observation Register
  // reviews these the same way as every other case; an Urgent one
  // also fires an immediate email (see sendUrgentObservationAlert in
  // google-apps-script.js) rather than waiting for that review.
  function saveObservations_(state, patrolId){
    var nextId = nextObsCaseIdFactory_();
    var now = new Date();
    var dateStr = now.toISOString().slice(0,10);
    var timeStr = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
    var chain = Promise.resolve();
    state.observations.forEach(function(o){
      chain = chain.then(function(){
        var caseId = nextId();
        var photoUploads = o.photos.map(function(p){ return uploadObsFile_(caseId, p, 'photo'); });
        var docUpload = o.docFile ? uploadObsFile_(caseId, o.docFile, 'document') : Promise.resolve(null);
        return Promise.all([Promise.all(photoUploads), docUpload]).then(function(results){
          var photoResults = results[0], docResult = results[1];
          var photoLinks = photoResults.filter(function(r){ return r && r.ok; }).map(function(r){ return r.webViewLink; });
          var docLink = (docResult && docResult.ok) ? docResult.webViewLink : '';
          var rec = {
            'Case ID': caseId, 'Date Reported': dateStr + ' ' + timeStr,
            'Location': state.area, 'Category': 'Security Patrol Observation',
            'Description': o.description, 'Reported By': _me,
            'Patrol Reference': patrolId, 'Urgent': o.urgent ? 'Yes' : 'No',
            'Photo Links': photoLinks.join(', '), 'Document Link': docLink,
            'Record Status': 'Active'
          };
          return postJSON('create', {tab: OBS_PATROL_TAB}, rec).then(function(){
            // Rev.2 (Issam, voice, 2026-11-24) — "whatever's enclosed
            // [photos/document] should even be enclosed on the email,
            // not only on the Observation Register": the SAME compressed
            // file data already sent to Drive above goes a second time
            // here, as base64, so google-apps-script.js can attach the
            // real files to the email instead of only linking them —
            // see that file's own sendUrgentObservationAlert for the
            // size guard (it falls back to these links when something
            // is too large to attach).
            if (o.urgent){
              return postJSON('sendUrgentObservationAlert', {}, {
                caseId: caseId, reportedBy: _me, area: state.area, date: dateStr, time: timeStr,
                description: o.description,
                photos: o.photos.map(function(p){
                  var comma = p.dataUrl.indexOf(',');
                  return { fileName: p.name, mimeType: p.mime, base64Data: comma>=0 ? p.dataUrl.slice(comma+1) : p.dataUrl };
                }),
                document: o.docFile ? (function(){
                  var comma = o.docFile.dataUrl.indexOf(',');
                  return { fileName: o.docFile.name, mimeType: o.docFile.mime, base64Data: comma>=0 ? o.docFile.dataUrl.slice(comma+1) : o.docFile.dataUrl };
                })() : null,
                photoLinks: photoLinks, documentLink: docLink
              }).catch(function(e){ console.log('Urgent observation alert failed to send:', e); });
            }
          });
        });
      });
    });
    return chain;
  }

  /* ───────────────────────────── Fuel view ───────────────────────────── */
  // Section labels and item text, translated for display only — the
  // sheet keys (section.key + index) are untouched (see FUEL_SECTIONS).
  var FUEL_SECTION_LABEL_KEY = { 'Pre':'preChecks', 'During':'duringChecks', 'Post':'postChecks' };
  var FUEL_SECTION_ITEMS_AR = { 'Pre':FUEL_PRE_ITEMS_AR, 'During':FUEL_DURING_ITEMS_AR, 'Post':FUEL_POST_ITEMS_AR };

  function renderFuel(){
    root.innerHTML = backBtn() + '<div class="pm-list-title">⛽ ' + t('fuelTile') + '</div>'
      + '<div class="pm-card"><div class="pm-card-meta">' + t('fuelDesc') + '</div></div>'
      + '<button type="button" class="pm-home-btn pm-primary" onclick="SH.openFuelForm()"><span class="pm-icon">➕</span><div><div class="pm-label">' + t('newFuelBtn') + '</div></div></button>';
  }

  function openFuelForm(){
    var state = { date:todayStr(), fuel:'Diesel', tanker:'', supplier:'', driver:'', attendant:_me, supervisor:'',
      items:{}, spill:'No', spillQty:'', spillCause:'', spillReach:'', remarks:'' };
    var step = 0; // 0 header, 1 Pre, 2 During, 3 Post + spill, 4 review
    var TOTAL_STEPS = 5;
    function itemKey(sectionKey, i){ return sectionKey + '-' + i; }
    function renderModal(){
      var root2 = document.getElementById('pm-modal-root');
      var body = '';
      if (step === 0){
        body = '<div class="pm-field"><label>' + t('dateLabel') + '</label><input type="date" id="pm-fd-date" value="' + esc(state.date) + '"></div>'
          + '<div class="pm-field"><label>' + t('fuelTypeLabel') + '</label><select id="pm-fd-fuel">' + FUEL_TYPES.map(function(ft){ return '<option value="'+ft+'"'+(ft===state.fuel?' selected':'')+'>'+ft+'</option>'; }).join('') + '</select></div>'
          + '<div class="pm-field"><label>' + t('tankerLabel') + '</label><input type="text" id="pm-fd-tanker" value="' + esc(state.tanker) + '"></div>'
          + '<div class="pm-field"><label>' + t('supplierLabel') + '</label><input type="text" id="pm-fd-supplier" value="' + esc(state.supplier) + '"></div>'
          + '<div class="pm-field"><label>' + t('driverLabel') + '</label><input type="text" id="pm-fd-driver" value="' + esc(state.driver) + '"></div>'
          + '<div class="pm-field"><label>' + t('attendantLabel') + '</label><input type="text" id="pm-fd-attendant" value="' + esc(state.attendant) + '"></div>'
          + '<div class="pm-field"><label>' + t('supervisorLabel') + '</label><input type="text" id="pm-fd-supervisor" value="' + esc(state.supervisor) + '"></div>';
      } else if (step >= 1 && step <= 3){
        var section = FUEL_SECTIONS[step-1];
        body = '<div class="pm-sec-hd">' + t(FUEL_SECTION_LABEL_KEY[section.key]) + '</div>' + section.items.map(function(it,i){
          var k = itemKey(section.key, i), v = state.items[k] || '';
          return '<div class="pm-item-row"><label class="pm-item-label">' + esc(itemLabel(it, i, FUEL_SECTION_ITEMS_AR[section.key])) + '</label>'
            + '<select data-k="'+k+'" class="pm-fd-item"><option value=""></option>'
            + ['Yes','No','N/A'].map(function(o){ return '<option value="'+o+'"'+(o===v?' selected':'')+'>'+(o==='Yes'?t('yesWord'):o==='No'?t('noWord'):t('naWord'))+'</option>'; }).join('')
            + '</select></div>';
        }).join('');
        if (step === 3){
          var spillYes = state.spill === 'Yes';
          body += '<div class="pm-sec-hd">' + t('spillOccurrence') + '</div>'
            + '<div class="pm-field"><label>' + t('spillOccurredQ') + '</label><select id="pm-fd-spill"><option value="No"'+(!spillYes?' selected':'')+'>' + t('noWord') + '</option><option value="Yes"'+(spillYes?' selected':'')+'>' + t('yesWord') + '</option></select></div>'
            + '<div class="pm-field"><label>' + t('spillQty') + '</label><input type="text" id="pm-fd-spillqty" value="' + esc(state.spillQty) + '"></div>'
            + '<div class="pm-field"><label>' + t('spillCause') + '</label><input type="text" id="pm-fd-spillcause" value="' + esc(state.spillCause) + '"></div>'
            + '<div class="pm-field"><label>' + t('spillReach') + '</label><input type="text" id="pm-fd-spillreach" value="' + esc(state.spillReach) + '"></div>'
            + '<div class="pm-field"><label>' + t('remarks') + '</label><textarea id="pm-fd-remarks">' + esc(state.remarks) + '</textarea></div>';
        }
      } else {
        var anyNo = Object.keys(state.items).some(function(k){ return state.items[k]==='No'; });
        body = '<div class="pm-card-meta"><b>' + t('reviewDate') + '</b> ' + esc(state.date) + ' &nbsp; <b>' + t('reviewFuel') + '</b> ' + esc(state.fuel) + '<br>'
          + '<b>' + t('reviewTanker') + '</b> ' + esc(state.tanker) + ' &nbsp; <b>' + t('reviewSupplier') + '</b> ' + esc(state.supplier) + '<br>'
          + '<b>' + t('reviewSpill') + '</b> ' + esc(state.spill) + '</div>'
          + (anyNo ? '<div class="pm-sub" style="color:var(--pdw-amb);margin-top:8px">' + t('anyNoReview') + '</div>' : '');
      }
      root2.innerHTML = '<div class="pm-modal-bg"><div class="pm-modal">'
        + '<h3>' + t('newFuelTitle') + '</h3>'
        + '<div class="pm-step-dots">' + [0,1,2,3,4].map(function(i){ return '<div class="pm-dot' + (i===step?' pm-active':'') + '"></div>'; }).join('') + '</div>'
        + body + '<div id="pm-fd-err" class="pm-err"></div>'
        + '<div class="pm-step-nav">'
        + (step>0 ? '<button type="button" class="pm-btn-back" id="pm-fd-back">' + t('backBtn') + '</button>' : '<button type="button" class="pm-btn-back" id="pm-fd-cancel">' + t('cancelBtn') + '</button>')
        + '<button type="button" class="pm-btn-next" id="pm-fd-next">' + (step<TOTAL_STEPS-1 ? t('nextBtn') : t('saveBtn')) + '</button>'
        + '</div></div></div>';
      if (step===0){
        document.getElementById('pm-fd-date').onchange = function(){ state.date = this.value; };
        document.getElementById('pm-fd-fuel').onchange = function(){ state.fuel = this.value; };
        document.getElementById('pm-fd-tanker').oninput = function(){ state.tanker = this.value; };
        document.getElementById('pm-fd-supplier').oninput = function(){ state.supplier = this.value; };
        document.getElementById('pm-fd-driver').oninput = function(){ state.driver = this.value; };
        document.getElementById('pm-fd-attendant').oninput = function(){ state.attendant = this.value; };
        document.getElementById('pm-fd-supervisor').oninput = function(){ state.supervisor = this.value; };
      } else if (step>=1 && step<=3){
        document.querySelectorAll('.pm-fd-item').forEach(function(sel){ sel.onchange = function(){ state.items[this.getAttribute('data-k')] = this.value; }; });
        if (step===3){
          document.getElementById('pm-fd-spill').onchange = function(){ state.spill = this.value; };
          document.getElementById('pm-fd-spillqty').oninput = function(){ state.spillQty = this.value; };
          document.getElementById('pm-fd-spillcause').oninput = function(){ state.spillCause = this.value; };
          document.getElementById('pm-fd-spillreach').oninput = function(){ state.spillReach = this.value; };
          document.getElementById('pm-fd-remarks').oninput = function(){ state.remarks = this.value; };
        }
      }
      var cancelBtn = document.getElementById('pm-fd-cancel'); if (cancelBtn) cancelBtn.onclick = function(){ root2.innerHTML=''; };
      var backBtn2 = document.getElementById('pm-fd-back'); if (backBtn2) backBtn2.onclick = function(){ step--; renderModal(); };
      document.getElementById('pm-fd-next').onclick = function(){
        var err = document.getElementById('pm-fd-err'); err.textContent='';
        if (step===0 && !state.tanker.trim()){ err.textContent = t('tankerRequired'); return; }
        if (step>=1 && step<=3){
          var section = FUEL_SECTIONS[step-1];
          var missing = section.items.filter(function(_,i){ return !state.items[itemKey(section.key,i)]; });
          if (missing.length){ err.textContent = t('answerAllItems'); return; }
        }
        if (step < TOTAL_STEPS-1){ step++; renderModal(); return; }
        saveFuel(state);
      };
    }
    renderModal();
  }

  function saveFuel(state){
    var rec = {
      'Date': state.date, 'Fuel Type': state.fuel, 'Tanker/Vehicle No.': state.tanker, 'Supplier': state.supplier,
      'Driver Name': state.driver, 'Receiving Attendant': state.attendant, 'Supervisor on Site': state.supervisor,
      'Spill Occurred': state.spill, 'Spill Quantity': state.spillQty, 'Spill Cause': state.spillCause,
      'Reached Drain/Soil/Water': state.spillReach, 'Remarks': state.remarks, 'Record Status':'Active'
    };
    FUEL_SECTIONS.forEach(function(section){
      section.items.forEach(function(_,i){
        var k = section.key + '-' + i;
        rec[section.key + '-' + (i+1)] = state.items[k] || '';
      });
    });
    postJSON('create', {tab: FUEL_TAB}, rec).then(function(res){
      if (res && res.status === 'error'){ alert(t('saveFailed') + ' ' + (res.message||t('unknownErr'))); return; }
      document.getElementById('pm-modal-root').innerHTML = '';
      go('fuel');
    }).catch(function(){ alert(t('noServer')); });
  }

  window.SH = {
    go: go, startScan: startScan, lookupGate: lookupGate, confirmGateEntry: confirmGateEntry, logGateAttempt: logGateAttempt,
    openPatrolForm: openPatrolForm, openFuelForm: openFuelForm, toggleLang: function(){ setLang(_lang==='ar' ? 'en' : 'ar'); }
  };

  function allowed(s){ return !!s; }
  function blockPage(){
    root.innerHTML = '<div style="text-align:center;padding:60px 20px">'
      + '<div style="font-size:15px;font-weight:600;margin-bottom:8px;color:#E06060">' + t('accessRestricted') + '</div>'
      + '<div style="font-size:12px;color:rgba(255,255,255,.6);max-width:300px;margin:0 auto 18px">' + t('pleaseSignIn') + '</div>'
      + '<a href="index.html" style="color:#C9A84C;font-size:12px;text-decoration:none;border:1px solid rgba(201,168,76,.4);padding:7px 16px;border-radius:6px">' + t('returnToPortal') + '</a></div>';
  }
  if (typeof IMS_AUTH === 'undefined'){ blockPage(); }
  else {
    IMS_AUTH.init({ onReady: function(session){
      if (!allowed(session)){ blockPage(); return; }
      _me = (IMS_AUTH.getCurrentUserName && IMS_AUTH.getCurrentUserName()) || '';
      loadAll(function(){ render(); });
    }});
  }
})();
</script>
</body>
</html>
